<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シリアルNo管理アプリ</title>
<style>
/* ============================================================
   リセット・ベース
============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  font-size: 16px;
  background: #f0f0f0;
  color: #222;
  min-height: 100vh;
}

/* ============================================================
   メイン画面
============================================================ */
/* タブバー */
.tab-bar {
  display: flex;
  background: #fff;
  border-bottom: 2px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 100;
}
.tab-btn {
  flex: 1;
  padding: 14px 4px;
  font-size: 15px;
  font-weight: bold;
  border: none;
  background: #fff;
  color: #666;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.tab-btn.active {
  color: #1a4a8a;
  border-bottom-color: #1a4a8a;
  background: #f0f5ff;
}

/* タブコンテンツ */
.tab-content { display: none; padding: 14px; }
.tab-content.active { display: block; }

/* カード */
.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

/* フォーム要素 */
.field-row {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  gap: 8px;
}
.field-label {
  font-size: 13px;
  color: #666;
  min-width: 80px;
  flex-shrink: 0;
}
input[type="text"],
input[type="date"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  background: #fff;
}
input[type="text"]:focus,
input[type="date"]:focus { border-color: #2a6acc; }
input[type="number"] {
  padding: 10px 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  background: #fff;
}
input[type="number"]:focus { border-color: #2a6acc; }

/* 選択中商品 */
.selected-product-bar {
  background: #f0f5ff;
  border: 1px solid #b0c8f0;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 14px;
}
.selected-product-bar.empty  { color: #c00; font-weight: bold; }
.selected-product-bar.filled { color: #1a4a8a; font-weight: bold; }

/* 商品候補リスト */
.product-candidates {
  border: 1px solid #ddd;
  border-radius: 8px;
  max-height: 180px;
  overflow-y: auto;
  background: #fff;
  margin-bottom: 12px;
}
.product-candidate-item {
  padding: 10px 14px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  font-size: 14px;
}
.product-candidate-item:active { background: #e8f0ff; }
.product-candidate-item .prod-name { font-weight: bold; color: #222; }
.product-candidate-item .prod-sub  { color: #888; font-size: 12px; }

/* ボタン群 */
.btn {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary { background: #1a4a8a; color: #fff; }
.btn-orange  { background: #e86010; color: #fff; }
.btn-blue    { background: #2a6acc; color: #fff; }
.btn-green   { background: #1a8a4a; color: #fff; }
.btn-gray    { background: #888;    color: #fff; }
.btn-danger  { background: #c00;    color: #fff; }
.btn:active  { opacity: 0.75; }
.btn:disabled { background: #ccc !important; color: #888 !important; cursor: not-allowed; }
.btn-full    { width: 100%; }
.btn-half    { flex: 1; }

/* ラジオボタン */
.radio-group { display: flex; gap: 24px; align-items: center; }
.radio-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  cursor: pointer;
}
.radio-label input { width: 20px; height: 20px; cursor: pointer; }

/* シリアルリスト */
.serial-list {
  background: #f8f8f8;
  border-radius: 8px;
  padding: 10px;
  min-height: 80px;
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 10px;
}
.serial-list-empty {
  color: #aaa;
  font-size: 14px;
  text-align: center;
  padding: 20px;
}
.serial-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  background: #fff;
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 14px;
  border: 1px solid #eee;
}
.serial-item .serial-no { font-family: monospace; font-weight: bold; }
.serial-item .del-btn {
  background: none;
  border: none;
  color: #c00;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.serial-count { font-size: 13px; color: #666; text-align: right; margin-bottom: 6px; }

/* 登録実行ボタンエリア */
.action-row { display: flex; gap: 10px; margin-top: 8px; }

/* 検索結果 */
.search-result-item {
  padding: 8px 12px;
  border-bottom: 1px solid #f0f0f0;
}
.search-result-item:last-child { border-bottom: none; }
.sri-header { display: flex; justify-content: space-between; align-items: flex-start; }
.sri-name   { font-weight: bold; font-size: 15px; color: #222; }
.sri-status {
  font-size: 13px;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 12px;
  white-space: nowrap;
}
.status-active   { background: #d4edda; color: #155724; }
.status-returned { background: #cce5ff; color: #004085; }
.status-canceled { background: #f8d7da; color: #721c24; }
.sri-sub { font-size: 13px; color: #666; margin-top: 4px; }

/* チェックボックス */
.check-group { display: flex; gap: 16px; flex-wrap: wrap; }
.check-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  cursor: pointer;
}
.check-label input { width: 18px; height: 18px; }

/* スキャナーモーダル */
.scanner-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.scanner-overlay.active { display: flex; }
.scanner-box {
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  width: 90vw;
  max-width: 400px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
#scannerContainer {
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.scanner-header {
  background: #222;
  color: #fff;
  text-align: center;
  padding: 12px;
  font-size: 15px;
  font-weight: bold;
}
.scanner-footer { background: #222; padding: 14px; display: flex; gap: 10px; justify-content: center; }

/* スキャン枠（ファインダー）*/
#scannerContainer { position: relative; }
.scanner-finder {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  padding-top: 35%;
  pointer-events: none;
}
.scanner-finder::before,
.scanner-finder::after,
.sf-br,
.sf-bl {
  position: absolute;
  width: 22px;
  height: 22px;
  border-color: #00e676;
  border-style: solid;
}
.scanner-finder::before { content: ''; top: 0; left: 0; border-width: 3px 0 0 3px; }
.scanner-finder::after  { content: ''; top: 0; right: 0; border-width: 3px 3px 0 0; }
.sf-br { content: ''; bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.sf-bl { content: ''; bottom: 0; left: 0; border-width: 0 0 3px 3px; }
/* ライブデコード結果 */
.scanner-live-result {
  background: #111;
  color: #4cff91;
  font-size: 13px;
  font-family: monospace;
  padding: 8px 12px;
  text-align: center;
  min-height: 34px;
  word-break: break-all;
}
/* 連続スキャン件数 */
.scanner-count {
  background: #1a4a8a;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  padding: 8px 12px;
  text-align: center;
}

/* トースト通知 */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30,30,30,0.92);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 9999;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show    { opacity: 1; }
.toast.success { background: rgba(20,120,60,0.95); }
.toast.error   { background: rgba(180,0,0,0.95); }
.toast.warn    { background: rgba(200,120,0,0.95); }

/* バージョン表示 */
.version-label {
  position: fixed;
  bottom: 6px;
  right: 10px;
  font-size: 11px;
  color: rgba(0,0,0,0.25);
  pointer-events: none;
  z-index: 1;
}

/* ユーザー情報バー */
.user-bar {
  background: #1a4a8a;
  color: #fff;
  padding: 8px 14px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ドロップダウン */
select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  background: #fff;
  outline: none;
}
select:focus { border-color: #2a6acc; }

/* スピナー */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.7);
  z-index: 9000;
  align-items: center;
  justify-content: center;
}
.loading-overlay.active { display: flex; }
.spinner {
  width: 48px; height: 48px;
  border: 5px solid #ddd;
  border-top-color: #2a6acc;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 開始シリアル入力行 */
.seq-start-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.seq-qty-row   { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.seq-qty-row .qty-input { width: 90px; }

/* 返品単独入力行 */
.return-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }

/* 認証エラー画面 */
#authErrorScreen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a4a8a 0%, #2a6acc 100%);
  padding: 24px;
}
.auth-error-box {
  background: #fff;
  border-radius: 16px;
  padding: 36px 28px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.auth-error-box h2 { color: #c00; margin-bottom: 12px; }
.auth-error-box p  { color: #555; margin-bottom: 24px; font-size: 14px; }
</style>
</head>
<body>

<!-- 認証エラー画面（セッションなし・期限切れ時） -->
<div id="authErrorScreen">
  <div class="auth-error-box">
    <h2>ログインが必要です</h2>
    <p>ポータルからログインしてください。</p>
    <button class="btn btn-primary btn-full" onclick="location.href=PORTAL_URL">ポータルへ</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="mainScreen" style="display:none;">
  <!-- ユーザー情報バー -->
  <div class="user-bar">
    <span id="userNameBar">---</span>
    <span id="versionBar" style="font-size:12px;opacity:0.7;">HTML v2.8.1</span>
  </div>

  <!-- タブバー -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('shipping')">出荷登録</button>
    <button class="tab-btn" onclick="switchTab('return')">返品・取消</button>
    <button class="tab-btn" onclick="switchTab('search')">検索</button>
  </div>

  <!-- ========================================================
       出荷登録タブ
  ======================================================== -->
  <div id="tab-shipping" class="tab-content active">
    <div class="card">
      <div class="field-row">
        <span class="field-label">①出荷日</span>
        <input type="date" id="sh-date" style="flex:1;">
      </div>
      <div class="field-row">
        <span class="field-label">②得意先</span>
        <input type="text" id="sh-customer" placeholder="サロン名を手入力" style="flex:1;" autocomplete="off">
      </div>
    </div>

    <div class="card">
      <div id="sh-selected-product" class="selected-product-bar empty">商品未選択</div>

      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn btn-orange" style="min-width:56px;" onclick="openScanner('sh-jan')">③JAN</button>
        <div style="flex:1;display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;color:#888;white-space:nowrap;">商品検索</span>
          <input type="text" id="sh-product-search" placeholder="商品名・メーカー（部分一致）"
                 oninput="filterProducts('sh')" style="flex:1;font-size:14px;padding:8px;">
        </div>
      </div>

      <div id="sh-product-candidates" class="product-candidates" style="display:none;"></div>

      <div class="field-row" style="margin-bottom:0;">
        <span class="field-label" style="font-size:13px;color:#888;">④登録方法</span>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="sh-method" value="単独" onchange="switchMethod('sh','single')" checked> 単独
          </label>
          <label class="radio-label">
            <input type="radio" name="sh-method" value="連番" onchange="switchMethod('sh','seq')"> 連番
          </label>
        </div>
      </div>
    </div>

    <!-- 単独入力エリア -->
    <div id="sh-single-area" class="card">
      <div class="return-input-row">
        <button class="btn btn-orange" onclick="openScanner('sh-single-serial')">⑤バーコード</button>
        <input type="text" id="sh-single-serial" placeholder="⑤シリアルNo" style="flex:1;" autocomplete="off">
        <button class="btn btn-blue" onclick="addSingleSerial('sh')">追加</button>
      </div>
      <div class="serial-count" id="sh-single-count">0件</div>
      <div class="serial-list" id="sh-single-list"><div class="serial-list-empty">シリアルを追加してください</div></div>
      <div class="action-row">
        <button class="btn btn-gray btn-half" onclick="clearSingleList('sh')">クリア</button>
        <button class="btn btn-primary btn-half" id="sh-single-register-btn"
                onclick="doRegisterShipping('single')" disabled>⑥登録</button>
      </div>
    </div>

    <!-- 連番入力エリア -->
    <div id="sh-seq-area" class="card" style="display:none;">
      <div class="seq-start-row">
        <button class="btn btn-orange" onclick="openScanner('sh-seq-start')">⑤バーコード</button>
        <span style="font-size:12px;color:#888;">or</span>
        <input type="text" id="sh-seq-start" placeholder="開始シリアル手入力" style="flex:1;" autocomplete="off">
      </div>
      <div class="seq-qty-row">
        <input type="number" id="sh-seq-qty" class="qty-input" placeholder="⑥連番数" min="1" max="500">
        <button class="btn btn-blue" style="flex:1;" onclick="generateSeq('sh')">⑦連番作成</button>
      </div>
      <div class="serial-count" id="sh-seq-count">0件</div>
      <div class="serial-list" id="sh-seq-list"><div class="serial-list-empty">連番作成してください</div></div>
      <div class="action-row">
        <button class="btn btn-gray btn-half" onclick="clearSeqList('sh')">連番クリア</button>
        <button class="btn btn-primary btn-half" id="sh-seq-register-btn"
                onclick="doRegisterShipping('seq')" disabled>⑧登録</button>
      </div>
    </div>
  </div><!-- /tab-shipping -->

  <!-- ========================================================
       返品・取消タブ
  ======================================================== -->
  <div id="tab-return" class="tab-content">
    <div class="card">
      <div class="field-row">
        <span class="field-label">①返品日</span>
        <input type="date" id="rt-date" style="flex:1;">
      </div>
      <div class="field-row" style="margin-bottom:0;">
        <span class="field-label">②種別</span>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="rt-kind" value="返品" checked> 返品</label>
          <label class="radio-label"><input type="radio" name="rt-kind" value="取消"> 取消(間違い)</label>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="rt-selected-product" class="selected-product-bar empty">商品未選択</div>

      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn btn-orange" style="min-width:56px;" onclick="openScanner('rt-jan')">③JAN</button>
        <div style="flex:1;display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;color:#888;white-space:nowrap;">商品検索</span>
          <input type="text" id="rt-product-search" placeholder="商品名・メーカー（部分一致）"
                 oninput="filterProducts('rt')" style="flex:1;font-size:14px;padding:8px;">
        </div>
      </div>

      <div id="rt-product-candidates" class="product-candidates" style="display:none;"></div>

      <div class="field-row" style="margin-bottom:0;">
        <span class="field-label" style="font-size:13px;color:#888;">④登録方法</span>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="rt-method" value="単独" onchange="switchMethod('rt','single')" checked> 単独
          </label>
          <label class="radio-label">
            <input type="radio" name="rt-method" value="連番" onchange="switchMethod('rt','seq')"> 連番
          </label>
        </div>
      </div>
    </div>

    <!-- 単独入力エリア -->
    <div id="rt-single-area" class="card">
      <div class="return-input-row">
        <button class="btn btn-orange" onclick="openScanner('rt-single-serial')">⑤バーコード</button>
        <input type="text" id="rt-single-serial" placeholder="⑤シリアルNo" style="flex:1;" autocomplete="off">
        <button class="btn btn-blue" onclick="addSingleSerial('rt')">追加</button>
      </div>
      <div class="serial-count" id="rt-single-count">0件</div>
      <div class="serial-list" id="rt-single-list"><div class="serial-list-empty">シリアルを追加してください</div></div>
      <div class="action-row">
        <button class="btn btn-gray btn-half" onclick="clearSingleList('rt')">クリア</button>
        <button class="btn btn-danger btn-half" id="rt-single-register-btn"
                onclick="doRegisterReturn('single')" disabled>⑥登録</button>
      </div>
    </div>

    <!-- 連番入力エリア -->
    <div id="rt-seq-area" class="card" style="display:none;">
      <div class="seq-start-row">
        <button class="btn btn-orange" onclick="openScanner('rt-seq-start')">⑤バーコード</button>
        <span style="font-size:12px;color:#888;">or</span>
        <input type="text" id="rt-seq-start" placeholder="開始シリアル手入力" style="flex:1;" autocomplete="off">
      </div>
      <div class="seq-qty-row">
        <input type="number" id="rt-seq-qty" class="qty-input" placeholder="⑥連番数" min="1" max="500">
        <button class="btn btn-blue" style="flex:1;" onclick="generateSeq('rt')">⑦連番作成</button>
      </div>
      <div class="serial-count" id="rt-seq-count">0件</div>
      <div class="serial-list" id="rt-seq-list"><div class="serial-list-empty">連番作成してください</div></div>
      <div class="action-row">
        <button class="btn btn-gray btn-half" onclick="clearSeqList('rt')">連番クリア</button>
        <button class="btn btn-danger btn-half" id="rt-seq-register-btn"
                onclick="doRegisterReturn('seq')" disabled>⑧登録</button>
      </div>
    </div>
  </div><!-- /tab-return -->

  <!-- ========================================================
       検索タブ
  ======================================================== -->
  <div id="tab-search" class="tab-content">
    <div class="card">
      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:#666;margin-bottom:6px;">期間</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="date" id="sc-from" style="flex:1;">
          <span>〜</span>
          <input type="date" id="sc-to" style="flex:1;">
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:#666;margin-bottom:6px;">状況</div>
        <div class="check-group">
          <label class="check-label"><input type="checkbox" id="sc-status-active"   checked> 出荷中</label>
          <label class="check-label"><input type="checkbox" id="sc-status-returned" checked> 返品済</label>
          <label class="check-label"><input type="checkbox" id="sc-status-canceled">         取消</label>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:#666;margin-bottom:6px;">メーカー・シリーズから探す</div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <select id="sc-maker" onchange="onMakerChange()" style="flex:1;">
            <option value="">（メーカー）</option>
          </select>

<script>
// ============================================================
// 設定
// ============================================================
const GAS_URL    = 'https://script.google.com/macros/s/AKfycbwwQVp9pRomDpUlb50CMkh6suHHCvu2gJnLkqnt-cftkudSQUWnFx13X60rh0hgINHKEw/exec';
const PORTAL_URL = 'https://beaufield.github.io/beaufield-dev/';
const SESSION_KEY = 'bf_session';

// ============================================================
// アプリ状態
// ============================================================
var appState = {
  userId:   '',
  userName: '',
  role:     '',
  token:    '',
  products: [],
  shSelectedProduct: null,
  rtSelectedProduct: null,
  shSingleSerials: [],
  shSeqSerials:    [],

  rtSeqSerials:    [],
  lastSearchResults: []
};

var SCAN_TARGET    = '';

// ============================================================
// スマホズーム補正（GAS WebApp固定幅対策 — GitHub Pagesでは不要だが残す）
// ============================================================
(function fixScale() {
  var sw = window.screen.width;
  var iw = window.innerWidth;
  if (sw > 0 && sw < iw) {
    var zoom = iw / sw;
    document.body.style.zoom     = zoom;
    document.body.style.width    = sw + 'px';
    document.body.style.maxWidth = sw + 'px';
    document.body.style.overflowX = 'hidden';
  }
})();

// ============================================================
// 初期化
// ============================================================
window.addEventListener('load', function() {
  var session = getAuthSession();
  if (!session) {
    showAuthError();
    return;
  }
  appState.userId   = session.user_id || session.userId || '';
  appState.userName = session.name    || '';
  appState.role     = session.is_admin ? 'admin' : 'user';
  appState.token    = session.token   || '';
  showMain();
});

function getAuthSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.token) return null;
    if (Date.now() > s.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  } catch(e) { return null; }
}

function showAuthError() {
  document.getElementById('authErrorScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display      = 'none';
}

function showMain() {
  document.getElementById('authErrorScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display      = 'block';
  document.getElementById('userNameBar').textContent       = appState.userName + ' さん';

  var today = todayStr();
  document.getElementById('sh-date').value = today;
  document.getElementById('rt-date').value = today;
  document.getElementById('sc-from').value = today;
  document.getElementById('sc-to').value   = today;

  document.querySelector('input[name="sh-method"][value="単独"]').checked = true;
  switchMethod('sh', 'single');
  document.querySelector('input[name="rt-method"][value="単独"]').checked = true;
  switchMethod('rt', 'single');

  loadProductMaster();
}

// ============================================================
// GAS 通信ヘルパー
// ============================================================
async function gasGet(params) {
  params.session_token = appState.token;
  var qs = Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(
      Array.isArray(params[k]) ? JSON.stringify(params[k]) : params[k]
    );
  }).join('&');
  var res  = await fetch(GAS_URL + '?' + qs);
  var data = await res.json();
  if (data && data.error === 'SESSION_INVALID') {
    localStorage.removeItem(SESSION_KEY);
    location.replace(PORTAL_URL);
  }
  return data;
}

async function gasPost(params) {
  params.session_token = appState.token;
  // 配列はJSON文字列に変換してform-encodedで送信
  var body = Object.keys(params).map(function(k) {
    var v = Array.isArray(params[k]) ? JSON.stringify(params[k]) : params[k];
    return encodeURIComponent(k) + '=' + encodeURIComponent(v);
  }).join('&');
  var res  = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  });
  var data = await res.json();
  if (data && data.error === 'SESSION_INVALID') {
    localStorage.removeItem(SESSION_KEY);
    location.replace(PORTAL_URL);
  }
  return data;
}

// ============================================================
// 商品候補フィルタ・選択
// ============================================================
// 半角全角・大文字小文字・スペース正規化（NFKC = 全角英数→半角、半角カナ→全角カナ）
function normalizeText(str) {
  return String(str || '').normalize('NFKC').toLowerCase().replace(/[\s　]+/g, ' ').trim();
}
// スペース区切りAND部分一致
function matchesQuery(text, queryNorm) {
  var t = normalizeText(text);
  var terms = queryNorm.split(' ').filter(Boolean);
  return terms.length > 0 && terms.every(function(term) { return t.indexOf(term) >= 0; });
}

function filterProducts(tab) {
  var raw          = document.getElementById(tab + '-product-search').value;
  var q            = normalizeText(raw);
  var candidatesEl = document.getElementById(tab + '-product-candidates');

  if (!q) { candidatesEl.style.display = 'none'; return; }

  // JAN or 商品コード完全一致 → 自動選択
  var exact = appState.products.find(function(p) {
    return normalizeText(p.jan) === q || normalizeText(p.code) === q;
  });
  if (exact) {
    selectProduct(tab, exact);
    document.getElementById(tab + '-product-search').value = '';
    candidatesEl.style.display = 'none';
    return;
  }

  // 商品名・商品コード・メーカーをAND部分一致で検索
  var filtered = appState.products.filter(function(p) {
    return matchesQuery(p.name, q) || matchesQuery(p.code, q) || matchesQuery(p.maker, q);
  }).slice(0, 20);

  if (filtered.length === 0) { candidatesEl.style.display = 'none'; return; }

  candidatesEl.innerHTML = filtered.map(function(p) {
    var sub = [p.code, p.maker].filter(Boolean).join(' / ');
    return '<div class="product-candidate-item" onclick="selectProductFromList(\'' + tab + '\',\'' + esc(p.code) + '\')">' +
      '<span class="prod-name">' + esc(p.name) + '</span>' +
      (sub ? '<span style="font-size:11px;color:#aaa;margin-left:8px;">' + esc(sub) + '</span>' : '') +
    '</div>';
  }).join('');
  candidatesEl.style.display = 'block';
}

function selectProductFromList(tab, code) {
  var p = appState.products.find(function(x) { return x.code === code; });
  if (p) {
    selectProduct(tab, p);
    document.getElementById(tab + '-product-search').value = '';
    document.getElementById(tab + '-product-candidates').style.display = 'none';
  }
}

function selectProduct(tab, product) {
  if (tab === 'sh') appState.shSelectedProduct = product;
  else              appState.rtSelectedProduct = product;

  var label = product.name + '（' + product.code + '）';
  if (product.maker) label += ' / ' + product.maker;
  var el = document.getElementById(tab + '-selected-product');
  el.textContent = label;
  el.className   = 'selected-product-bar filled';
  showToast('商品選択: ' + product.name, 'success');
}

function addSingleSerial(tab) {
  var inputEl = document.getElementById(tab + '-single-serial');

function renderSingleList(tab) {
  var list    = (tab === 'sh') ? appState.shSingleSerials : appState.rtSingleSerials;

    listEl.innerHTML = '<div class="serial-list-empty">シリアルを追加してください</div>';
    btnEl.disabled = true;
    return;
  }
  btnEl.disabled = false;
  listEl.innerHTML = list.map(function(s, idx) {
    return '<div class="serial-item"><span class="serial-no">' + esc(s) + '</span>' +
      '<button class="del-btn" onclick="removeSingleSerial(\'' + tab + '\',' + idx + ')">×</button></div>';
  }).join('');
}

// ============================================================
// 連番：生成・削除
// ============================================================
function generateSeq(tab) {
  var start = document.getElementById(tab + '-seq-start').value.trim();
  var qty   = parseInt(document.getElementById(tab + '-seq-qty').value);
  if (!start)          { showToast('開始シリアルを入力してください', 'warn'); return; }
  if (!qty || qty < 1) { showToast('連番数を入力してください', 'warn'); return; }
  if (qty > 500)       { showToast('連番数は500以下にしてください', 'warn'); return; }

  var match = start.match(/^(.*?)(\d+)$/);
  if (!match) { showToast('開始シリアルの末尾に数字が必要です', 'error'); return; }

  var prefix   = match[1];
  var numPart  = match[2];
  var digits   = numPart.length;
  var startNum = parseInt(numPart, 10);
  var list     = (tab === 'sh') ? appState.shSeqSerials : appState.rtSeqSerials;
  var existing = {};
  list.forEach(function(s) { existing[s] = true; });

  var added = 0;
  for (var i = 0; i < qty; i++) {
    var numStr = String(startNum + i);
    while (numStr.length < digits) numStr = '0' + numStr;
    var serial = prefix + numStr;
    if (!existing[serial]) { list.push(serial); existing[serial] = true; added++; }
  }
  renderSeqList(tab);
  showToast(added + '件の連番を作成しました', 'success');
}

function renderSeqList(tab) {
  var list    = (tab === 'sh') ? appState.shSeqSerials : appState.rtSeqSerials;
  var listEl  = document.getElementById(tab + '-seq-list');
  var countEl = document.getElementById(tab + '-seq-count');
  var btnEl   = document.getElementById(tab + '-seq-register-btn');
  countEl.textContent = list.length + '件';
  if (list.length === 0) {
    listEl.innerHTML = '<div class="serial-list-empty">連番作成してください</div>';
    btnEl.disabled = true;
    return;
  }
  btnEl.disabled = false;
  listEl.innerHTML = list.map(function(s, idx) {
    return '<div class="serial-item"><span class="serial-no">' + esc(s) + '</span>' +
      '<button class="del-btn" onclick="removeSeqSerial(\'' + tab + '\',' + idx + ')">×</button></div>';
  }).join('');
}

function removeSeqSerial(tab, idx) {
  ((tab === 'sh') ? appState.shSeqSerials : appState.rtSeqSerials).splice(idx, 1);
  renderSeqList(tab);
}

function clearSeqList(tab) {
  if (tab === 'sh') appState.shSeqSerials = []; else appState.rtSeqSerials = [];
  renderSeqList(tab);
}

// ============================================================
// 出荷登録：実行
// ============================================================
async function doRegisterShipping(method) {
  var product  = appState.shSelectedProduct;
  var customer = document.getElementById('sh-customer').value.trim();
  var shipDate = document.getElementById('sh-date').value;
  if (!product)  { showToast('商品を選択してください', 'error'); return; }
  if (!customer) { showToast('得意先を入力してください', 'error'); return; }
  if (!shipDate) { showToast('出荷日を入力してください', 'error'); return; }
  var serials = (method === 'single') ? appState.shSingleSerials : appState.shSeqSerials;
  if (serials.length === 0) { showToast('シリアルNoを追加してください', 'error'); return; }

  if (!confirm(product.name + '\n得意先: ' + customer + '\n' + serials.length + '件を出荷登録しますか？')) return;

  showLoading(true);
  try {
    var res = await gasPost({
      action:      'registerShipping',
      productCode: product.code,
      productName: product.name,
      jan:         product.jan,
      shipDate:    shipDate.replace(/-/g, '/'),
      customer:    customer,
      method:      (method === 'single') ? '単独' : '連番',
      serials:     serials
    });
    if (res.success) {

      // ── スキップなし: 全クリアして終了 ──────────────────────
      if (res.skipped === 0) {
        showToast(res.registered + '件登録完了', 'success');
        if (method === 'single') { appState.shSingleSerials = []; renderSingleList('sh'); }
        else                     { appState.shSeqSerials = [];    renderSeqList('sh'); }
        return;
      }

      // ── 一部/全件スキップあり ────────────────────────────────
      var toastMsg = res.registered > 0
        ? res.registered + '件登録完了（' + res.skipped + '件は出荷中のためスキップ）'
        : res.skipped + '件すべてが出荷中のためスキップされました';
      showToast(toastMsg, res.registered > 0 ? 'success' : 'warn');

      // 登録済み分のみリストから除去・スキップ分は保持（取消後に再登録できるよう）
      var skippedSet = {};
      res.skippedSerials.forEach(function(s) { skippedSet[s] = true; });
      if (method === 'single') {
        appState.shSingleSerials = appState.shSingleSerials.filter(function(s) { return skippedSet[s]; });
        renderSingleList('sh');
      } else {
        appState.shSeqSerials = appState.shSeqSerials.filter(function(s) { return skippedSet[s]; });
        renderSeqList('sh');
      }

      // トースト表示後に確認ダイアログ
      setTimeout(function() {
        var list    = res.skippedSerials;
        var preview = list.length <= 5
          ? list.join('\n')
          : list.slice(0, 3).join('\n') + '\n…他 ' + (list.length - 3) + '件';
        var msg2 =
          'スキップした ' + res.skipped + '件はすでに出荷中です:\n\n' +
          preview + '\n\n' +
          '取消・返品処理へ移動しますか？\n' +
          '（出荷タブのシリアルリストはそのまま保持されます）';
        if (confirm(msg2)) {
          goToReturnFromShipping(res.skippedSerials);
        }
      }, 600);

    } else {
      showToast('登録失敗: ' + res.message, 'error');
    }
  } catch(e) {
    showToast('通信エラー', 'error');
  } finally {
    showLoading(false);
  }
}

// 出荷登録のスキップ分を返品・取消タブにセットして遷移
function goToReturnFromShipping(skippedSerials) {
  var product = appState.shSelectedProduct;
  if (!product) return;

  // 返品タブに商品をセット（出荷登録と同じ商品）
  selectProduct('rt', product);

  // スキップされたシリアルを返品リストに追加（重複除外）
  skippedSerials.forEach(function(serial) {
    if (appState.rtSingleSerials.indexOf(serial) < 0) {
      appState.rtSingleSerials.push(serial);
    }
  });
  renderSingleList('rt');

  // 単独モード・今日の日付をセット
  document.querySelector('input[name="rt-method"][value="単独"]').checked = true;
  switchMethod('rt', 'single');
  document.getElementById('rt-date').value = todayStr();

  // 返品・取消タブへ遷移
  switchTab('return');
  showToast('取消後、出荷タブに戻るとシリアルが残っています', 'success');
}

// ============================================================
// 返品・取消：実行
// ============================================================
async function doRegisterReturn(method) {
  var product    = appState.rtSelectedProduct;
  var returnDate = document.getElementById('rt-date').value;
  var kind       = document.querySelector('input[name="rt-kind"]:checked').value;
  if (!product)    { showToast('商品を選択してください', 'error'); return; }
  if (!returnDate) { showToast('返品日を入力してください', 'error'); return; }
  var serials = (method === 'single') ? appState.rtSingleSerials : appState.rtSeqSerials;
  if (serials.length === 0) { showToast('シリアルNoを追加してください', 'error'); return; }

  var label = kind === '取消' ? '取消' : '返品';
  if (!confirm(product.name + '\n' + serials.length + '件を' + label + '登録しますか？')) return;

  showLoading(true);
  try {
    var res = await gasPost({
      action:      'registerReturn',
      productCode: product.code,
      returnDate:  returnDate.replace(/-/g, '/'),
      kind:        kind,
      serials:     serials
    });
    if (res.success) {
      var msg = res.updated + '件' + label + '完了';
      if (res.skipped > 0) msg += '（' + res.skipped + '件は出荷中以外のためスキップ）';
      showToast(msg, 'success');
      if (method === 'single') { appState.rtSingleSerials = []; renderSingleList('rt'); }
      else                     { appState.rtSeqSerials = [];    renderSeqList('rt'); }
    } else {
      showToast('登録失敗: ' + res.message, 'error');
    }
  } catch(e) {
    showToast('通信エラー', 'error');
  } finally {
    showLoading(false);
  }
}

// ============================================================
// 検索
// ============================================================
function resetSearchConditions() {
  var today = todayStr();
  document.getElementById('sc-from').value             = today;
  document.getElementById('sc-to').value               = today;
  document.getElementById('sc-status-active').checked   = true;
  document.getElementById('sc-status-returned').checked = true;
  document.getElementById('sc-status-canceled').checked = false;
  document.getElementById('sc-maker').value    = '';
  document.getElementById('sc-series').innerHTML     = '<option value="">（シリーズ）</option>';
  document.getElementById('sc-size').innerHTML       = '<option value="">（サイズ）</option>';
  document.getElementById('sc-product-sel').innerHTML = '<option value="">（品名）</option>';
  document.getElementById('sc-prod-name').value  = '';
  document.getElementById('sc-serial').value     = '';
  document.getElementById('sc-prod-code').value  = '';
  document.getElementById('sc-result-header').textContent = '';
  document.getElementById('sc-result-list').innerHTML     = '';
}

async function doSearch() {
  var statuses = [];
  if (document.getElementById('sc-status-active').checked)   statuses.push('出荷中');
  if (document.getElementById('sc-status-returned').checked) statuses.push('返品済');
  if (document.getElementById('sc-status-canceled').checked) statuses.push('取消');
  if (statuses.length === 0) { showToast('状況を1つ以上選択してください', 'warn'); return; }

  showLoading(true);
  try {
    var res = await gasGet({
      action:      'search',
      dateFrom:    document.getElementById('sc-from').value.replace(/-/g, '/'),
      dateTo:      document.getElementById('sc-to').value.replace(/-/g, '/'),
      statuses:    statuses,
      maker:       document.getElementById('sc-maker').value,
      series:      document.getElementById('sc-series').value,
      size:        document.getElementById('sc-size').value,
      productName: document.getElementById('sc-prod-name').value.trim(),
      serialNo:    document.getElementById('sc-serial').value.trim(),
      // 品名ドロップダウン選択を優先、なければテキスト入力の商品コード
      productCode: document.getElementById('sc-product-sel').value ||
                   document.getElementById('sc-prod-code').value.trim()
    });
    if (res.success) renderSearchResults(res.data, res.total);
    else showToast('検索失敗: ' + res.message, 'error');
  } catch(e) {
    showToast('通信エラー', 'error');
  } finally {
    showLoading(false);
  }
}

function renderSearchResults(data, total) {
  appState.lastSearchResults = data;
  document.getElementById('sc-result-header').textContent = total + '件見つかりました';
  var listEl = document.getElementById('sc-result-list');
  if (total === 0) {
    listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">該当なし</div>';
    return;
  }
  var cls = { '出荷中': 'status-active', '返品済': 'status-returned', '取消': 'status-canceled' };
  listEl.innerHTML = data.map(function(r, idx) {
    var c = cls[r.status] || 'status-active';
    return '<div class="search-result-item">' +
      '<div class="sri-header">' +
        '<span class="sri-name">' + esc(r.productName) + '</span>' +
        '<span class="sri-status ' + c + '">' + esc(r.status) + '</span>' +
      '</div>' +
      '<div style="font-size:12px;color:#888;font-family:monospace;margin-top:3px;">' + esc(r.serial) + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">' +
        '<span style="font-size:12px;color:#666;">' +
          (r.shipDate ? esc(r.shipDate) : '—') + '　' +
          (r.customer ? esc(r.customer) : '—') +
        '</span>' +
        (r.status === '出荷中'
          ? '<button class="btn btn-orange" style="padding:3px 10px;font-size:12px;" onclick="goToReturn(' + idx + ')">返品へ</button>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function goToReturn(idx) {
  var r = appState.lastSearchResults[idx];
  if (!r) return;

  // 商品マスタから商品情報を取得（なければ検索結果の情報で代用）
  var product = appState.products.find(function(p) { return p.code === r.productCode; });
  if (!product) {
    product = { code: r.productCode, name: r.productName, jan: r.jan || '', maker: '', series: '', size: '' };
  }

  // 商品を返品タブにセット
  selectProduct('rt', product);

  // シリアルを単独リストに追加（重複は除外）
  if (appState.rtSingleSerials.indexOf(r.serial) < 0) {
    appState.rtSingleSerials.push(r.serial);
    renderSingleList('rt');
    showToast('返品タブに追加: ' + r.serial, 'success');
  } else {
    showToast('すでに返品リストにあります: ' + r.serial, 'warn');
  }

  // 単独モード・今日の日付をセット
  document.querySelector('input[name="rt-method"][value="単独"]').checked = true;
  switchMethod('rt', 'single');
  document.getElementById('rt-date').value = todayStr();

  // 返品・取消タブへ遷移
  switchTab('return');
}

// ============================================================
// バーコードスキャナー
// ============================================================
function openScanner(target) {
  SCAN_TARGET    = target;
  scanLastValue  = '';
  scanLastTime   = 0;
  scanScannedSet = new Set();  // スキャン済みセットをリセット
  var isJan      = target.endsWith('-jan');
  var isMulti    = target === 'sh-single-serial' || target === 'rt-single-serial';
  scanMultiMode  = isMulti;
  scanMultiCount = 0;
  document.getElementById('scannerTitle').textContent = isJan
    ? '商品JANコードをかざしてください'
    : 'シリアルNoバーコードをかざしてください';
  document.getElementById('scannerLiveResult').textContent = '— 認識待ち —';
  var countEl = document.getElementById('scannerCount');
  var doneBtn = document.getElementById('scannerDoneBtn');
  if (isMulti) {
    countEl.textContent  = 'スキャン済み 0件';
    countEl.style.display = 'block';
    doneBtn.style.display = 'inline-block';
  } else {
    countEl.style.display = 'none';
    doneBtn.style.display = 'none';
  }
  document.getElementById('scannerOverlay').classList.add('active');
  startScanner();
}

function startScanner() {
  if (scannerActive) return;
  document.getElementById('scannerContainer').innerHTML = '';

  // formatsToSupportを指定しない → html5-qrcodeが全フォーマット対応になる
  // （EAN-13・UPC-A・Code 128・QRコード等すべて読める）
  codeReader = new Html5Qrcode('scannerContainer', { verbose: false });

  codeReader.start(
    { facingMode: 'environment' },
    { fps: 15 },
    function(decodedText) {
      // ライブ表示更新 & スキャン結果処理
      var liveEl = document.getElementById('scannerLiveResult');
      if (liveEl) liveEl.textContent = decodedText;
      onScanResult(decodedText);
    },
    null  // フレームごとのエラーは無視
  ).then(function() {
    // カメラ起動後にスキャン枠オーバーレイを追加
    var container = document.getElementById('scannerContainer');
    var finder = document.createElement('div');
    finder.className = 'scanner-finder';
    finder.innerHTML = '<span class="sf-br"></span><span class="sf-bl"></span>';
    container.appendChild(finder);
  }).catch(function(err) {
    showToast('カメラ起動エラー: ' + err, 'error');
    closeScanner();
  });

  scannerActive = true;
}

function closeScanner() {
  // フラグを先に落として多重コールバックを防ぐ
  scannerActive = false;
  scanMultiMode = false;
  document.getElementById('scannerOverlay').classList.remove('active');
  if (codeReader) {
    var reader = codeReader;
    codeReader = null;
    // html5-qrcodeのstopは非同期 — 完了後にコンテナをクリア
    reader.stop().then(function() {
      document.getElementById('scannerContainer').innerHTML = '';
    }).catch(function() {
      document.getElementById('scannerContainer').innerHTML = '';
    });
  } else {
    document.getElementById('scannerContainer').innerHTML = '';
  }
}

function finishMultiScan() {
  closeScanner();
}

// JANコード正規化（先頭0を除いた12桁に統一）
// UPC-A(12桁)・EAN-13(13桁・先頭0あり) どちらで来ても同じ12桁になる
function normalizeJan(val) {
  var v = String(val || '').replace(/\D/g, '');  // 数字のみ抽出
  // 13桁で先頭0の場合は12桁に変換（UPC-A互換）
  if (v.length === 13 && v.charAt(0) === '0') return v.slice(1);
  return v;
}
// janMatchは normalizeJan を使って比較
function janMatch(dbVal, scanned) {
  if (!dbVal || !scanned) return false;
  return normalizeJan(dbVal) === normalizeJan(scanned);
}

function playBeep() {
  try {
    var ctx  = new (window.AudioContext || window.webkitAudioContext)();
    var gain = ctx.createGain();
    gain.connect(ctx.destination);
    // 1音目（高め・短め）
    var o1 = ctx.createOscillator();
    o1.connect(gain);
    o1.type = 'sine';
    o1.frequency.value = 1046;  // C6
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    o1.start(ctx.currentTime);
    o1.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function playErrorBeep() {
  try {
    var ctx  = new (window.AudioContext || window.webkitAudioContext)();
    var gain = ctx.createGain();
    gain.connect(ctx.destination);
    var o1 = ctx.createOscillator();
    o1.connect(gain);
    o1.type = 'square';
    o1.frequency.value = 220;  // A3（低め・エラー感）
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o1.start(ctx.currentTime);
    o1.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

// JANコード誤読時のエラーフィードバック（音 + バイブ + ライブ結果欄赤字 + トースト）
function janErrorFeedback() {
  playErrorBeep();
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  var liveEl = document.getElementById('scannerLiveResult');
  if (liveEl) {
    liveEl.style.color = '#ff4444';
    liveEl.textContent = '⚠ JANコードです！ シリアルNoを読み取ってください';
    setTimeout(function() { liveEl.style.color = ''; }, 2500);
  }
  showToast('JANコードは登録できません', 'error');
}

// スキャン成功フィードバック（音 + バイブ + 画面フラッシュ）
function scanFeedback() {
  // 音
  playBeep();
  // バイブ（Android対応、iPhone非対応だがエラーにはならない）
  if (navigator.vibrate) navigator.vibrate(80);
  // 映像エリアを白くフラッシュ（iPhoneでのバイブ代替 + 視覚的確認）
  var container = document.getElementById('scannerContainer');
  if (container) {
    var flash = document.createElement('div');
    flash.style.cssText =
      'position:absolute;inset:0;background:rgba(255,255,255,0.85);' +
      'z-index:200;pointer-events:none;border-radius:4px;';
    container.appendChild(flash);
    setTimeout(function() {
      flash.style.transition = 'opacity 0.25s';
      flash.style.opacity = '0';
      setTimeout(function() {
        if (flash.parentNode) flash.parentNode.removeChild(flash);
      }, 260);
    }, 80);
  }
}

function onScanResult(value) {
  if (!value) return;
  // 連続フレームの多重検知防止（500ms以内の同値は処理しない）
  var now = Date.now();
  if (value === scanLastValue && now - scanLastTime < 500) return;
  scanLastValue = value;
  scanLastTime  = now;

  // ========== JANコード（1件でモーダルを閉じる） ==========
  if (SCAN_TARGET === 'sh-jan' || SCAN_TARGET === 'rt-jan') {
    scanFeedback();
    closeScanner();
    var tab = SCAN_TARGET === 'sh-jan' ? 'sh' : 'rt';
    // UPC-A(12桁)とJAN(13桁・先頭0)の差異を吸収して検索
    var p   = appState.products.find(function(x) { return janMatch(x.jan, value) || janMatch(x.code, value); });
    if (p) selectProduct(tab, p);
    else   showToast('商品が見つかりません: ' + value, 'error');
    return;
  }

  // ========== シリアルNo 連続スキャンモード ==========
  if (scanMultiMode) {
    // JANコード（13桁の数字のみ）は弾く
    if (/^\d{13}$/.test(value)) {
      janErrorFeedback();
      return;
    }
    // 既にスキャン済みの値は無視（同バーコードの再読み込み防止）
    if (scanScannedSet.has(value)) {
      document.getElementById('scannerLiveResult').textContent = '⚠ スキャン済み: ' + value;
      return;
    }
    scanFeedback();
    var inputEl = document.getElementById(SCAN_TARGET);
    if (inputEl) {
      inputEl.value = value;
      if      (SCAN_TARGET === 'sh-single-serial') addSingleSerial('sh');
      else if (SCAN_TARGET === 'rt-single-serial') addSingleSerial('rt');
    }
    scanScannedSet.add(value);  // スキャン済みとして記録
    scanMultiCount++;
    document.getElementById('scannerCount').textContent = 'スキャン済み ' + scanMultiCount + '件';
    document.getElementById('scannerLiveResult').textContent = '✓ ' + value;
    return;  // モーダルを閉じない
  }

  // ========== シリアルNo 通常モード（連番開始など） ==========
  // JANコード（13桁の数字のみ）は弾く
  if (/^\d{13}$/.test(value)) {
    janErrorFeedback();
    return;
  }
  scanFeedback();
  closeScanner();
  var inputEl2 = document.getElementById(SCAN_TARGET);
  if (inputEl2) {
    inputEl2.value = value;
    showToast('開始シリアルをセットしました: ' + value, 'success');
  }
}

// ============================================================
// ユーティリティ
// ============================================================
function todayStr() {
  var d   = new Date();
  var y   = d.getFullYear();
  var m   = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

var toastTimer;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast ' + (type || '');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

function showLoading(show) {
  document.getElementById('loadingOverlay').className = 'loading-overlay' + (show ? ' active' : '');
}
</script>
