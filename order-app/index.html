<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>発注アプリ</title>
  <style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f6f3;color:#222}main{max-width:34rem;margin:15vh auto;padding:2rem}a{display:inline-block;background:#333;color:#fff;padding:1rem 1.5rem;border-radius:.5rem;text-decoration:none}small{display:block;margin-top:2rem;color:#666}</style>
</head>
<body>
  <main>
    <h1>発注アプリ</h1>
    <p>新しい画面に移動します。移動しない場合は下のボタンを押してください。</p>
    <a href="./db/">発注アプリを開く</a>
    <small id="version"></small>
  </main>
  <script>
    const APP_VERSION = 'v1.79.0';
    document.getElementById('version').textContent = APP_VERSION;
    // 古いブックマークも新画面へ。端末のカート・受付控え・セッションは変更しない。
    const target = new URL('./db/', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
