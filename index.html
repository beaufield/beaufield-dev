<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Beaufield ポータル</title>
  <link rel="icon" href="portal/app_portal.png" type="image/png">
  <style>
    :root {
      --primary:       #2563eb;
      --primary-dark:  #1d4ed8;
      --primary-light: #eff6ff;
      --bg:            #f1f5f9;
      --card:          #ffffff;
      --text:          #0f172a;
      --text-sub:      #64748b;
      --border:        #e2e8f0;
      --danger:        #ef4444;
      --danger-light:  #fef2f2;
      --success:       #16a34a;
      --success-light: #f0fdf4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── ローディング ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ログイン画面 ── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .login-logo p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    /* ユーザーグリッド */
    .user-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .user-btn {
      background: var(--bg);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .user-btn:hover  { background: var(--primary-light); }
    .user-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    /* PIN入力 */
    .pin-section { margin-bottom: 20px; }
    .pin-dots {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin: 10px 0 12px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.15s;
    }
    .pin-dot.filled { background: var(--primary); }

    .pin-input {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-align: center;
      letter-spacing: 10px;
      outline: none;
      background: var(--bg);
      -webkit-text-security: disc;
      text-security: disc;
    }
    .pin-input:focus {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    /* ログインボタン */
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-btn:hover    { background: var(--primary-dark); }
    .login-btn:disabled { background: var(--border); color: var(--text-sub); cursor: not-allowed; }

    /* エラーメッセージ */
    .error-msg {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--danger-light);
      border-radius: 8px;
      font-size: 13px;
      color: var(--danger);
      text-align: center;
      display: none;
    }

    /* PIN忘れ案内 */
    .pin-forgot {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 成功メッセージ */
    .success-msg {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--success-light);
      border-radius: 8px;
      font-size: 13px;
      color: var(--success);
      text-align: center;
      display: none;
    }

    /* ── ホーム画面 ── */
    #homeScreen { display: none; min-height: 100vh; }

    .home-header {
      background: var(--primary);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .home-header-left h2 { font-size: 18px; font-weight: 700; }
    .home-header-left p  { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    .header-actions { display: flex; gap: 8px; }

    .manage-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .manage-btn:hover { background: rgba(255,255,255,0.3); }

    .pin-change-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .pin-change-btn:hover { background: rgba(255,255,255,0.3); }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.3); }

    .home-body { padding: 24px 20px; }
    .home-body > p {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }

    /* アプリタイル */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 480px) { .app-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 640px) { .app-grid { grid-template-columns: repeat(4, 1fr); } }

    .app-tile {
      background: var(--card);
      border-radius: 16px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }
    .app-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      border-color: var(--primary-light);
    }
    .app-tile:active { transform: translateY(0); }

    .app-icon  { font-size: 38px; line-height: 1; }
    .app-label { font-size: 13px; font-weight: 600; line-height: 1.3; }

    .no-apps {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-sub);
      padding: 40px 0;
      font-size: 14px;
    }

    .home-footer {
      text-align: center;
      padding: 32px 20px 20px;
      font-size: 11px;
      color: var(--text-sub);
    }

    /* ── モーダル ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }
    .modal-close {
      background: var(--bg);
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--border); }

    /* モーダル内PINリセットセクション */
    #pinResetSection {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    #pinResetSection .section-label { margin-bottom: 8px; }

    .reset-target-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 14px;
    }

    .modal-pin-input {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-align: center;
      letter-spacing: 10px;
      outline: none;
      background: var(--bg);
      -webkit-text-security: disc;
      text-security: disc;
    }
    .modal-pin-input:focus {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .reset-btn {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reset-btn:hover { background: var(--primary-dark); }
  </style>
</head>
<body>

<!-- ローディング -->
<div class="loading-overlay" id="loading">
  <div class="spinner" id="loadingSpinner"></div>
  <div id="loadingNote" style="display:none;margin-top:16px;text-align:center;max-width:300px;padding:0 20px">
    <div id="loadingNoteMsg" style="font-size:13px;line-height:1.8;color:#6b7280"></div>
    <button type="button" id="loadingReloadBtn" onclick="location.reload()"
      style="display:none;margin-top:14px;padding:10px 24px;font-size:14px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer">
      やり直す
    </button>
  </div>
</div>

<!-- ── ログイン画面 ── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Beaufield</h1>
      <p>アプリポータル</p>
    </div>

    <div class="section-label">ユーザーを選択</div>
    <div class="user-grid" id="userGrid">
      <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-sub);font-size:13px">読み込み中...</div>
    </div>

    <div class="pin-section">
      <div class="section-label">PIN（4桁）</div>
      <div class="pin-dots">
        <div class="pin-dot" id="dot0"></div>
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
      </div>
      <input type="password" id="pinInput" class="pin-input"
        maxlength="4" inputmode="numeric" pattern="[0-9]*"
        placeholder="• • • •" autocomplete="off">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="pin-forgot">PINを忘れた場合は管理者にお問い合わせください</div>
  </div>
</div>

<!-- ── ホーム画面 ── -->
<div id="homeScreen">
  <div class="home-header">
    <div class="home-header-left">
      <h2>Beaufield</h2>
      <p id="welcomeText">ようこそ</p>
    </div>
    <div class="header-actions">
      <button class="manage-btn" id="manageBtn" onclick="openManageModal()">ユーザー管理</button>
      <button class="pin-change-btn" onclick="openChangePinModal()">PIN変更</button>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>
  <div class="home-body">
    <p>アプリ一覧</p>
    <div class="app-grid" id="appGrid">
      <div class="no-apps">読み込み中...</div>
    </div>
  </div>
  <div class="home-footer" id="portalVersion"></div>
</div>

<!-- ── ユーザー管理モーダル ── -->
<div class="modal-overlay" id="manageModal" onclick="onManageOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h3>ユーザー管理</h3>
      <button class="modal-close" onclick="closeManageModal()">✕</button>
    </div>

    <div class="section-label">PINをリセットするユーザーを選択</div>
    <div class="user-grid" id="manageUserGrid">
      <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-sub);font-size:13px">読み込み中...</div>
    </div>

    <div id="pinResetSection" style="display:none;">
      <div class="section-label">新しいPINをセット</div>
      <div class="reset-target-name" id="resetTargetName"></div>
      <input type="password" id="newPinInput" class="modal-pin-input"
        maxlength="4" inputmode="numeric" pattern="[0-9]*"
        placeholder="• • • •" autocomplete="off">
      <button class="reset-btn" onclick="doResetPin()">PINをセット</button>
    </div>

    <div class="error-msg"   id="manageErrorMsg"></div>
    <div class="success-msg" id="manageSuccessMsg"></div>
  </div>
</div>

<!-- ── PIN変更モーダル ── -->
<div class="modal-overlay" id="changePinModal" onclick="onChangePinOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h3>PIN変更</h3>
      <button class="modal-close" onclick="closeChangePinModal()">✕</button>
    </div>

    <div style="margin-bottom:16px;">
      <div class="section-label">現在のPIN</div>
      <input type="password" id="cpCurrentPin" class="modal-pin-input"
        maxlength="4" inputmode="numeric" pattern="[0-9]*"
        placeholder="• • • •" autocomplete="off">
    </div>
    <div style="margin-bottom:16px;">
      <div class="section-label">新しいPIN</div>
      <input type="password" id="cpNewPin" class="modal-pin-input"
        maxlength="4" inputmode="numeric" pattern="[0-9]*"
        placeholder="• • • •" autocomplete="off">
    </div>
    <div style="margin-bottom:20px;">
      <div class="section-label">新しいPIN（確認）</div>
      <input type="password" id="cpConfirmPin" class="modal-pin-input"
        maxlength="4" inputmode="numeric" pattern="[0-9]*"
        placeholder="• • • •" autocomplete="off">
    </div>

    <button class="reset-btn" onclick="doChangePin()">PINを変更する</button>
    <div class="error-msg"   id="changePinErrorMsg"></div>
    <div class="success-msg" id="changePinSuccessMsg"></div>
  </div>
</div>

<script>
  const GAS_URL      = 'https://script.google.com/macros/s/AKfycbzNVW7AaPUTuwneE-M40DTN1clO5VT2yLCHq7cjYvaHqfMfXgVi38UAOsDZQbmmN3wOzw/exec';
  const APP_VERSION  = 'v1.8.0';
  const SESSION_KEY  = 'bf_session';
  const SESSION_HOURS = 24 * 7;

  // ── アプリ一覧のローカルキャッシュ（v1.7.0） ──────────────────
  // 開くたびにGASへ取りに行くと実測3.25秒待たされる（混雑時は最大57.1秒）。
  // アプリ一覧が変わるのは月1回あるかどうかなので、前回の内容を即座に出して
  // 最新化は裏で走らせる（予約管理 v1.24.x で実証済みの形。6.2秒→0.04秒）。
  //
  // ⚠️ タイルは「ただのリンク」であって権限を与えない。各アプリが自分で
  //    user_app_roles を読んで拒否する（7アプリすべてで確認済み・2026-09-18）。
  //    そのため一覧が数秒古くても、権限のズレは起きない。
  // ⚠️ 利用者ごとに分けること（共有端末で他人の一覧を出さないため）。
  // ⚠️ ログアウトとセッション切れでは必ず破棄すること。
  const APPS_CACHE_KEY = 'bf_portal_apps_v1';
  const APPS_CACHE_TTL = SESSION_HOURS * 60 * 60 * 1000;  // セッション有効期限と揃える

  function loadAppsCache(userId) {
    try {
      const raw = localStorage.getItem(APPS_CACHE_KEY);
      if (!raw) return null;
      const c = JSON.parse(raw);
      if (!c || c.user_id !== userId) return null;   // 別人のキャッシュは使わない
      if (Date.now() > c.expires) return null;
      return (Array.isArray(c.apps) && c.apps.length) ? c.apps : null;
    } catch (e) { return null; }
  }

  function saveAppsCache(userId, apps) {
    try {
      localStorage.setItem(APPS_CACHE_KEY, JSON.stringify({
        user_id: userId, expires: Date.now() + APPS_CACHE_TTL, apps: apps
      }));
    } catch (e) {}   // 保存できなくても表示は妨げない（次回は普通に取りに行くだけ）
  }

  function clearAppsCache() {
    try { localStorage.removeItem(APPS_CACHE_KEY); } catch (e) {}
  }

  let selectedUserId     = null;
  let manageSelectedId   = null;
  let manageSelectedName = null;

  // ── 初期化 ────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('portalVersion').textContent = 'Beaufield Portal ' + APP_VERSION;

    // ⚠️ 掃除は「ログインの前」に必ず動かすこと。
    //    v1.5.0 では showHome()（＝ログイン成功後）から呼んでいたため、
    //    保存容量が原因でログインできなくなった人には永久に届かなかった。
    //    直すはずの機能が、直すべき問題の内側に閉じ込められていた。
    try { cleanupSharedStorage(); } catch (e) {}

    const session = getSession();
    if (session) {
      await showHome(session.user_id, session.name, session.is_admin);
    } else {
      await loadUsers();
    }

    document.getElementById('pinInput').addEventListener('input', e => {
      const len = e.target.value.length;
      for (let i = 0; i < 4; i++) {
        document.getElementById('dot' + i).classList.toggle('filled', i < len);
      }
      if (len === 4) doLogin(); // 4桁入力で自動ログイン
    });
    document.getElementById('pinInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // 管理者PIN リセットモーダルのEnterキー対応
    document.getElementById('newPinInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doResetPin();
    });

    // PIN変更モーダルのEnterキー対応
    ['cpCurrentPin','cpNewPin','cpConfirmPin'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') doChangePin();
      });
    });
  });

  // ── 端末ストレージの掃除（v1.5.0） ─────────────────────────────
  // localStorageの上限はオリジン単位で、ポータル配下の全アプリが共有する。
  // 運用終了したアプリのキャッシュが残り続けると、他アプリ（発注アプリの商品マスター等）が
  // 保存できなくなる。掃除は「全員が必ず通る場所」＝このポータルに置く。
  // 経緯・実測: order-app/現状実測と基盤刷新_調査報告.md §9・§10
  //
  // ⚠️ 消すのは下記2種類だけ。セッション・未確定発注の控え・商品マスターには絶対に触らない。
  const CLEANUP_RECORD_KEY = 'bf_portal_cleanup_v1';

  function cleanupSharedStorage() {
    let removed = 0, freedChars = 0;
    try {
      // 削除しながらlocalStorage.key(i)を回すとindexがずれるので、先に全キーを集める
      const all = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k) all.push(k);
      }

      const doomed = [];

      // ① ルート訪問チェッカー（運用終了・ポータル非表示）のキャッシュを全削除
      all.forEach(k => { if (k.indexOf('bfc_') === 0) doomed.push(k); });

      // ② 予約管理は版ごとに新しいキーを使い、古いキーを消していない。
      //    最新版（末尾の数字が最大のもの）だけ残し、それ以外を削除する。
      //    ※「現行版の名前」をここに書き写さないこと。予約管理が版を上げるたびに
      //      ここが陳腐化して、逆に現行キャッシュを消してしまうため
      const yoyaku = all.filter(k => /^bf_yoyaku_v\d+$/.test(k));
      if (yoyaku.length > 1) {
        const newest = yoyaku.slice().sort((a, b) =>
          parseInt(a.replace(/\D/g, ''), 10) - parseInt(b.replace(/\D/g, ''), 10)
        ).pop();
        yoyaku.forEach(k => { if (k !== newest) doomed.push(k); });
      }

      // ③ 発注アプリの旧世代キー。現行は bf_pm_v2 系で、これらはもう誰も読まない。
      //    実測で bf_pm だけで267万文字（約5.1MB）。オリジン合計が約5.45MBと
      //    iOS Safari の上限（約5MB）を超えており、全アプリの保存失敗の原因になる。
      //    ⚠️ 完全一致の配列で持つこと。前方一致や正規表現にすると bf_pm_v2 を巻き込む。
      //    ⚠️ bf_prod_hist は T-4 の保護対象。ここに足さないこと。
      const SUPERSEDED_KEYS = ['bf_pm'];
      all.forEach(k => { if (SUPERSEDED_KEYS.indexOf(k) >= 0) doomed.push(k); });

      doomed.forEach(k => {
        try {
          freedChars += k.length + (localStorage.getItem(k) || '').length;
          localStorage.removeItem(k);
          removed++;
        } catch (e) { /* 1件失敗しても残りは続ける */ }
      });

      if (removed > 0) {
        console.info('[portal] cleaned ' + removed + ' stale keys (' + freedChars + ' chars)');
        // 効いたことを後から確認できるよう、小さな記録だけ残す（200文字未満）
        try {
          localStorage.setItem(CLEANUP_RECORD_KEY, JSON.stringify({
            at: new Date().toISOString(), removed: removed, freedChars: freedChars, v: APP_VERSION
          }));
        } catch (e) {}
      }
    } catch (e) {
      // 掃除の失敗でログインを妨げない
      console.warn('[portal] cleanup skipped:', e);
    }
    return { removed: removed, freedChars: freedChars };
  }

  // ── セッション管理 ─────────────────────────────────────────────
  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (Date.now() > s.expires) { localStorage.removeItem(SESSION_KEY); return null; }
      return s;
    } catch { return null; }
  }

  function saveSession(user_id, name, token, is_admin) {
    const expires = Date.now() + SESSION_HOURS * 60 * 60 * 1000;
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      user_id, name, token: token || '', expires, is_admin: !!is_admin
    }));
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  // ── ユーザー一覧読み込み ──────────────────────────────────────
  async function loadUsers() {
    try {
      const res  = await gasGet('getUsers', {});
      const grid = document.getElementById('userGrid');
      if (!res.success || !res.users || !res.users.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-sub);font-size:13px">ユーザーが見つかりません</div>';
        return;
      }
      grid.innerHTML = res.users.map(u =>
        `<button class="user-btn" data-id="${escHtml(u.user_id)}">${escHtml(u.name)}</button>`
      ).join('');
      grid.querySelectorAll('.user-btn').forEach(btn => {
        btn.addEventListener('click', () => selectUser(btn.dataset.id));
      });
    } catch {
      showError('ユーザー情報の読み込みに失敗しました');
    }
  }

  // ── ユーザー選択 ──────────────────────────────────────────────
  function selectUser(id) {
    selectedUserId = id;
    document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.user-btn[data-id="${id}"]`).classList.add('active');
    document.getElementById('pinInput').focus();
    hideError();
  }

  // ── ログイン ──────────────────────────────────────────────────
  async function doLogin() {
    const pin = document.getElementById('pinInput').value;
    if (!selectedUserId)   { showError('ユーザーを選択してください'); return; }
    if (pin.length !== 4)  { showError('4桁のPINを入力してください'); return; }

    setLoading(true);
    try {
      const res = await gasPost('login', { user_id: selectedUserId, pin, requestId: newRequestId() });
      if (res.success) {
        saveSession(res.user_id, res.name, res.session_token, res.is_admin);
        clearPinInput();
        await showHome(res.user_id, res.name, res.is_admin);
      } else if (_looksLikeLostBody(res)) {
        // requestId を付けているので通常はここへ来ない（_fetchJson が自動で引き直す）。
        // 引き直しても駄目だったときの最後の受け皿。勝手に再送を重ねない。
        showError('結果を受け取れませんでした。お手数ですが、もう一度お試しください。');
        clearPinInput();
      } else {
        showError(res.message || 'ログインに失敗しました');
        clearPinInput();
      }
    } catch (e) {
      showError(describeError(e));
    } finally {
      setLoading(false);
    }
  }

  // ── ホーム画面表示 ─────────────────────────────────────────────
  // アプリタイルを描画する（キャッシュ表示・最新化の両方から使う）
  function renderAppTiles(apps) {
    const grid = document.getElementById('appGrid');
    if (!apps || !apps.length) {
      grid.innerHTML = '<div class="no-apps">利用可能なアプリがありません<br><small style="font-size:11px;margin-top:4px;display:block">管理者にお問い合わせください</small></div>';
      return;
    }
    grid.innerHTML = apps.map(app =>
      `<a class="app-tile" href="${escHtml(app.url)}" target="_blank" rel="noopener noreferrer">
        <div class="app-icon">${escHtml(app.icon)}</div>
        <div class="app-label">${escHtml(app.label)}</div>
      </a>`
    ).join('');
  }

  function fetchUserApps() {
    const session = getSession();
    return gasPost('getUserApps', { session_token: session ? session.token : '' });
  }

  // セッション切れの出口。キャッシュを残したままログイン画面へ戻さないこと。
  function handleSessionExpired() {
    clearSession();
    clearAppsCache();
    backToLogin();
    showError('ログインの有効期限が切れました。もう一度ログインしてください。');
  }

  // 裏で一覧を最新化する。画面は既に出ているので待ち時間は発生しない。
  // ⚠️ ここはセッション切れの検出も兼ねている。
  //    キャッシュにサーバーの判断を上書きさせないこと。
  //    通信エラーだけは黙って据え置く（判断材料が得られていないため）。
  async function refreshAppsInBackground(userId) {
    let res;
    try {
      res = await fetchUserApps();
    } catch (e) {
      return;   // 圏外・タイムアウト等: キャッシュ表示のまま
    }
    if (!res.success) {
      if (res.error === 'SESSION_INVALID') handleSessionExpired();
      return;
    }
    renderAppTiles(res.apps);
    if (res.apps && res.apps.length) saveAppsCache(userId, res.apps);
    else clearAppsCache();
  }

  async function showHome(userId, name, isAdmin) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('homeScreen').style.display  = 'block';
    document.getElementById('welcomeText').textContent   = 'ようこそ、' + name + 'さん';

    // 管理者のみ「ユーザー管理」ボタンを表示
    document.getElementById('manageBtn').style.display = isAdmin ? 'block' : 'none';

    // ① キャッシュがあれば即表示（GAS待ちゼロ）。最新化は裏で走らせる。
    //    アプリが増減しても、約3秒後にこの画面が自動で書き換わる。
    const cached = loadAppsCache(userId);
    if (cached) {
      renderAppTiles(cached);
      refreshAppsInBackground(userId);
      return;
    }

    // ② キャッシュなし（初回・別端末・7日以上ぶり）: 従来どおり取得を待つ
    setLoading(true);
    try {
      const res = await fetchUserApps();
      if (!res.success && res.error === 'SESSION_INVALID') { handleSessionExpired(); return; }
      renderAppTiles(res.success ? res.apps : null);
      if (res.success && res.apps && res.apps.length) saveAppsCache(userId, res.apps);
    } catch (e) {
      // 失敗しても利用者が必ず次の操作を取れるようにする（行き止まりを作らない）
      document.getElementById('appGrid').innerHTML =
        '<div class="no-apps">' + escHtml(describeError(e)) +
        '<br><button type="button" onclick="location.reload()" ' +
        'style="margin-top:12px;padding:8px 20px;font-size:13px;border:1px solid #d1d5db;' +
        'border-radius:6px;background:#fff;cursor:pointer">やり直す</button></div>';
    } finally {
      setLoading(false);
    }
  }

  // ── ログアウト ─────────────────────────────────────────────────
  // ログイン画面へ戻す。エラー表示の扱いは呼び出し側に任せる
  // （ログアウトは消したい／セッション切れは出したい、と要件が逆のため）
  function backToLogin() {
    document.getElementById('homeScreen').style.display  = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    selectedUserId = null;
    clearPinInput();
    document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
    loadUsers(); // ユーザー一覧を再取得
  }

  async function doLogout() {
    const session = getSession();
    // 通信失敗時も端末側は必ずログアウトする。成功時はサーバー側トークンも失効する。
    try {
      if (session && session.token) {
        await gasPost('logout', { session_token: session.token });
      }
    } catch (e) {}
    clearSession();
    // ⚠️ 共有端末で次の人に前の人のアプリ一覧を見せないため、必ず破棄する
    clearAppsCache();
    hideError();
    backToLogin();
  }

  // ── ユーザー管理モーダル ──────────────────────────────────────
  async function openManageModal() {
    manageSelectedId   = null;
    manageSelectedName = null;
    document.getElementById('pinResetSection').style.display = 'none';
    document.getElementById('newPinInput').value = '';
    document.getElementById('manageErrorMsg').style.display   = 'none';
    document.getElementById('manageSuccessMsg').style.display = 'none';
    document.getElementById('manageModal').style.display = 'flex';

    // ユーザー一覧を読み込む
    const grid = document.getElementById('manageUserGrid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-sub);font-size:13px">読み込み中...</div>';
    try {
      const res = await gasGet('getUsers', {});
      if (!res.success || !res.users || !res.users.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-sub);font-size:13px">ユーザーが見つかりません</div>';
        return;
      }
      grid.innerHTML = res.users.map(u =>
        `<button class="user-btn" data-mid="${escHtml(u.user_id)}" data-name="${escHtml(u.name)}">${escHtml(u.name)}</button>`
      ).join('');
      grid.querySelectorAll('.user-btn').forEach(btn => {

      });

  function closeManageModal() {
    document.getElementById('manageModal').style.display = 'none';
  }

  function onManageOverlayClick(e) {
    if (e.target === document.getElementById('manageModal')) closeManageModal();
  }

  function selectManageUser(id, name) {
    manageSelectedId   = id;
    manageSelectedName = name;
    document.querySelectorAll('#manageUserGrid .user-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`#manageUserGrid .user-btn[data-mid="${id}"]`).classList.add('active');
    document.getElementById('resetTargetName').textContent = name + ' さんの新しいPIN';
    document.getElementById('pinResetSection').style.display = 'block';
    document.getElementById('newPinInput').value = '';
    document.getElementById('manageErrorMsg').style.display   = 'none';
    document.getElementById('manageSuccessMsg').style.display = 'none';
    document.getElementById('newPinInput').focus();

  // ── PINリセット実行 ────────────────────────────────────────────
  async function doResetPin() {
    const newPin = document.getElementById('newPinInput').value;
    if (!manageSelectedId) {
      showManageMsg('error', 'ユーザーを選択してください');
      return;
    }
    if (newPin.length !== 4 || !/^\d{4}$/.test(newPin)) {
      showManageMsg('error', '4桁の数字を入力してください');
      return;
    }

    const session = getSession();
    if (!session) {
      showManageMsg('error', 'セッションが切れています。再ログインしてください');
      return;
    }

    setLoading(true);
    try {
      const res = await gasPost('resetPin', {
        session_token:   session.token,
        target_user_id:  manageSelectedId,
        new_pin:         newPin,
        requestId:       newRequestId()
      });
      if (res.success) {
        showManageMsg('success', manageSelectedName + ' さんのPINを更新しました');
        document.getElementById('newPinInput').value = '';
        // 選択状態を解除
        manageSelectedId   = null;
        manageSelectedName = null;
        document.querySelectorAll('#manageUserGrid .user-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('pinResetSection').style.display = 'none';
      } else {
        showManageMsg('error', res.message || 'PINの更新に失敗しました');
      }
    } catch {
      showManageMsg('error', '通信エラーが発生しました');
    } finally {
      setLoading(false);
    }
  }

  // ── PIN変更モーダル ────────────────────────────────────────────
  function openChangePinModal() {
    document.getElementById('cpCurrentPin').value  = '';
    document.getElementById('cpNewPin').value      = '';
    document.getElementById('cpConfirmPin').value  = '';
    document.getElementById('changePinErrorMsg').style.display   = 'none';
    document.getElementById('changePinSuccessMsg').style.display = 'none';
    document.getElementById('changePinModal').style.display = 'flex';
    document.getElementById('cpCurrentPin').focus();
  }

  function closeChangePinModal() {
    document.getElementById('changePinModal').style.display = 'none';
  }

  function onChangePinOverlayClick(e) {
    if (e.target === document.getElementById('changePinModal')) closeChangePinModal();
  }

  async function doChangePin() {
    const currentPin = document.getElementById('cpCurrentPin').value;
    const newPin     = document.getElementById('cpNewPin').value;
    const confirmPin = document.getElementById('cpConfirmPin').value;

    if (currentPin.length !== 4) { showChangePinMsg('error', '現在のPINを4桁で入力してください'); return; }
    if (newPin.length !== 4)     { showChangePinMsg('error', '新しいPINを4桁で入力してください'); return; }
    if (newPin !== confirmPin)   { showChangePinMsg('error', '新しいPINが一致しません'); return; }
    if (newPin === currentPin)   { showChangePinMsg('error', '現在と同じPINは使用できません'); return; }

    const session = getSession();
    if (!session) { showChangePinMsg('error', 'セッションが切れています。再ログインしてください'); return; }

    setLoading(true);
    try {
      const res = await gasPost('changePin', {
        session_token: session.token,
        current_pin:   currentPin,
        new_pin:       newPin,
        requestId:     newRequestId()
      });
      if (res.success) {
        showChangePinMsg('success', res.message || 'PINを変更しました。再ログインしてください');
        document.getElementById('cpCurrentPin').value = '';
        document.getElementById('cpNewPin').value     = '';
        document.getElementById('cpConfirmPin').value = '';
        clearSession();
        setTimeout(() => location.reload(), 1200);
      } else {
        showChangePinMsg('error', res.message || 'PIN変更に失敗しました');
      }
    } catch {
      showChangePinMsg('error', '通信エラーが発生しました');
    } finally {
      setLoading(false);
    }
  }

  function showChangePinMsg(type, msg) {
    const errEl = document.getElementById('changePinErrorMsg');
    const sucEl = document.getElementById('changePinSuccessMsg');
    if (type === 'error') {
      errEl.textContent = msg; errEl.style.display = 'block';
      sucEl.style.display = 'none';
    } else {
      sucEl.textContent = msg; sucEl.style.display = 'block';
      errEl.style.display = 'none';
    }
  }

  // ── GAS 通信 ──────────────────────────────────────────────────
  // ⚠️ 実測（2026-09-18・本番）に基づく設定。値を変えるときは必ず測り直すこと。
  //    ・1本ずつなら 2〜5秒（46件すべて5秒未満・失敗ゼロ）
  //    ・同時に数本重なると跳ねる。実測で 9.8秒 / 17.5秒 / 57.1秒
  //    ・稀にGASがPOSTボディを落とし、actionが空で届く（57秒の1本で発生）
  //    したがって「短いタイムアウトで打ち切る」のは誤り。15秒で切ると
  //    実測の4%（17秒・57秒で成功していたもの）を壊す。
  //    待ち続けたうえで、利用者に状況を見せて逃げ道を出すのが正しい（setLoading参照）。
  const GAS_HARD_TIMEOUT_MS = 60000;  // 最後の打ち切り。通常はここまで来ない
  const GAS_RETRY_WAIT_MS   = 1200;   // 引き直す前の間

  // ⚠️ 引き直してよいのは「サーバーが何もしていない」と言い切れるときだけ。
  //    GASは結果配信に失敗して長い待ちのあと404を返すことがあり（実測: 35.5秒→404）、
  //    そのとき**スクリプトは実行済みの可能性がある**。
  //    したがって通信失敗での引き直しは、読み取り専用で何度呼んでも同じ操作に限る。
  //    ログイン・PIN変更・PINリセットを再送すると二重実行になる。
  // 読み取り専用＝何度呼んでも同じなので、いつでも引き直してよい
  const RETRYABLE_ACTIONS = ['getUsers', 'getUserApps', 'validateSession'];

  // 書き込みだが、requestId を付ければサーバー側が二重実行を防いでくれるもの。
  // （GAS v1.13.0 で `_withIdempotency` を実装。同じ requestId の再送は前回の結果を返すだけ）
  // ⚠️ requestId が無い場合は引き直さない。二重実行になる。
  const IDEMPOTENT_WRITE_ACTIONS = ['login', 'changePin', 'resetPin'];

  // 1回の操作につき1つ発行する。引き直しのあいだは同じものを使い続けること
  // （だから _fetchJson の内部リトライは同じボディを送る＝そのままでよい）。
  // 利用者がボタンを押し直したら、それは別の操作なので新しいIDになる。
  function newRequestId() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) {}
    return 'r-' + Date.now() + '-'
         + Math.random().toString(36).slice(2, 10)
         + Math.random().toString(36).slice(2, 10);
  }

  function _timeoutError() {
    const e = new Error('GAS_TIMEOUT');
    e.code = 'GAS_TIMEOUT';
    return e;
  }

  // 「不明なアクション: 」（actionが空）で返る現象を見分ける。
  //
  // ⚠️ 2026-09-19に仕組みを実測で解明した。これは「届かなかった」のではない。
  //    GASのWebアプリは二段構え:
  //      ① script.google.com/.../exec  … ここでスクリプトが実行され、302が返る
  //      ② script.googleusercontent.com/... … ここで結果だけが配信される
  //    ②のURLは【使い捨て・寿命は5〜30秒の間】（実測: 5秒後は有効、30秒後は無効）。
  //    期限切れ／2回目のアクセスになると①へ差し戻され、
  //    POSTはGETに変換されてボディを失い、空のactionで再実行される。
  //    → **最初の実行は成功している可能性が高く、その答えだけが失われている**。
  //    （GETはクエリが復元されるため自己回復する。POSTだけがこの形で失敗する）
  //    したがって書き込みを引き直してはいけない。二重実行になる。
  function _looksLikeLostBody(j) {
    return !!(j && j.success === false && typeof j.error === 'string'
              && j.error.indexOf('不明なアクション') === 0);
  }

  async function _fetchJsonOnce(url, options) {
    const ac    = new AbortController();
    const timer = setTimeout(() => ac.abort(), GAS_HARD_TIMEOUT_MS);
    try {
      const res = await fetch(url, Object.assign({}, options || {}, { signal: ac.signal }));
      return await res.json();
    } catch (e) {
      if (e && e.name === 'AbortError') throw _timeoutError();
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function _fetchJson(url, options, retryOnFailure) {
    let first;
    try {
      first = await _fetchJsonOnce(url, options);
    } catch (e) {
      // 404・JSONパース失敗・ネットワーク断など。
      // 打ち切り(60秒)まで待った場合は、さらに60秒待たせても仕方ないので引き直さない。
      if (!retryOnFailure || (e && e.code === 'GAS_TIMEOUT')) throw e;
      await new Promise(r => setTimeout(r, GAS_RETRY_WAIT_MS));
      return _fetchJsonOnce(url, options);
    }
    if (_looksLikeLostBody(first)) {
      // 🔴 書き込みは引き直さない（①で既に実行済みの可能性がある）。そのまま返して呼び出し側に伝える
      if (!retryOnFailure) return first;
      await new Promise(r => setTimeout(r, GAS_RETRY_WAIT_MS));
      return _fetchJsonOnce(url, options);
    }
    return first;
  }

  function _isRetryable(action, data) {
    if (RETRYABLE_ACTIONS.indexOf(action) >= 0) return true;
    // 書き込みは requestId が付いているときだけ引き直してよい
    return IDEMPOTENT_WRITE_ACTIONS.indexOf(action) >= 0 && !!(data && data.requestId);
  }

  async function gasGet(action, data) {
    const qs = 'action=' + action + '&data=' + encodeURIComponent(JSON.stringify(data));
    return _fetchJson(GAS_URL + '?' + qs, {}, _isRetryable(action, data));
  }

  async function gasPost(action, data) {
    const body = 'action=' + encodeURIComponent(action)
               + '&data='   + encodeURIComponent(JSON.stringify(data));
    return _fetchJson(GAS_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    }, _isRetryable(action, data));
  }

  // ── ヘルパー ──────────────────────────────────────────────────
  function isQuotaError(e) {
    if (!e) return false;
    return e.name === 'QuotaExceededError'
        || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
        || e.code === 22
        || e.code === 1014;
  }

  // ⚠️ 何が起きても「通信エラー」と出すのをやめる。
  //    実際には通信が成功していたのに「通信エラー」と表示していたため、
  //    2026-09-18の原因究明が大きく遅れた。文言は起きたことと一致させる。
  function describeError(e) {
    if (e && e.code === 'GAS_TIMEOUT') {
      return '応答がありませんでした。時間をおいて、もう一度お試しください。';
    }
    if (isQuotaError(e)) {
      return 'この端末の保存容量がいっぱいです。ブラウザの設定でこのサイトのデータを削除すると解消します。';
    }
    return '通信に失敗しました。もう一度お試しください。';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent   = msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }
  function showManageMsg(type, msg) {
    const errEl = document.getElementById('manageErrorMsg');
    const sucEl = document.getElementById('manageSuccessMsg');
    if (type === 'error') {
      errEl.textContent   = msg;
      errEl.style.display = 'block';
      sucEl.style.display = 'none';
    } else {
      sucEl.textContent   = msg;
      sucEl.style.display = 'block';
      errEl.style.display = 'none';
    }
  }
  // ⚠️ 待たせるときは必ず「動いていること」と「やめる手段」を見せる。
  //    実測で最大57秒かかることがある（同時アクセス時）。通信は止めないので、
  //    17秒で返ってくればこの表示は消えて普通に画面が出る。
  //    57秒の沈黙は故障と区別がつかない——これが「ぐるぐる回ったまま」の正体だった。
  const LOADING_NOTE_MS   = 6000;   // 「まだ読み込んでいます」
  const LOADING_ESCAPE_MS = 15000;  // 「やり直す」ボタンを出す
  let _loadingTimers = [];

  function _clearLoadingTimers() {
    _loadingTimers.forEach(clearTimeout);
    _loadingTimers = [];
  }

  function setLoading(on) {
    const box  = document.getElementById('loading');
    const note = document.getElementById('loadingNote');
    const msg  = document.getElementById('loadingNoteMsg');
    const btn  = document.getElementById('loadingReloadBtn');

    _clearLoadingTimers();
    box.style.display  = on ? 'flex' : 'none';
    note.style.display = 'none';
    btn.style.display  = 'none';
    msg.textContent    = '';

    if (!on) return;

    _loadingTimers.push(setTimeout(function () {
      msg.textContent    = 'まだ読み込んでいます…';
      note.style.display = 'block';
    }, LOADING_NOTE_MS));

    _loadingTimers.push(setTimeout(function () {
      msg.textContent    = '時間がかかっています。そのままお待ちいただくか、やり直してください。';
      note.style.display = 'block';
      btn.style.display  = 'inline-block';
    }, LOADING_ESCAPE_MS));
  }
  function clearPinInput() {
    document.getElementById('pinInput').value = '';
    for (let i = 0; i < 4; i++) document.getElementById('dot' + i).classList.remove('filled');
  }
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
