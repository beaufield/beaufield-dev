<script>
'use strict';
/* 接続先。公開用は tools/build_pages.cjs が下の1行を本番・試験の値に置き換える（ここ以外に書かない） */
const ST_CONFIG = /*ST_CONFIG_BEGIN*/{"env":"prod","dbUrl":"https://jlebreiqpqzfsjsunyfw.supabase.co","dbKey":"sb_publishable_YXncOJtKml1dfGRdxHns-w_TcE2-Ypg","gasUrl":"https://script.google.com/macros/s/AKfycbzv1_ddcpfQrWN8tsKVYN31TwfCCjU55jXLG3l0KY7uur_oBXML-2JPWk4Rfjwfg5ztPQ/exec","portalUrl":"https://beaufield.github.io/beaufield-dev/"}/*ST_CONFIG_END*/;

  pref: { showBook: false, onlyOpenPlaces: false, onlyUncounted: false },

  firstFailAt: 0, flushing: false, retryTimer: null, failCount: 0,

  report: null,             // 管理画面で最後に読んだ st_get_report

/* ============================================================

============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n == null || n === '' ? '' : Number(n).toLocaleString('ja-JP'));
function toast(msg, type) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (type === 'error' ? ' error' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, type === 'error' ? 3500 : 1800);
}
let audioCtx = null;
function beep(ok) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 1320 : 330; g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + (ok ? 0.09 : 0.25));
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(ok ? 40 : [60, 60, 60]); } catch (e) {}
}
function savePref() { try { localStorage.setItem(PREF_KEY, JSON.stringify(S.pref)); } catch (e) {} }
function loadPref() { try { Object.assign(S.pref, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {} }
const isAdmin = () => S.me && S.me.role === 'admin';
const sid = () => (S.session ? S.session.sessionId : null);
// 未送信（この棚卸し分）。完了・確定の前に0であることを確かめる
const sessionOps = () => S.ops.filter(o => o.sessionId === sid());
// 表示に重ねる操作 = 送信済み・反映待ち → 未送信 の順（保存順）
const viewOps = () => S.sent.concat(S.ops).filter(o => o.sessionId === sid());

// 確認ダイアログ。buttons: [{key,label,cls}]。input があれば {key, value} を返す
function ask(title, message, buttons, input) {
  return new Promise(resolve => {
    const box = $('modalBox');

    $('modal').classList.remove('hidden');
    if (input) setTimeout(() => { const i = $('askInput'); if (i) i.focus(); }, 50);
    box.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => {
      const v = input ? ($('askInput').value || '').trim() : undefined;
      $('modal').classList.add('hidden');
      resolve(input ? { key: b.dataset.k, value: v } : b.dataset.k);

const confirmYes = async (title, msg, yes, cls) =>
  (await ask(title, msg, [{ key: 'yes', label: yes || 'はい', cls: cls || 'pri' }, { key: 'no', label: 'やめる' }])) === 'yes';

/* ============================================================
   端末の保存（IndexedDB）
============================================================ */
const IDB = { db: null };
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('NO_IDB'));
    let r;
    try { r = indexedDB.open('bf_tanaoroshi', 1); } catch (e) { return reject(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('kv');
      d.createObjectStore('outbox', { keyPath: 'k' });
      d.createObjectStore('rejected', { keyPath: 'k' });
    };
    r.onsuccess = () => { IDB.db = r.result; resolve(); };
    r.onerror = () => reject(r.error || new Error('IDB_OPEN'));
    r.onblocked = () => reject(new Error('IDB_BLOCKED'));
  });
}
function idb(store, mode, fn) {
  return new Promise((resolve, reject) => {
    let t, v;
    try { t = IDB.db.transaction(store, mode); } catch (e) { return reject(e); }
    const req = fn(t.objectStore(store));
    if (req) req.onsuccess = () => { v = req.result; };
    t.oncomplete = () => resolve(v);
    t.onerror = () => reject(t.error || new Error('IDB'));
    t.onabort = () => reject(t.error || new Error('IDB_ABORT'));
  });
}
const kvGet = k => idb('kv', 'readonly', s => s.get(k));
const kvPut = (k, v) => idb('kv', 'readwrite', s => s.put(v, k));
let opCounter = 0;
const opKey = () => String(Date.now()).padStart(15, '0') + '-' + String(opCounter++).padStart(6, '0');

/* ============================================================
   通行証と通信
============================================================ */
class NetError extends Error {}
class AuthError extends Error {}

function readBfSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.token || !s.user_id || !(s.expires > Date.now())) return null;
    return s;
  } catch (e) { return null; }
}
function cachedToken() {
  try {
    const t = JSON.parse(sessionStorage.getItem(TOKEN_KEY) || 'null');
    if (t && t.userId === S.bf.user_id && t.exp * 1000 - Date.now() > 5 * 60e3) return t;
  } catch (e) {}
  return null;
}
function clearToken() { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
let tokenPromise = null;
function getToken() {
  const c = cachedToken();
  if (c) return Promise.resolve(c);
  if (!tokenPromise) tokenPromise = issueToken().finally(() => { tokenPromise = null; });
  return tokenPromise;
}
async function issueToken() {
  const body = new URLSearchParams({ action: 'issueDbToken', app: 'stocktake', session_token: S.bf.token }).toString();
  const waits = [0, 2000, 5000];
  for (let i = 0; i < waits.length; i++) {
    if (waits[i]) await new Promise(r => setTimeout(r, waits[i]));
    let data = null;
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(ST_CONFIG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body, signal: ctrl.signal });
      data = await res.json();
    } catch (e) { data = null; } finally { clearTimeout(tm); }
    if (data && data.success === true && typeof data.token === 'string') {
      const t = { token: data.token, exp: data.exp, userId: data.userId };
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
      return t;
    }
    if (data && data.error === 'SESSION_INVALID') throw new AuthError('SESSION_INVALID');
  }
  throw new NetError('TOKEN');
}
// 棚卸しのDB関数を呼ぶ。通信失敗・5xx は NetError を投げる（書き込みは entryId で二重計上しないので再送してよい）
async function rpc(name, p, opt) {
  opt = opt || {};
  let tok = await getToken();
  for (let attempt = 0; attempt < 2; attempt++) {
    let res;
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), opt.timeout || 15000);
    try {
      res = await fetch(ST_CONFIG.dbUrl + '/rest/v1/rpc/' + name, {
        method: 'POST', signal: ctrl.signal, body: JSON.stringify({ p: p || {} }),
        headers: { apikey: ST_CONFIG.dbKey, Authorization: 'Bearer ' + tok.token, 'Content-Type': 'application/json',
          'Content-Profile': 'stocktake_api', 'Accept-Profile': 'stocktake_api' },
      });
    } catch (e) { throw new NetError('TRANSPORT'); } finally { clearTimeout(tm); }
    if (res.status === 401 || res.status === 403) {
      if (attempt === 0) { clearToken(); tok = await getToken(); continue; }
      return { success: false, error: 'SESSION_INVALID' };
    }
    if (res.status >= 500) throw new NetError('HTTP_' + res.status);
    if (!res.ok) return { success: false, error: 'DB_ERROR', status: res.status };
    let data;
    try { data = await res.json(); } catch (e) { throw new NetError('PARSE'); }
    // DB側の確認で通らなかった（役割が変わった等）→ 通行証を取り直して1回だけやり直す（何も書き込まれていない）
    if (data && data.error === 'SESSION_INVALID' && attempt === 0) { clearToken(); tok = await getToken(); continue; }
    return data;
  }
}

};

/* ============================================================
   計測（§1.3）
============================================================ */
function metric(kind, value, detail) {
  S.metrics.push({ kind, value: value == null ? null : Number(value), detail: detail || {}, sessionId: sid() });
  if (S.metrics.length >= 20) sendMetrics();
}
async function sendMetrics() {
  if (!S.metrics.length || !S.me) return;
  const batch = S.metrics.splice(0, 100);
  try {
    const r = await rpc('st_put_metrics', { deviceId: S.deviceId, metrics: batch });
    if (!r || !r.success) throw new Error('metrics');
  } catch (e) { S.metrics = batch.concat(S.metrics).slice(-200); }
}

/* ============================================================
   データの読み込み
============================================================ */
function parseShelves(rows) {
  return (rows || []).map(r => ({ shelf: r[0], inScope: !!r[1], sort: r[2], status: r[3], doneAt: r[4], doneBy: r[5], count: Number(r[6] || 0) }));
}
function rebuildView() { S.view = C.computeView(S.server, viewOps()); }

async function loadWhoami() {
  const r = await rpc('st_whoami', {});
  if (!r.success) throw new AuthError(r.error);
  S.me = { userId: r.userId, name: r.name, role: r.role };
  S.productInfo = r.productInfo;
  return r.active;
}
// 実施中の棚卸しを読み込む（端末の写しがあれば先に表示）
// offline=true: 通信せず、端末に残っている写しだけで開く（電波の無い場所で開き直したとき）
async function loadSession(active, offline) {
  if (!offline) kvPut('boot', { userId: S.bf.user_id, me: S.me, productInfo: S.productInfo, active: active || null }).catch(() => {});
  if (!active) { S.session = null; S.index = null; S.server = new Map(); S.seq = 0; rebuildView(); return; }
  const cachedItems = await kvGet('items').catch(() => null);
  const cachedState = await kvGet('state').catch(() => null);
  S.session = active;
  let haveCache = false;
  if (cachedItems && cachedItems.sessionId === active.sessionId && cachedItems.role === S.me.role) {
    S.index = C.buildItems(cachedItems.items); S.shelves = parseShelves(cachedItems.shelves); haveCache = true;
  }
  if (cachedState && cachedState.sessionId === active.sessionId) {
    S.server = new Map(cachedState.entries.map(e => [e.id, e])); S.seq = cachedState.seq; S.users = cachedState.users || {};
  } else { S.server = new Map(); S.seq = 0; }
  rebuildView();
  if (offline) {
    if (!haveCache) throw new NetError('NO_CACHE');
    return;
  }
  const fetchItems = async () => {
    const r = await rpc('st_get_items', { sessionId: active.sessionId });
    if (!r.success) throw new Error(r.error);
    S.index = C.buildItems(r.items); S.shelves = parseShelves(r.shelves); S.session = r.session;
    kvPut('items', { sessionId: active.sessionId, role: S.me.role, items: r.items, shelves: r.shelves }).catch(() => {});
  };
  if (haveCache) { fetchItems().then(() => { rebuildView(); render(); }).catch(() => {}); }
  else await fetchItems();
  await fetchState(S.seq === 0);
}
async function fetchState(full) {
  if (!S.session) return;
  const s0 = S.session.sessionId;
  const sentBefore = S.sent.length;  // この取得より前に送り終えた操作は、取得結果に反映済み
  const r = await rpc('st_get_state', { sessionId: s0, sinceSeq: full ? 0 : S.seq });
  if (!r.success) { if (r.error === 'FORBIDDEN' || r.error === 'NOT_FOUND') await onSessionEnded(); return; }
  if (!S.session || S.session.sessionId !== s0) return;
  if (full) S.server = new Map();
  for (const row of r.entries) { const e = C.entryFromRow(row); S.server.set(e.id, e); }
  S.sent.splice(0, sentBefore);
  S.seq = r.seq; Object.assign(S.users, r.users || {});
  S.session = r.session; S.shelves = mergeShelves(r.shelves);
  kvPut('state', { sessionId: s0, seq: S.seq, users: S.users, entries: [...S.server.values()] }).catch(() => {});
  rebuildView();
  if (r.session.status !== 'counting') { await onSessionEnded(); return; }
  renderLight();
}
function mergeShelves(rows) {
  const fresh = parseShelves(rows);
  return fresh.length ? fresh : S.shelves;
}
async function onSessionEnded() {
  const active = await loadWhoami().catch(() => null);
  await loadSession(active);
  S.stack = [{ name: 'home' }];
  toast('棚卸しの状態が変わりました');
  render();
}

/* ============================================================
   記録の保存と送信（§9）
============================================================ */
async function addOp(op) {
  op.k = opKey(); op.createdAt = Date.now();
  try { await idb('outbox', 'readwrite', s => s.put(op)); }
  catch (e) {
    await ask('保存できませんでした', '端末に記録を保存できませんでした。この記録は保存されていません。\n画面を開き直してから、もう一度入力してください。', [{ key: 'ok', label: '閉じる', cls: 'dark' }]);
    return false;
  }
  S.ops.push(op);
  rebuildView();
  renderBand();
  flush();
  return true;
}
function saveEntry(o) {
  const e = { id: C.uuid(), kind: o.kind || 'item', code: o.code || null, janRaw: o.janRaw || '', place: o.place, mode: o.mode || 'add',
    qty: o.qty, inputMethod: o.inputMethod || 'list', memo: o.memo || '', deviceId: S.deviceId, clientAt: new Date().toISOString(),
    userId: S.me.userId, voided: false };
  return addOp({ type: 'put', sessionId: sid(), entry: e });
}
const voidEntry = entryId => addOp({ type: 'void', sessionId: sid(), entryId });
const wire = e => ({ entryId: e.id, kind: e.kind, code: e.code, janRaw: e.janRaw, place: e.place, mode: e.mode, qty: e.qty,
  inputMethod: e.inputMethod, memo: e.memo, deviceId: e.deviceId, clientAt: e.clientAt });

async function removeOps(ops, rejectedWith) {
  const keys = new Set(ops.map(o => o.k));
  await idb('outbox', 'readwrite', s => { ops.forEach(o => s.delete(o.k)); return null; });
  if (rejectedWith) {
    const recs = ops.map(o => Object.assign({}, o, { error: rejectedWith[o.k] || 'REJECTED', rejectedAt: Date.now() }));
    await idb('rejected', 'readwrite', s => { recs.forEach(r => s.put(r)); return null; });
    S.rejected.push(...recs);
  } else {
    S.sent.push(...ops);  // サーバーは受け取った。次の取得で反映されるまで表示に重ねる
  }
  S.ops = S.ops.filter(o => !keys.has(o.k));
}
async function flush() {
  if (S.flushing || !S.me) return;
  S.flushing = true; clearTimeout(S.retryTimer);
  let sent = false;
  try {
    while (S.ops.length) {
      const first = S.ops[0];
      if (first.type === 'put') {
        const batch = [];
        for (const op of S.ops) { if (op.type !== 'put' || op.sessionId !== first.sessionId || batch.length >= 50) break; batch.push(op); }
        const t0 = Date.now();
        const r = await rpc('st_put_entries', { sessionId: first.sessionId, entries: batch.map(o => wire(o.entry)) });
        if (!r.success) {
          if (r.error === 'SESSION_INVALID') throw new AuthError(r.error);
          const rej = {}; batch.forEach(o => { rej[o.k] = r.error; });
          await removeOps(batch, rej); continue;
        }
        const byId = new Map(r.results.map(x => [x.entryId, x]));
        const done = [], bad = [], rej = {};
        for (const o of batch) {
          const x = byId.get(o.entry.id);
          if (x && (x.status === 'ok' || x.status === 'dup')) done.push(o);
          else { bad.push(o); rej[o.k] = x ? x.error : 'NO_RESULT'; }
        }
        done.forEach(o => metric('save_latency', Date.now() - o.createdAt, { send: Date.now() - t0 }));
        await removeOps(done);
        if (bad.length) await removeOps(bad, rej);
      } else {
        const r = await rpc('st_void_entry', { entryId: first.entryId });
        if (r.success) await removeOps([first]);
        else if (r.error === 'SESSION_INVALID') throw new AuthError(r.error);
        else await removeOps([first], { [first.k]: r.error });
      }
      sent = true;
    }
    S.firstFailAt = 0; S.failCount = 0;
    if (sent) await fetchState(false).catch(() => {});
  } catch (e) {
    if (e instanceof AuthError) { showAuthProblem(); }
    else {
      metric('sync_fail', 1, { pending: S.ops.length });
      S.failCount++; if (!S.firstFailAt) S.firstFailAt = Date.now();
      const wait = [2000, 5000, 10000, 30000][Math.min(S.failCount - 1, 3)];
      S.retryTimer = setTimeout(flush, wait);
    }
  } finally {
    S.flushing = false; rebuildView(); renderBand(); renderLight();
  }
}
// 完了・確定の前: 未送信を送り切る（最大 ms 待つ）。送り切れたら true
async function ensureFlushed(ms) {
  const until = Date.now() + (ms || 10000);
  while (sessionOps().length && Date.now() < until) {
    if (!S.flushing) flush();
    await new Promise(r => setTimeout(r, 300));
  }
  return sessionOps().length === 0;
}

function renderBand() {
  const b = $('band');
  const n = S.ops.length;
  const rej = S.rejected.length;
  if (rej) {
    b.className = 'band err';
    b.innerHTML = `送れなかった記録が ${rej} 件あります<button type="button" id="bandRej">内容を見る</button>`;
    $('bandRej').onclick = showRejected;
  } else if (S.offline || (n && S.firstFailAt && Date.now() - S.firstFailAt > 30000)) {
    b.className = 'band err';
    b.textContent = `通信できません。入力は端末に保存されています（未送信 ${n} 件）`;
  } else if (n) {
    b.className = 'band warn';
    b.textContent = `未送信 ${n} 件（送信中）`;
  } else { b.className = 'band hidden'; b.textContent = ''; }
}
function setChrome(title, bottomHtml) {

}

/* ============================================================
   集計の小道具
============================================================ */
function shelfStats(shelf) { return C.shelfProgress(S.index, S.view, shelf); }
function totals() {
  let total = 0, counted = 0;
  for (const it of S.index.list) { if (!it.inScope) continue; total++; if (C.isCounted(it, S.view)) counted++; }
  const inScope = S.shelves.filter(s => s.inScope);
  return { total, counted, shelves: inScope.length, done: inScope.filter(s => s.status === 'done').length };
}
function statusHtml(it, place) {
  const here = S.view.byKey.get(it.code + '|' + place);
  const all = S.view.byCode.get(it.code);
  const other = all ? all.total - (here ? here.qty : 0) : 0;
  let h = here ? `<div class="st-done">済 ${num(here.qty)}</div>` : `<div class="st-none">未</div>`;
  if (all && other && all.n > (here ? here.n : 0)) {
    const lbl = Object.keys(all.places).filter(p => p !== place).map(p => C.placeLabel(p)).join('・');
    h += `<div class="st-other">＋${esc(lbl)} ${num(other)}</div>`;
  }
  if ((here && here.pending) || (all && all.pending)) h += `<div class="st-pend">未送信</div>`;
  if (isAdmin() && S.pref.showBook) h += `<div class="st-other">帳簿 ${it.book == null ? '－' : num(it.book)}</div>`;
  return h;
}

  const it = e.code ? S.index.byCode.get(e.code) : null;
  const name = it ? it.name : (e.kind === 'unknown' ? `未登録JAN ${e.janRaw}` : e.code);
  const who = S.users[e.userId] || e.userId;
  const canUndo = withUndo && !e.voided && S.session && S.session.status === 'counting' && (e.userId === S.me.userId || isAdmin());
  return `<div class="row"><div class="main"><div class="name">${esc(name)}</div>
    <div class="sub">${esc(C.fmtJst(e.clientAt))}・${esc(C.placeLabel(e.place))}・${e.mode === 'replace' ? '数え直し' : '追加'}・${esc(who)}${e.pending ? ' <span class="tag warn">未送信</span>' : ''}${e.voided ? ' <span class="tag">取消</span>' : ''}${e.memo ? '・' + esc(e.memo) : ''}</div></div>
    <div class="side"><b style="font-size:18px">${num(e.qty)}</b>${canUndo ? `<div><button class="btn sec sm" style="min-height:36px;margin:4px 0 0;padding:4px 10px" data-act="undo" data-id="${esc(e.id)}">取消</button></div>` : ''}</div></div>`;
}

// ---------- S9 自分の記録 ----------
SCREENS.mylog = () => {
  setChrome('自分の記録');
  const list = [];
  for (const e of S.server.values()) if (e.userId === S.me.userId) list.push(Object.assign({}, e, S.view.active.has(e.id) ? {} : { voided: true }));
  for (const op of viewOps()) if (op.type === 'put' && !S.server.has(op.entry.id)) list.push(Object.assign({}, op.entry, { pending: true, voided: !S.view.active.has(op.entry.id) }));
  list.sort((a, b) => (b.clientAt || '').localeCompare(a.clientAt || ''));
  $('main').innerHTML = list.length ? '<div class="list">' + list.slice(0, 300).map(e => entryRowHtml(e, true)).join('') + '</div>'
    : '<div class="card"><p class="muted">まだ記録はありません。</p></div>';
};

// ---------- S2 開始（管理者） ----------
SCREENS.start = async (params) => {
  setChrome('棚卸しを始める');
  $('main').innerHTML = '<div class="card"><p class="muted">棚の一覧を読み込んでいます…</p></div>';
  if (!params.opId) params.opId = 'start-' + C.uuid();
  if (!params.sel) params.sel = {};
  let r;
  try { r = await rpc('st_list_shelves', {}); } catch (e) { $('main').innerHTML = '<div class="errbox">通信できません。電波の届く場所で開き直してください。</div>'; return; }
  if (!r.success) { $('main').innerHTML = `<div class="errbox">${esc(errText(r.error))}</div>`; return; }
  if (cur().name !== 'start') return;
  const ing = S.productInfo && S.productInfo.ingestedAt;
  const fresh = ing && C.jstDate(ing) === C.jstDate();
  const shelves = r.shelves.map(([s, n]) => ({ s, n: Number(n) }));
  const named = shelves.filter(x => x.s !== '');
  const none = shelves.find(x => x.s === '');
  const draw = () => {
    const selN = named.filter(x => params.sel[x.s]);
    const items = selN.reduce((a, x) => a + x.n, 0) + (params.noShelf && none ? none.n : 0);
    $('main').innerHTML = `<div class="card"><h2>名前</h2><input type="text" id="stName" value="${esc(params.name || C.jstDate() + ' 棚卸し')}" maxlength="60"></div>
      <div class="card"><h2>帳簿在庫の時点</h2><div>商品マスター ${esc(C.fmtJst(ing) || '不明')} の取り込み（版 ${esc(S.productInfo ? S.productInfo.version : '')}）</div>
      ${fresh ? '' : '<div class="warnbox">今朝の取り込みがまだです。始めると古い帳簿と比べます。</div>'}</div>
      <div class="card"><h2>数える棚</h2><div class="grid2" style="margin-bottom:8px"><button class="btn sec sm" data-act="selAll">全部</button><button class="btn sec sm" data-act="selNone">解除</button></div>
      <div class="chips">${named.map(x => `<button type="button" class="chip ${params.sel[x.s] ? 'on' : ''}" data-act="selShelf" data-shelf="${esc(x.s)}"><b>${esc(x.s)}</b><small>${x.n}品</small></button>`).join('')}</div>
      ${none ? `<label class="toggle">棚番なし（${none.n}品）も含める<input type="checkbox" id="stNoShelf" ${params.noShelf ? 'checked' : ''}></label>` : ''}</div>
      <div class="card"><b>${selN.length + (params.noShelf ? 1 : 0)} か所・${num(items)} 品</b>を対象に始めます。</div>`;
    $('stName').oninput = e => { params.name = e.target.value; };
    const ns = $('stNoShelf'); if (ns) ns.onchange = e => { params.noShelf = e.target.checked; draw(); };
    setChrome('棚卸しを始める', `<button class="btn pri" data-act="doStart" ${items ? '' : 'disabled'}>開始する</button>`);
  };
  params._draw = draw; params._named = named;
  draw();
};

// ---------- S10 進捗・差異（管理者） ----------
SCREENS.report = async (params) => {
  const tab = params.tab || 'diff';
  setChrome('進捗・差異');
  if (!params.loaded) {
    $('main').innerHTML = '<div class="card"><p class="muted">集計しています…</p></div>';
    let r;
    try { r = await rpc('st_get_report', { sessionId: params.sessionId || sid() }); }
    catch (e) { $('main').innerHTML = '<div class="errbox">通信できません。電波の届く場所で開き直してください。</div>'; return; }
    if (!r.success) { $('main').innerHTML = `<div class="errbox">${esc(errText(r.error))}</div>`; return; }
    S.report = r; params.loaded = true; params.loadedAt = Date.now();
    if (cur().name !== 'report') return;
  }
  const r = S.report;
  const live = r.session.status === 'counting' && sid() === r.session.sessionId;
  const sum = r.summary;
  let h = `<div class="card"><h2>${esc(r.session.name)}</h2><div class="muted">${esc(statusText(r.session.status))}・対象 ${num(sum.inScopeItems)} 品・未 ${num(sum.uncountedItems)} 品・完了 ${sum.shelvesDone}／${sum.shelves} 棚</div></div>
    <div class="tabs"><button class="${tab === 'progress' ? 'on' : ''}" data-act="repTab" data-tab="progress">進捗</button>
    <button class="${tab === 'diff' ? 'on' : ''}" data-act="repTab" data-tab="diff">差異</button>
    <button class="${tab === 'other' ? 'on' : ''}" data-act="repTab" data-tab="other">その他</button></div>`;
  if (tab === 'progress') {
    const byShelf = {};
    r.items.forEach(x => { const k = x.shelf; byShelf[k] = byShelf[k] || { t: 0, c: 0, unc: [] }; byShelf[k].t++; if (x.counted) byShelf[k].c++; else byShelf[k].unc.push(x); });
    h += `<div class="card">ストック確認: ${r.session.stockCheckedAt ? '済み（' + esc(C.fmtJst(r.session.stockCheckedAt)) + '）' : '<b>まだ</b>'}</div><div class="list">`;
    Object.keys(byShelf).forEach(k => {
      const v = byShelf[k];
      h += `<div class="row"><div class="main"><div class="name"><b>${esc(C.shelfLabel(k))}</b></div>
        ${v.unc.length ? `<div class="sub">未: ${v.unc.slice(0, 8).map(x => esc(x.name)).join('、')}${v.unc.length > 8 ? ` ほか ${v.unc.length - 8} 品` : ''}</div>` : ''}</div>
        <div class="side">${v.c}／${v.t}</div></div>`;
    });
    h += '</div>';
  } else if (tab === 'diff') {
    const sort = params.sort || 'amount';
    let rows = r.items.filter(x => !params.onlyDiff || (x.diff != null && Number(x.diff) !== 0));
    const absD = x => (x.diff == null ? -1 : Math.abs(Number(x.diff)));
    const absA = x => (x.diffAmount == null ? -1 : Math.abs(Number(x.diffAmount)));
    if (sort === 'diff') rows = rows.slice().sort((a, b) => absD(b) - absD(a));
    else if (sort === 'amount') rows = rows.slice().sort((a, b) => absA(b) - absA(a));
    const plus = r.items.reduce((a, x) => a + (x.diffAmount > 0 ? Number(x.diffAmount) : 0), 0);
    const minus = r.items.reduce((a, x) => a + (x.diffAmount < 0 ? Number(x.diffAmount) : 0), 0);
    h += `<div class="card">差額合計　<b style="color:#1E6B32">＋${num(plus)}</b>　<b style="color:#B3261E">${num(minus)}</b> 円</div>
      <div class="grid2"><select id="repSort"><option value="amount" ${sort === 'amount' ? 'selected' : ''}>差額の大きい順</option>
      <option value="diff" ${sort === 'diff' ? 'selected' : ''}>差の大きい順</option><option value="shelf" ${sort === 'shelf' ? 'selected' : ''}>棚番順</option></select>
      <label class="toggle" style="padding:0 4px">差がある商品だけ<input type="checkbox" id="repOnly" ${params.onlyDiff ? 'checked' : ''}></label></div>
      <div class="scrollx" style="margin-top:8px"><table class="rep"><thead><tr><th>商品</th><th>帳簿</th><th>棚</th><th>スト</th><th>実数</th><th>差</th><th>差額</th></tr></thead><tbody>
      ${rows.slice(0, 400).map(x => `<tr ${live ? `data-act="repItem" data-code="${esc(x.code)}"` : ''}><td>${esc(x.name)}<div class="muted">${esc(x.code)}・${esc(C.shelfLabel(x.shelf))}${x.tier ? '-' + esc(x.tier) : ''}${x.counted ? '' : '・<b>未</b>'}</div></td>
        <td>${x.bookQty == null ? '－' : num(x.bookQty)}</td><td>${x.shelfQty == null ? '' : num(x.shelfQty)}</td><td>${x.stockQty == null ? '' : num(x.stockQty)}</td>
        <td><b>${x.actual == null ? '' : num(x.actual)}</b></td><td class="${x.diff < 0 ? 'neg' : x.diff > 0 ? 'pos' : ''}">${x.diff == null ? '' : (x.diff > 0 ? '+' : '') + num(x.diff)}</td>
        <td class="${x.diffAmount < 0 ? 'neg' : x.diffAmount > 0 ? 'pos' : ''}">${x.diffAmount == null ? '' : num(x.diffAmount)}</td></tr>`).join('')}
      </tbody></table></div>${rows.length > 400 ? `<p class="muted">先頭400件を表示しています（全${rows.length}件はCSVで）。</p>` : ''}`;
  } else {
    h += `<div class="card"><h2>未登録JAN（${r.unknown.length}）</h2>${r.unknown.length ? r.unknown.map(x => `<div class="row"><div class="main"><div class="name">${esc(x.jan)}</div>
      <div class="sub">${esc(C.placeLabel(x.place))}・${esc(x.userName)}・${esc(C.fmtJst(x.clientAt))}${x.memo ? '・' + esc(x.memo) : ''}</div></div><div class="side"><b>${num(x.qty)}</b></div></div>`).join('') : '<p class="muted">ありません。</p>'}</div>
      <div class="card"><h2>対象外の記録（${r.outside.length}）</h2>${r.outside.length ? r.outside.map(x => `<div class="row"><div class="main"><div class="name">${esc(x.name)}</div>
      <div class="sub">${esc(x.code)}・本来 ${esc(C.shelfLabel(x.homeShelf))}・${esc(C.placeLabel(x.place))}で記録・${esc(x.userName)}</div></div><div class="side"><b>${num(x.qty)}</b></div></div>`).join('') : '<p class="muted">ありません。</p>'}</div>`;
  }
  h += `<div class="card"><h2>CSV</h2><div class="grid2"><button class="btn sec sm" data-act="csvResult">結果</button><button class="btn sec sm" data-act="csvOther">未登録JAN・対象外</button></div>
    ${r.session.status === 'closed' ? `<button class="btn danger sm" data-act="reopenSession" data-id="${esc(r.session.sessionId)}">確定を取り消す</button>` : ''}</div>`;
  $('main').innerHTML = h;
  const rs = $('repSort'); if (rs) rs.onchange = e => { params.sort = e.target.value; render(); };
  const ro = $('repOnly'); if (ro) ro.onchange = e => { params.onlyDiff = e.target.checked; render(); };
  setChrome('進捗・差異', `<button class="btn sec" data-act="repReload">最新にする</button>`);
};
const statusText = s => ({ counting: '実施中', closed: '確定済み', cancelled: '中止' }[s] || s);

SCREENS.close = () => {
  setChrome('確定');
  const inScope = S.shelves.filter(s => s.inScope);
  const openShelves = inScope.filter(s => s.status !== 'done');
  const t = totals();
  const checks = [
    { ok: !openShelves.length, text: '対象の棚がすべて完了', sub: openShelves.length ? '未完了: ' + openShelves.map(s => C.shelfLabel(s.shelf)).join('、') : '' },
    { ok: t.counted === t.total, text: 'すべての対象商品を数えた', sub: t.counted === t.total ? '' : `未 ${t.total - t.counted} 品` },
    { ok: !!S.session.stockCheckedAt, text: 'ストックの確認を終えている', sub: '' },
    { ok: sessionOps().length === 0, text: 'この端末に未送信が無い', sub: sessionOps().length ? `未送信 ${sessionOps().length} 件` : '' },
  ];
  const lastAt = [...S.server.values()].reduce((a, e) => (e.clientAt > a ? e.clientAt : a), '');
  const allOk = checks.every(c => c.ok);
  $('main').innerHTML = `<div class="list">${checks.map(c => `<div class="row"><div class="main"><div class="name">${c.ok ? '✅' : '⬜'} ${esc(c.text)}</div>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}</div></div>`).join('')}</div>
    <div class="card muted">最後の入力: ${esc(C.fmtJst(lastAt) || 'なし')}（他の端末の未送信が無いか、念のため確かめてください）</div>
    <div class="card">対象 ${num(t.total)} 品。確定すると、記録の追加・取消はできなくなります（管理者は「確定を取り消す」で戻せます）。</div>`;
  setChrome('確定', `<button class="btn pri" data-act="doClose" ${allOk ? '' : 'disabled'}>確定する</button>`);
};

/* ============================================================
   数量入力（S6）と読み取り後の流れ
============================================================ */
function openSheet(html) { $('sheetBody').innerHTML = html; $('sheet').classList.remove('hidden'); }
function closeSheet() { $('sheet').classList.add('hidden'); $('sheetBody').innerHTML = ''; if (scan.active) scan.resume(); else render(); }

// item を place で数える。method: list/search/scan/manual_jan
function openQty(item, place, method, janRaw) {
  const here = S.view.byKey.get(item.code + '|' + place);
  const all = S.view.byCode.get(item.code);
  const st = { val: '', mode: here ? null : 'add' };
  const others = all ? Object.keys(all.places).filter(p => p !== place) : [];
  const draw = () => {
    openSheet(`<div class="q-name">${esc(item.name)}</div>
      <div class="q-meta">${esc(item.code)}${item.jan ? '・JAN ' + esc(item.jan) : '・JANなし'}・${esc(C.shelfLabel(item.shelf))}${item.tier ? '-' + esc(item.tier) : ''}<span class="q-unit">${esc(item.unit || '個')}</span></div>
      <div class="q-have">${here ? `この場所で記録済み <b>${num(here.qty)}</b>` : 'この場所ではまだ数えていません'}
      ${others.map(p => `　${esc(C.placeLabel(p))} ${num(all.places[p])}`).join('')}${isAdmin() && S.pref.showBook ? `　<span class="muted">帳簿 ${item.book == null ? '－' : num(item.book)}</span>` : ''}</div>
      ${here ? `<div class="modes"><button type="button" class="${st.mode === 'add' ? 'on' : ''}" data-m="add">追加で数えた（＋）</button><button type="button" class="${st.mode === 'replace' ? 'on' : ''}" data-m="replace">数え直した（置き換え）</button></div>` : ''}
      <div class="q-val ${st.val === '' ? 'empty' : ''}" id="qVal">${st.val === '' ? '数量' : esc(st.val)}</div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}
      <button type="button" class="fn" data-k="clr">消去</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="bs">⌫</button>
      <button type="button" class="fn" data-k="m1">−1</button><button type="button" class="fn" data-k="zero">0（無い）</button><button type="button" class="fn" data-k="p1">＋1</button></div>
      <div class="grid2"><button type="button" class="btn sec" id="qCancel">やめる</button><button type="button" class="btn pri" id="qSave">保存</button></div>`);
    $('sheetBody').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { st.mode = b.dataset.m; draw(); });
    $('sheetBody').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k; let v = st.val;
      if (/^[0-9]$/.test(k)) v = (v === '0' ? '' : v) + k;
      else if (k === 'bs') v = v.slice(0, -1);
      else if (k === 'clr') v = '';
      else if (k === 'zero') v = '0';
      else if (k === 'p1') v = String((Number(v) || 0) + 1);
      else if (k === 'm1') v = String(Math.max(0, (Number(v) || 0) - 1));
      if (v.length > 5) return;
      st.val = v; const q = $('qVal'); q.textContent = v === '' ? '数量' : v; q.className = 'q-val' + (v === '' ? ' empty' : '');
    });
    $('qCancel').onclick = closeSheet;
    // 二度押しで2件記録しないよう、保存の処理中は受け付けない
    $('qSave').onclick = async () => {
      if (st.saving) return;
      st.saving = true;
      try { await saveQty(); } finally { st.saving = false; }
    };
    const saveQty = async () => {
      if (st.val === '') return toast('数量を入れてください', 'error');
      if (!st.mode) return toast('「追加」か「数え直し」を選んでください', 'error');
      const qty = Number(st.val);
      if (qty >= 500 && !(await confirmYes('数量の確認', `${qty} ${item.unit || ''} です。よろしいですか？`, 'このまま保存'))) return;
      const hereQty = here ? here.qty : 0;
      const newTotal = (all ? all.total : 0) - (st.mode === 'replace' ? hereQty : 0) + qty;
      if (!(isAdmin() && S.pref.showBook) && C.needsDiffCheck(item.book, newTotal)) {
        const k = await ask('もう一度数えますか？', '帳簿と差があるかもしれません。', [{ key: 'save', label: 'このまま保存', cls: 'pri' }, { key: 'again', label: '数え直す' }]);
        metric('diff_prompt', 1, { choice: k });
        if (k !== 'save') return;
      }
      const ok = await saveEntry({ kind: 'item', code: item.code, place, mode: st.mode, qty, inputMethod: method, janRaw: janRaw || '' });
      if (!ok) return;
      metric('input', 1, { method });
      toast(`保存しました（${qty}）`);
      closeSheet();
    };
  };
  draw();
}

// 読み取った（入力した）JANから先へ進む（§10.3）
async function handleJan(code, method, place) {
  const res = C.lookupJan(S.index, code);
  if (res.kind === 'none') { metric('scan_unknown', 1); return openUnknown(code, place, method); }
  if (res.kind === 'outside') {
    const it = res.items[0];
    const k = await ask('今回の対象外の商品です', `${it.name}\n（${C.shelfLabel(it.shelf)}）\n記録だけ残しますか？ 結果には入りません。`, [{ key: 'rec', label: '記録だけ残す', cls: 'pri' }, { key: 'no', label: 'やめる' }]);
    if (k === 'rec') return openQty(it, place, method, code);
    if (scan.active) scan.resume();
    return;
  }
  let it = res.items[0];
  if (res.kind === 'many') {
    const k = await ask('どの商品ですか？', '同じJANの商品が複数あります。', res.items.map(x => ({ key: x.code, label: x.name + '（' + x.code + '）', cls: 'sec' })).concat([{ key: '', label: 'やめる' }]));
    it = res.items.find(x => x.code === k);
    if (!it) { if (scan.active) scan.resume(); return; }
  }
  return checkPlaceThenQty(it, place, method, code);
}
async function checkPlaceThenQty(it, place, method, janRaw) {
  if (place !== STOCK && it.shelf !== '' && it.shelf !== place) {
    const k = await ask('棚番が違います', `${it.name}\nこの商品の棚番は ${it.shelf}-${it.tier || ''} です。この場所（${C.placeLabel(place)}）で数えますか？`,
      [{ key: 'here', label: 'この場所で数える', cls: 'pri' }, { key: 'no', label: 'やめる' }]);
    if (k !== 'here') { if (scan.active) scan.resume(); return; }
  }
  openQty(it, place, method, janRaw);
}

/* ============================================================
   スキャン（S5）
============================================================ */
const scan = {
  active: false, reader: null, track: null, torch: false, zoom2: false, paused: false, last: { v: '', t: 0 }, place: '',
  async open(place) {
    this.place = place; this.active = true; this.paused = false;
    $('scanLabel').textContent = C.placeLabel(place) + 'で読み取り中';
    $('scanner').classList.remove('hidden');
    if (!window.Html5Qrcode) { toast('カメラの部品を読み込めませんでした。手入力をお使いください', 'error'); return; }
    const F = window.Html5QrcodeSupportedFormats;
    try {
      this.reader = new window.Html5Qrcode('scanBox', { verbose: false, formatsToSupport: [F.EAN_13, F.UPC_A, F.EAN_8] });
      await this.reader.start({ facingMode: 'environment' },
        { fps: 24, videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
        text => this.onDecode(text), () => {});
      const box = $('scanBox');
      if (!box.querySelector('.scan-guide')) { const g = document.createElement('div'); g.className = 'scan-guide'; box.appendChild(g); }
      setTimeout(() => this.setupCamera(), 400);
    } catch (e) {
      // 起動できなかった部品は止めずに捨てる（未起動の stop() は例外を投げるため）
      this.reader = null;
      metric('camera_fail', 1, { message: String(e && e.message || e).slice(0, 200) });
      toast('カメラを起動できません。手入力をお使いください', 'error');
    }
  },
  setupCamera() {
    try {
      const v = document.querySelector('#scanBox video');
      const tr = v && v.srcObject && v.srcObject.getVideoTracks()[0];
      if (!tr || !tr.getCapabilities) return;
      this.track = tr;
      const caps = tr.getCapabilities();
      const zoomOk = caps.zoom && caps.zoom.max >= 2;
      $('scanZoom').classList.toggle('hidden', !zoomOk);
      $('scanTorch').classList.toggle('hidden', caps.torch !== true);
      if (zoomOk) this.setZoom(true);
    } catch (e) {}
  },
  setZoom(on) {
    try { this.zoom2 = on; this.track.applyConstraints({ advanced: [{ zoom: on ? 2 : 1 }] }); $('scanZoom').classList.toggle('on', on); } catch (e) {}
  },
  toggleTorch() {
    try { this.torch = !this.torch; this.track.applyConstraints({ advanced: [{ torch: this.torch }] }); $('scanTorch').classList.toggle('on', this.torch); } catch (e) {}
  },
  refocus() {  // ズーム・解像度をわずかに変えて戻し、ピント合わせをやり直させる（シリアルNo管理アプリと同じ方法）
    const tr = this.track; if (!tr) return;
    try {
      const caps = tr.getCapabilities ? tr.getCapabilities() : {}; const set = tr.getSettings ? tr.getSettings() : {};
      if (caps.zoom && caps.zoom.max) {
        const z = set.zoom || caps.zoom.min || 1;
        tr.applyConstraints({ advanced: [{ zoom: Math.min(caps.zoom.max, z + 0.1) }] }).then(() => setTimeout(() => tr.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {}), 180)).catch(() => {});
      }
    } catch (e) {}
  },
  onDecode(text) {
    if (this.paused || !this.active) return;
    const d = C.digits(text);
    if (!C.eanCheckOk(d)) { metric('scan_bad', 1); return; }
    const now = Date.now();
    if (d === this.last.v && now - this.last.t < 1500) return;
    this.last = { v: d, t: now };
    this.paused = true;
    const g = document.querySelector('#scanBox .scan-guide');
    if (g) { g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 300); }
    beep(true);
    metric('scan_ok', 1);
    handleJan(d, 'scan', this.place);
  },
  resume() { this.paused = false; this.last.t = Date.now(); },
  close() {
    this.active = false; this.paused = false;
    try { if (this.track && this.torch) this.track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
    this.track = null; this.torch = false;
    $('scanner').classList.add('hidden');
    const r = this.reader; this.reader = null;
    const clear = () => { $('scanBox').innerHTML = ''; };
    try { if (r) Promise.resolve(r.stop()).catch(() => {}).then(clear); else clear(); } catch (e) { clear(); }
    render();
  },
};
$('scanClose').onclick = () => scan.close();
$('scanTorch').onclick = () => scan.toggleTorch();
$('scanZoom').onclick = () => scan.setZoom(!scan.zoom2);
$('scanManual').onclick = () => { scan.paused = true; openManualJan(scan.place); };
$('scanBox').addEventListener('click', () => scan.refocus());

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const fileBase = s => '棚卸し_' + C.jstDate(s.createdAt).replace(/-/g, '') + '_' + String(s.name).replace(/[\\/:*?"<>|\s]+/g, '_');
function csvResult() {

  r.items.forEach(x => rows.push([x.code, x.jan, x.name, x.unit, x.shelf, x.tier, x.bookQty, x.shelfQty, x.stockQty, x.otherQty, x.actual, x.diff, x.price, x.diffAmount, x.counters]));

}

    if (a.key !== 'yes') return;
    if (!a.value) return toast('理由を入れてください', 'error');
    let r; try { r = await rpc('st_cancel_session', { sessionId: sid(), reason: a.value }); } catch (e) { return toast('通信できません', 'error'); }
    if (!r.success) return toast(errText(r.error), 'error');
    await loadSession(await loadWhoami()); S.stack = [{ name: 'home' }]; toast('中止しました'); render();
  },
  openHist: d => go('report', { sessionId: d.id, tab: 'diff' }),
  reopenSession: async d => {
    const a = await ask('確定を取り消しますか？', '実施中に戻し、記録の追加・取消ができるようにします。理由を入れてください。', [{ key: 'yes', label: '取り消す', cls: 'danger' }, { key: 'no', label: 'やめる' }], { placeholder: '理由（例: 数え直し）' });
    if (a.key !== 'yes') return;
    if (!a.value) return toast('理由を入れてください', 'error');
    let r; try { r = await rpc('st_reopen_session', { sessionId: d.id, reason: a.value }); } catch (e) { return toast('通信できません', 'error'); }
    if (!r.success) return toast(errText(r.error), 'error');
    await loadSession(await loadWhoami()); S.stack = [{ name: 'home' }]; toast('実施中に戻しました'); render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.closest('#modal') || el.closest('#sheetBody')) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
$('hdBack').onclick = back;
$('sheetBg').onclick = closeSheet;

/* ============================================================
   起動
============================================================ */
async function boot() {
  const t0 = Date.now();
  $('ver').textContent = '棚卸し ' + APP_VERSION + (ST_CONFIG.env !== 'prod' ? '（' + ST_CONFIG.env + '）' : '');
  S.bf = readBfSession();
  if (!S.bf) { location.replace(ST_CONFIG.portalUrl); return; }
  loadPref();
  try { S.deviceId = localStorage.getItem(DEVICE_KEY) || ''; if (!S.deviceId) { S.deviceId = 'd-' + C.uuid(); localStorage.setItem(DEVICE_KEY, S.deviceId); } }
  catch (e) { S.deviceId = 'd-' + C.uuid(); }
  try { await idbOpen(); }
  catch (e) { return showFatal('この状態では使えません', '端末に記録を保存できません（プライベートブラウズ等）。通常のSafariで開き直してください。'); }
  try {
    S.ops = (await idb('outbox', 'readonly', s => s.getAll())).sort((a, b) => (a.k < b.k ? -1 : 1));
    S.rejected = await idb('rejected', 'readonly', s => s.getAll());
  } catch (e) { return showFatal('この状態では使えません', '端末の保存領域を読めませんでした。'); }
  S.stack = [{ name: 'home' }];
  $('hdUser').textContent = S.bf.name || '';
  for (let i = 0; ; i++) {
    try {
      const active = await loadWhoami();
      await loadSession(active);
      break;
    } catch (e) {
      if (e instanceof AuthError) return showAuthProblem();
      // 電波が無い: 前回の写しが端末にあれば、それで開いて入力を続けられるようにする（送信は回復後に自動）
      if (i === 0 && await bootOffline()) return;
      if (i >= 2) {
        showFatal('つながりません', '電波の届く場所で、もう一度お試しください。',
          '<button class="btn dark" type="button" onclick="location.reload()">もう一度</button>');
        return;
      }
      await new Promise(r => setTimeout(r, [2000, 5000][i]));
    }
  }
  startTimers();
  metric('startup', Date.now() - t0, { cached: S.server.size > 0 });
  render();
  flush();
}
async function bootOffline() {
  const b = await kvGet('boot').catch(() => null);
  if (!b || b.userId !== S.bf.user_id || !b.me || !b.active) return false;
  S.me = b.me; S.productInfo = b.productInfo;
  try { await loadSession(b.active, true); } catch (e) { return false; }
  S.offline = true; S.firstFailAt = Date.now() - 31000;
  metric('startup_offline', 1);
  startTimers();
  render();
  // つながるまで裏で確かめ続ける
  const retry = async () => {
    try {
      const active = await loadWhoami();
      S.offline = false; S.firstFailAt = 0;
      if (!active || active.sessionId !== sid()) { await loadSession(active); S.stack = [{ name: 'home' }]; }
      else { await loadSession(active); }
      render(); flush();
    } catch (e) {
      if (e instanceof AuthError) return showAuthProblem();
      setTimeout(retry, 10000);
    }
  };
  setTimeout(retry, 5000);
  return true;
}
let timersStarted = false;
function startTimers() {
  if (timersStarted) return; timersStarted = true;
  setInterval(() => {
    if (document.visibilityState !== 'visible' || !S.session) return;
    if (['places', 'shelf', 'stock', 'close', 'home'].includes(cur().name)) fetchState(false).catch(() => {});
    renderBand();
  }, 15000);
  setInterval(sendMetrics, 60000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { flush(); if (S.session) fetchState(false).catch(() => {}); }
  else sendMetrics();
});
window.addEventListener('online', () => flush());
window.addEventListener('beforeunload', e => { if (S.ops.length) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
