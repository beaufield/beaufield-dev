<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロジェクトダッシュボード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  body.dnd-active { user-select: none; }

  header {
    background: #1a73e8;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: bold; }
  header .synced-at { font-size: 11px; opacity: 0.85; }
  header .version { font-size: 11px; opacity: 0.7; margin-left: auto; }
  header .btn-refresh {
    background: rgba(255,255,255,0.18); border: none; color: #fff;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header .btn-refresh:active { background: rgba(255,255,255,0.32); }

  .tab-bar {
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 12px 16px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .tab-count {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
    background: #e8eaed; color: #555; border-radius: 9px; font-size: 11px; font-weight: bold;
  }
  .tab-btn.active .tab-count { background: #d2e3fc; color: #1a73e8; }

  .sort-select {
    flex-shrink: 0;
    align-self: center;
    margin: 0 10px 0 auto;
    padding: 5px 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
    color: #555;
    background: #fff;
    cursor: pointer;
  }

  .chip-row {
    background: #fff;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid #eee;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 14px;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 12px;
    color: #666;
    cursor: pointer;
  }
  .chip.active { background: #1a73e8; border-color: #1a73e8; color: #fff; }

  main { flex: 1; width: 100%; padding: 16px; max-width: 720px; margin: 0 auto; }

  #status-msg { text-align: center; padding: 40px 0; color: #888; font-size: 14px; }
  #status-msg.error { color: #c62828; }

  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .pcard {
    position: relative;
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    cursor: pointer;
  }
  .pcard-row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pcard-name { font-size: 15px; font-weight: bold; flex: 1; min-width: 0; }

  /* 「次の一手」: カードの主役。プロジェクト名の直下に太字1行で表示する */
  .pcard-next-action {
    margin-top: 6px; font-size: 14px; font-weight: bold; color: #14326b;
    line-height: 1.4;
  }
  /* 原本の「次の一手」が規約より長いとカードが縦に伸びて一覧性が壊れるため2行で畳む。
     カードをタップすると .text-expanded が付いて全文（next_action_full）が出る。
     自動ジョブの点検結果は複数行ワンセットなので、この修飾子を付けない側で全行出す */
  .pcard-next-action.clamp2 {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard.text-expanded .pcard-next-action.clamp2 { -webkit-line-clamp: unset; display: block; }

  /* プロジェクト名も原本次第で長文になりうる（**プロジェクト**行が説明文のケース） */
  .pcard-name {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard.text-expanded .pcard-name { -webkit-line-clamp: unset; display: block; }

  .edit-toggle-btn {
    border: none; background: none; color: #bbb; font-size: 15px; cursor: pointer;
    padding: 3px 7px; border-radius: 5px;
  }
  .edit-toggle-btn:hover { background: #f0f0f0; color: #666; }

  /* ドラッグハンドル: PCのみ表示。カード左端いっぱいに掴みやすい領域を確保する */
  .drag-handle {
    display: none;
    position: absolute; left: 0; top: 0; bottom: 0; width: 30px;
    align-items: center; justify-content: center;
    cursor: grab; color: #ccc; font-size: 18px; line-height: 1;
    touch-action: none; user-select: none;
    border-radius: 10px 0 0 10px;
  }
  .drag-handle:hover { background: #eef2ff; color: #1a73e8; }
  .pcard.dragging { opacity: 0.4; }
  .pcard.dragging .drag-handle { cursor: grabbing; background: #e0e7ff; color: #1a73e8; }

  .drop-indicator {
    height: 4px; border-radius: 2px; background: #1a73e8;
    grid-column: 1 / -1;
  }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .badge-運用中     { background: #d1f0d1; color: #155724; }
  .badge-進行中     { background: #d2e3fc; color: #1a73e8; }
  .badge-レビュー待ち{ background: #ffe6c7; color: #a45c00; }
  .badge-要対応     { background: #fde8e8; color: #c62828; }
  .badge-計画中     { background: #eee; color: #777; }
  .badge-待機中     { background: #eee; color: #777; }
  .badge-要確認     { background: #fff3cd; color: #856404; }
  /* 資産の種別バッジ（🧰 資産タブ）。状態ではなく分類なので彩度を落として主張させない */
  .badge-kind       { background: #ede9fe; color: #5b4bb7; }

  .ball-badge { font-size: 11px; padding: 2px 9px; border-radius: 10px; font-weight: bold; }
  .ball-Takashi   { background: #fde8e8; color: #c62828; }
  .ball-Claude    { background: #e8eefc; color: #3b5bdb; }
  .ball-環境待ち   { background: #f3e8fd; color: #7e3cad; }

  .stale-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  .stale-ok   { background: #f0f0f0; color: #999; }
  .stale-warn { background: #fff3cd; color: #856404; }
  .stale-bad  { background: #fde8e8; color: #c62828; }

  /* 手動運用バッジ（manual_ops列に説明文があるプロジェクトに表示。説明文は展開パネル参照） */
  .manualops-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold;
                     background: #e6f4f1; color: #0f766e; }

  .effort-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 10px; background: #f2f2f2;
  }
  .effort-dot { width: 6px; height: 6px; border-radius: 50%; background: #d8d8d8; display: inline-block; }
  /* 工数が重いほど目立つ色にする（S=控えめグレー→M=青→L=オレンジ→XL=赤） */
  .effort-badge-S  { background: #f2f2f2; }
  .effort-badge-S  .effort-dot.filled { background: #9a9a9a; }
  .effort-badge-M  { background: #e8eefc; }
  .effort-badge-M  .effort-dot.filled { background: #3b5bdb; }
  .effort-badge-L  { background: #ffedd9; }
  .effort-badge-L  .effort-dot.filled { background: #e8830f; }
  .effort-badge-XL { background: #fde3e3; }
  .effort-badge-XL .effort-dot.filled { background: #d32f2f; }

  .pcard-row2 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 8px; font-size: 12px; color: #888;
  }
  .cat-tag { color: #999; }

  .pcard-summary {
    margin-top: 10px; font-size: 13px; color: #555; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard.text-expanded .pcard-summary { -webkit-line-clamp: unset; display: block; }
  /* 表示件数が少ない（<=8件）ときはさらにコンパクトに(2行) */
  #card-list.dense .pcard-summary,
  .collapse-section .body.dense .pcard-summary { -webkit-line-clamp: 2; }

  .pcard-actions { margin-top: 10px; }
  .pcard-actions ul { list-style: none; }
  .pcard-actions li {
    font-size: 12.5px; color: #444; padding: 3px 0 3px 16px; position: relative; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard-actions li::before { content: '・'; position: absolute; left: 0; color: #aaa; }
  .pcard.text-expanded .pcard-actions li { -webkit-line-clamp: unset; display: block; }
  .more-hint { font-size: 11.5px; color: #1a73e8; margin-top: 4px; }

  .rel-row { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .rel-chip {
    font-size: 11px; padding: 3px 10px; border-radius: 10px;
    background: #f0f4ff; color: #3b5bdb; cursor: pointer;
  }
  .rel-chip:active { background: #dbe4ff; }

  .pcard.highlight { animation: flash 1.4s ease; }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 3px #1a73e8; }
    100% { box-shadow: 0 1px 4px rgba(0,0,0,0.10); }
  }

  /* ── 編集パネル（⚙アイコンで開閉） ── */
  .pcard-expand {
    display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee;
  }
  .pcard.expanded .pcard-expand { display: block; }
  .exp-field { margin-bottom: 10px; }
  .exp-field label { display: block; font-size: 11px; font-weight: bold; color: #888; margin-bottom: 4px; }
  .exp-field input, .exp-field select, .exp-field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; font-family: inherit;
  }
  .exp-field textarea { resize: vertical; min-height: 50px; }
  .exp-btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn-save {
    flex: 1; padding: 9px; background: #1a73e8; color: #fff; border: none;
    border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
  }
  .btn-save:disabled { background: #aaa; }
  .btn-cancel {
    padding: 9px 16px; background: #f0f0f0; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; color: #555;
  }
  .exp-meta { font-size: 11px; color: #aaa; margin-top: 10px; }

  /* ── 運用中まとめセクション（「すべて」タブ内の折りたたみ） ── */
  .collapse-section {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10); cursor: pointer;
  }
  .collapse-section .head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: #444; }
  .collapse-section .head .arrow { transition: transform 0.2s; color: #999; }
  .collapse-section.open .head .arrow { transform: rotate(90deg); }
  .collapse-section .body { display: none; flex-direction: column; gap: 12px; margin-top: 12px; }
  .collapse-section.open .body { display: flex; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; z-index: 500; opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  footer { text-align: center; padding: 16px; font-size: 11px; color: #aaa; }

  @media (min-width: 600px) {
    header h1 { font-size: 19px; }
    .pcard-name { font-size: 16px; }
  }

  /* ── PC向けレイアウト: 複数列グリッド＋ドラッグ並び替え ── */
  @media (min-width: 860px) {
    main { max-width: 1440px; }
    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
      align-items: start;
    }
    .collapse-section { grid-column: 1 / -1; }
    .collapse-section.open .body {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
      align-items: start;
    }
    .pcard { padding-left: 38px; }
    .drag-handle { display: flex; }
    /* 優先度順以外でソート中は並び替え不能にする（表示順と priority がずれるため） */
    body.sort-alt .pcard { padding-left: 16px; }
    body.sort-alt .drag-handle { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>📊 プロジェクトダッシュボード</h1>
  <span class="synced-at" id="synced-at"></span>
  <button class="btn-refresh" onclick="loadData(true)">更新</button>
  <span class="version" id="header-version"></span>
</header>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="takashi" onclick="switchTab('takashi')">⏳ Takashi待ち<span class="tab-count" id="cnt-takashi">0</span></button>
  <button class="tab-btn" data-tab="claude" onclick="switchTab('claude')">🔧 Claude待ち<span class="tab-count" id="cnt-claude">0</span></button>
  <button class="tab-btn" data-tab="env" onclick="switchTab('env')">🏢 環境待ち<span class="tab-count" id="cnt-env">0</span></button>
  <button class="tab-btn" data-tab="stale" onclick="switchTab('stale')">🔴 滞留(14日+)<span class="tab-count" id="cnt-stale">0</span></button>
  <button class="tab-btn" data-tab="active" onclick="switchTab('active')">🟢 稼働中<span class="tab-count" id="cnt-active">0</span></button>
  <button class="tab-btn" data-tab="all" onclick="switchTab('all')">すべて<span class="tab-count" id="cnt-all">0</span></button>
  <button class="tab-btn" data-tab="assets" onclick="switchTab('assets')">🧰 資産<span class="tab-count" id="cnt-assets">0</span></button>
  <button class="tab-btn" data-tab="jobs" onclick="switchTab('jobs')">⏰ 自動ジョブ<span class="tab-count" id="cnt-jobs">0</span></button>
  <select class="sort-select" id="sort-select" onchange="setSort(this.value)">
    <option value="priority">優先度順</option>
    <option value="new">新しい順</option>
    <option value="effort">工数が多い順</option>
  </select>
</div>

<div class="chip-row" id="chip-row">
  <button class="chip active" data-cat="" onclick="setCategory('')">すべて</button>
  <button class="chip" data-cat="開発・自動化" onclick="setCategory('開発・自動化')">開発・自動化</button>
  <button class="chip" data-cat="商品" onclick="setCategory('商品')">商品</button>
  <button class="chip" data-cat="経営・業務" onclick="setCategory('経営・業務')">経営・業務</button>
  <button class="chip" data-cat="LINEHarness" onclick="setCategory('LINEHarness')">LINEHarness</button>
  <button class="chip" data-cat="Codex" onclick="setCategory('Codex')">Codex</button>
  <button class="chip" data-cat="Note" onclick="setCategory('Note')">Note</button>
  <button class="chip" data-cat="全般" onclick="setCategory('全般')">全般</button>
</div>

<!-- 資産タブ専用の絞り込み（種別）。カテゴリチップと入れ替えで表示する -->
<div class="chip-row" id="kind-row" style="display:none">
  <button class="chip active" data-kind="" onclick="setKind('')">すべて</button>
  <button class="chip" data-kind="skill" onclick="setKind('skill')">スキル</button>
  <button class="chip" data-kind="agent" onclick="setKind('agent')">エージェント</button>
  <button class="chip" data-kind="bat" onclick="setKind('bat')">バッチ</button>
  <button class="chip" data-kind="script" onclick="setKind('script')">スクリプト</button>
</div>

<!-- 自動ジョブタブ専用の絞り込み（ステータス）。カテゴリチップと入れ替えで表示する -->
<div class="chip-row" id="status-row" style="display:none">
  <button class="chip active" data-status="" onclick="setJobStatus('')">すべて</button>
  <button class="chip" data-status="bad" onclick="setJobStatus('bad')">🔴 異常</button>
  <button class="chip" data-status="warn" onclick="setJobStatus('warn')">🟡 要確認</button>
  <button class="chip" data-status="ok" onclick="setJobStatus('ok')">🟢 正常</button>
</div>

<main>
  <div id="status-msg">読み込み中...</div>
  <div class="card-list" id="card-list"></div>
</main>

<footer id="footer-text"></footer>

<div class="toast" id="toast"></div>

<script>
  // ============================================================
  // 設定
  // ============================================================
  const GAS_URL      = 'https://script.google.com/macros/s/AKfycbzkuWEqpJLhERoYlosHIeazlVjl3ipIq8u3x0rp4tCU7BaqPuYt4kP78Ha5Vu4ayNWDCg/exec';
  const PORTAL_URL   = 'https://beaufield.github.io/beaufield-dev/';
  const APP_VERSION  = '1.14.0';
  const USE_MOCK     = false; // ← 開発中は true にして data/dashboard_data.json を見る

  document.getElementById('header-version').textContent = 'v' + APP_VERSION;
  document.getElementById('footer-text').textContent = 'プロジェクトダッシュボード v' + APP_VERSION + ' | Beaufield（管理者専用）';

  let session         = null;
  let allProjects      = [];
  let allAssets        = [];   // 発火待ち資産（スキル・エージェント・.bat・手動スクリプト）
  let allJobs          = [];   // 自動ジョブ監視（L3=結果検証。タスクスケジューラ/GitHub Actionsの成果物を直接読んだ結果）
  let currentTab       = 'takashi';
  let currentCat       = '';
  let currentKind      = '';   // 資産タブの種別絞り込み
  let currentJobStatus = '';  // 自動ジョブタブのステータス絞り込み（''/bad/warn/ok）
  let currentSort      = 'priority';  // 'priority'（既定・並び替え可）/ 'new'（更新が新しい順）/ 'effort'（工数が多い順）
  let metaEditId       = null;        // ⚙アイコンで開く編集パネル（単一開閉）
  let textExpandedIds  = new Set();   // カード本体クリックで全文表示中のID（複数可）
  let dragState        = null;        // { pointerId, card, container }（PCドラッグ並び替え中の状態）

  const STATUS_ORDER = ['運用中','進行中','レビュー待ち','要対応','計画中','待機中','要確認'];
  const EFFORT_LEVELS = { S: 1, M: 2, L: 3, XL: 4 };
  const EFFORT_LABELS = { S: 'S・軽い', M: 'M・普通', L: 'L・重い', XL: 'XL・大仕事' };

  // PCのみドラッグ並び替え・グリッドレイアウトを有効化（スマホは数値入力のみ）
  function isDesktop() { return window.matchMedia('(min-width: 860px)').matches; }
  let _resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(render, 150); // 幅をまたいだらドラッグハンドルの有無を再構築する
  });

  // ============================================================
  // 初期化
  // ============================================================
  window.onload = function () {
    try { session = JSON.parse(localStorage.getItem('bf_session')); } catch (e) { session = null; }
    if (!USE_MOCK) {
      if (!session || !session.token || !session.expires || Date.now() > session.expires) {
        location.href = PORTAL_URL;
        return;
      }
      if (!session.is_admin) {
        location.href = PORTAL_URL;
        return;
      }
    }
    loadData(false);
  };

  function loadData(manual) {
    showStatus('読み込み中...', false);
    if (manual) showToast('更新中...');

    const dataPromise = USE_MOCK
      ? fetch('data/dashboard_data.json').then(r => r.json()).then(mock => ({
          success: true,
          synced_at: mock.generated_at,
          projects: mock.projects,
          assets: mock.assets,
          jobs: mock.jobs
        }))
      : fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'data', session_token: session.token })
        })
          .then(r => r.json());

    dataPromise
      .then(data => {
        if (!data.success) {
          if (data.error === 'SESSION_INVALID' || data.error === 'FORBIDDEN') {
            location.href = PORTAL_URL;
            return;
          }
          throw new Error(data.message || data.error || '取得失敗');
        }
        allProjects = data.projects || [];
        allAssets   = data.assets || [];   // GAS未デプロイ時は空配列（既存タブには影響しない）
        allJobs     = data.jobs || [];     // 同上
        document.getElementById('synced-at').textContent =
          data.synced_at ? ('最終同期: ' + fmtDateTime(data.synced_at)) : '';
        render();
      })
      .catch(err => {
        console.error('データ取得エラー:', err);
        showStatus('データの取得に失敗しました。' + (err.message || ''), true);
      });
  }

  // ============================================================
  // タブ・カテゴリ切り替え
  // ============================================================
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    // 資産・自動ジョブはプロジェクトと別モデル（カテゴリ絞り込みも並び替えも意味が違う）ので、
    // それぞれ専用のチップ行に入れ替え、ソートセレクトは隠して固定順にする
    const isAssets = tab === 'assets';
    const isJobs   = tab === 'jobs';
    document.getElementById('chip-row').style.display = (isAssets || isJobs) ? 'none' : '';
    document.getElementById('kind-row').style.display = isAssets ? '' : 'none';
    document.getElementById('status-row').style.display = isJobs ? '' : 'none';
    document.getElementById('sort-select').style.display = (isAssets || isJobs) ? 'none' : '';
    render();
  }

  function setCategory(cat) {
    currentCat = cat;
    document.querySelectorAll('#chip-row .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
    render();
  }

  function setKind(kind) {
    currentKind = kind;
    document.querySelectorAll('#kind-row .chip').forEach(c => c.classList.toggle('active', c.dataset.kind === kind));
    render();
  }

  function setJobStatus(status) {
    currentJobStatus = status;
    document.querySelectorAll('#status-row .chip').forEach(c => c.classList.toggle('active', c.dataset.status === status));
    render();
  }

  function setSort(mode) {
    currentSort = mode;
    document.body.classList.toggle('sort-alt', mode !== 'priority'); // 優先度順以外はドラッグ並び替えを無効化
    render();
  }

  // ============================================================
  // 集計・フィルタ・描画
  // ============================================================
  // 「運用中」かつ次アクションが残っていない = 本番稼働のみで作業待ちではない案件
  function isDormant(p) {
    return p.status_label === '運用中' && (!p.next_actions || !p.next_actions.length);
  }

  // 残タスクが1件でもあるか。滞留タブは「やることが残っているのに放置されている」案件だけを出す
  // （状態が運用中/進行中かは問わない。「特にやることなし」と書いた案件は同期側でnext_actionsが空になる）
  function hasPendingActions(p) {
    return Array.isArray(p.next_actions) && p.next_actions.length > 0;
  }

  function effectiveBall(p) {
    if (p.manual_ball && String(p.manual_ball).trim()) return p.manual_ball;
    if (isDormant(p)) return 'none'; // 稼働中のみの案件は作業タブのノイズにしない
    return p.ball;
  }

  function staleDays(p) {
    if (!p.last_update) return null;
    const d = new Date(p.last_update);
    if (isNaN(d)) return null;
    const today = new Date();
    return Math.floor((today - d) / 86400000);
  }

  function matchesTab(p, tab) {
    const ball = effectiveBall(p);
    const sd = staleDays(p);
    switch (tab) {
      case 'takashi': return ball === 'Takashi';
      case 'claude':  return ball === 'Claude';
      case 'env':     return ball === '環境待ち';
      case 'active':  return p.status_label === '運用中';
      case 'stale':   return sd !== null && sd >= 14 && hasPendingActions(p);
      case 'all':     return true;
      default:        return true;
    }
  }

  function render() {
    // タブ件数（カテゴリ絞り込み前・全体件数）を出す
    ['takashi','claude','env','stale','active'].forEach(t => {
      document.getElementById('cnt-' + t).textContent = allProjects.filter(p => matchesTab(p, t)).length;
    });
    document.getElementById('cnt-all').textContent = allProjects.length;
    // 資産タブは「未使用が何件あるか」が本題なので、総数ではなく未使用件数をバッジに出す
    document.getElementById('cnt-assets').textContent = allAssets.filter(isUnused).length;
    // 自動ジョブタブも同様に、総数ではなく異常/要確認件数をバッジに出す
    document.getElementById('cnt-jobs').textContent = allJobs.filter(j => jobHealth(j).cls !== 'stale-ok').length;

    if (currentTab === 'assets') { renderAssets(); return; }
    if (currentTab === 'jobs')   { renderJobs(); return; }

    let list = allProjects.filter(p => matchesTab(p, currentTab));
    if (currentCat) list = list.filter(p => p.category === currentCat);

    const listEl = document.getElementById('card-list');
    listEl.innerHTML = '';

    if (!list.length) {
      showStatus('該当するプロジェクトはありません', false);
      return;
    }
    hideStatus();

    if (currentTab === 'all') {
      const active  = list.filter(p => !isDormant(p));
      const dormant = list.filter(p => isDormant(p));
      listEl.classList.toggle('dense', active.length <= 8);
      sortList(active).forEach(p => listEl.appendChild(buildCard(p)));
      if (dormant.length) listEl.appendChild(buildCollapseSection(dormant));
    } else {
      listEl.classList.toggle('dense', list.length <= 8);
      sortList(list).forEach(p => listEl.appendChild(buildCard(p)));
    }
  }

  function sortList(list) {
    if (currentSort === 'new') {
      return list.slice().sort((a, b) => {
        const ta = a.last_update ? new Date(a.last_update).getTime() : -Infinity;
        const tb = b.last_update ? new Date(b.last_update).getTime() : -Infinity;
        return tb - ta; // 更新日が新しい順
      });
    }
    if (currentSort === 'effort') {
      return list.slice().sort((a, b) => {
        const ea = EFFORT_LEVELS[a.effort] || 0, eb = EFFORT_LEVELS[b.effort] || 0;
        if (ea !== eb) return eb - ea; // 工数が多い順
        return (Number(b.priority) || 0) - (Number(a.priority) || 0);
      });
    }
    return list.slice().sort((a, b) => {
      const pa = Number(a.priority) || 0, pb = Number(b.priority) || 0;
      if (pa !== pb) return pb - pa;
      const sa = staleDays(a), sb = staleDays(b);
      return (sb === null ? -1 : sb) - (sa === null ? -1 : sa);
    });
  }

  function showStatus(msg, isError) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
    el.style.display = 'block';
  }
  function hideStatus() {
    document.getElementById('status-msg').style.display = 'none';
  }

  // ============================================================
  // 工数バッジ
  // ============================================================
  function effortBadgeHtml(p) {
    if (!p.effort || !EFFORT_LEVELS[p.effort]) return '';
    const n = EFFORT_LEVELS[p.effort];
    const dots = [1,2,3,4].map(i => '<span class="effort-dot' + (i <= n ? ' filled' : '') + '"></span>').join('');
    return '<span class="effort-badge effort-badge-' + p.effort + '" title="工数感: ' + EFFORT_LABELS[p.effort] + '">' + dots + '</span>';
  }

  // ============================================================
  // 発火待ち資産（🧰 資産タブ）
  // Takashiが自分で起動しないと永久に動かないスキル・エージェント・.bat・手動スクリプト。
  // 「作ったのに忘れている」ものを見つけるのが目的なので、忘却度順に固定で並べる。
  // ============================================================
  const KIND_LABELS = { skill: '🧠 スキル', agent: '🤖 エージェント', bat: '⚙ バッチ', script: '📜 スクリプト' };
  const DISPOSITIONS = ['', '現役', '様子見', '廃止候補'];

  // 「未使用」= 起動履歴を取れる資産なのに一度も起動されていない。
  // evidence==='none'（.bat 等・実行日を取る手段が無い）を未使用と偽らないための条件。
  function isUnused(a) {
    return a.evidence !== 'none' && !Number(a.use_count);
  }

  function usedDays(a) {
    if (!a.last_used) return null;
    const d = new Date(a.last_used);
    if (isNaN(d)) return null;
    return Math.floor((new Date() - d) / 86400000);
  }

  function assetState(a) {
    if (a.evidence === 'none') return { cls: 'stale-ok', txt: '⚪ 記録なし', rank: 2 };
    if (isUnused(a))           return { cls: 'stale-bad', txt: '🔴 未使用', rank: 0 };
    const d = usedDays(a);
    if (d === null)            return { cls: 'stale-ok', txt: '使用日不明', rank: 1 };
    if (d >= 90)               return { cls: 'stale-warn', txt: d + '日前', rank: 1 };
    return { cls: 'stale-ok', txt: d + '日前', rank: 1 };
  }

  function renderAssets() {
    let list = allAssets.slice();
    if (currentKind) list = list.filter(a => a.kind === currentKind);

    const listEl = document.getElementById('card-list');
    listEl.innerHTML = '';
    if (!list.length) { showStatus('該当する資産はありません', false); return; }
    hideStatus();

    // 忘却度順: 未使用 → 最終使用が古い順 → 記録なし（判定不能は末尾）
    list.sort((a, b) => {
      const ra = assetState(a).rank, rb = assetState(b).rank;
      if (ra !== rb) return ra - rb;
      const la = a.last_used || '', lb = b.last_used || '';
      if (la !== lb) return la < lb ? -1 : 1;
      return String(a.name).localeCompare(String(b.name));
    });

    listEl.classList.toggle('dense', list.length <= 8);
    list.forEach(a => listEl.appendChild(buildAssetCard(a)));
  }

  function buildAssetCard(a) {
    const div = document.createElement('div');
    const textExpanded = textExpandedIds.has(a.id);
    div.className = 'pcard' + (a.id === metaEditId ? ' expanded' : '') + (textExpanded ? ' text-expanded' : '');
    div.id = 'pcard-' + a.id;
    div.dataset.id = a.id;
    div.onclick = function (e) {
      if (e.target.closest('.rel-chip, .exp-field, .exp-btns, .drag-handle, .edit-toggle-btn')) return;
      toggleTextExpand(a.id);
    };

    const st = assetState(a);
    // 忘れている資産は使い方も忘れている。トリガーワードはカードの主役として常に出す
    const triggerHtml = a.trigger
      ? '<div class="pcard-next-action clamp2">🗣 ' + esc(a.trigger) + '</div>' : '';
    const summaryHtml = (textExpanded && a.summary)
      ? '<div class="pcard-summary">' + esc(a.summary) + '</div>' : '';
    const countTxt = a.evidence === 'none' ? '実行回数の記録なし' : (Number(a.use_count) || 0) + '回';
    const dispHtml = a.disposition
      ? '<span class="manualops-badge">' + esc(a.disposition) + '</span>' : '';

    div.innerHTML =
      '<div class="pcard-row1">' +
        '<span class="pcard-name">' + esc(a.name) + '</span>' +
        '<span class="badge badge-kind">' + esc(KIND_LABELS[a.kind] || a.kind) + '</span>' +
        '<button class="edit-toggle-btn" title="扱い・メモを編集" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(a.id) + '\')">⚙</button>' +
      '</div>' +
      triggerHtml +
      '<div class="pcard-row2">' +
        '<span class="cat-tag">' + esc(a.category || '') + '</span>' +
        '<span class="stale-badge ' + st.cls + '">' + st.txt + '</span>' +
        '<span class="cat-tag">' + countTxt + '</span>' +
        dispHtml +
      '</div>' +
      summaryHtml +
      buildAssetExpandPanel(a);

    return div;
  }

  function buildAssetExpandPanel(a) {
    const dispOptions = DISPOSITIONS.map(v =>
      '<option value="' + v + '"' + ((a.disposition || '') === v ? ' selected' : '') + '>' +
      (v === '' ? '（未設定）' : v) + '</option>').join('');

    // 低頻度な資産（期次ブリーフィング等は年数回）を日数だけで死蔵扱いしないための逃げ道
    return '<div class="pcard-expand">' +
      '<div class="exp-field"><label>扱い（日数だけで判断できないものを手動で上書き）</label>' +
      '<select id="disp-' + esc(a.id) + '">' + dispOptions + '</select></div>' +
      '<div class="exp-field"><label>メモ</label>' +
      '<textarea id="memo-' + esc(a.id) + '">' + esc(a.memo || '') + '</textarea></div>' +
      '<div class="exp-btns">' +
        '<button class="btn-save" id="save-' + esc(a.id) + '" onclick="event.stopPropagation(); saveAssetMeta(\'' + jsArg(a.id) + '\')">保存</button>' +
        '<button class="btn-cancel" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(a.id) + '\')">閉じる</button>' +
      '</div>' +
      '<div class="exp-meta">最終使用: ' + esc(a.last_used || '記録なし') +
        '（判定元: ' + esc(a.evidence) + '）</div>' +
      '<div class="exp-meta">原本: ' + esc(a.path || '') + '</div>' +
    '</div>';
  }

  // ============================================================
  // 自動ジョブ監視（⏰ 自動ジョブタブ）— L3: 結果検証
  // タスクスケジューラ/GitHub Actionsの「成功」表示ではなく、各ジョブの成果物（ログ・実行履歴）
  // を job_scan.py が直接読んで判定した結果を表示する。「動いたか」だけでなく
  // 「最終実行から想定間隔+猶予を超えていないか」（遅延・停止）はここ（描画時）で計算する。
  // ============================================================
  function jobHealth(j) {
    const limit = (Number(j.expected_interval_hours) || 24) + (Number(j.grace_hours) || 6);
    const hrs = j.last_run_at ? (Date.now() - new Date(j.last_run_at)) / 3600000 : NaN;

    if (!j.last_run_at || isNaN(hrs)) {
      return { cls: 'stale-bad', txt: '🔴 停止', rank: 0, detail: '実行の記録がありません' };
    }
    if (hrs > limit) {
      return { cls: 'stale-bad', txt: '🔴 停止', rank: 0,
               detail: '最終実行から' + Math.floor(hrs) + '時間経過（想定は' + limit + '時間以内）' };
    }
    if (j.last_status === 'error') {
      return { cls: 'stale-bad', txt: '🔴 異常終了', rank: 0, detail: j.last_message || '' };
    }
    const checks = Array.isArray(j.checks) ? j.checks : [];
    if (checks.some(c => c.status === 'fail')) {
      return { cls: 'stale-bad', txt: '🔴 異常値', rank: 0, detail: j.last_message || '' };
    }
    if (j.last_status === 'unknown') {
      return { cls: 'stale-warn', txt: '⚪ 要確認', rank: 1, detail: j.last_message || '記録を確認できませんでした' };
    }
    if (checks.some(c => c.status === 'warn')) {
      return { cls: 'stale-warn', txt: '🟡 要確認', rank: 1, detail: j.last_message || '' };
    }
    return { cls: 'stale-ok', txt: '🟢 正常', rank: 2, detail: Math.floor(hrs) + '時間前に実行' };
  }

  function renderJobs() {
    let list = allJobs.slice();
    if (currentJobStatus) {
      list = list.filter(j => jobHealth(j).cls.replace('stale-', '') === currentJobStatus);
    }

    const listEl = document.getElementById('card-list');
    listEl.innerHTML = '';
    if (!list.length) { showStatus('該当する自動ジョブはありません', false); return; }
    hideStatus();

    // 異常度が高い順（停止/異常 → 要確認 → 正常）→ 名前順
    list.sort((a, b) => {
      const ra = jobHealth(a).rank, rb = jobHealth(b).rank;
      if (ra !== rb) return ra - rb;
      return String(a.name).localeCompare(String(b.name));
    });

    listEl.classList.toggle('dense', list.length <= 8);
    list.forEach(j => listEl.appendChild(buildJobCard(j)));
  }

  function buildJobCard(j) {
    const div = document.createElement('div');
    const textExpanded = textExpandedIds.has(j.id);
    div.className = 'pcard' + (j.id === metaEditId ? ' expanded' : '') + (textExpanded ? ' text-expanded' : '');
    div.id = 'pcard-' + j.id;
    div.dataset.id = j.id;
    div.onclick = function (e) {
      if (e.target.closest('.rel-chip, .exp-field, .exp-btns, .drag-handle, .edit-toggle-btn')) return;
      toggleTextExpand(j.id);
    };

    const health = jobHealth(j);
    const checks = Array.isArray(j.checks) ? j.checks : [];
    const checksHtml = checks.length
      ? '<div class="pcard-next-action">' +
          checks.map(c => {
            const icon = c.status === 'ok' ? '✓' : c.status === 'warn' ? '⚠' : '✗';
            return icon + ' ' + esc(c.label) + ': ' + esc(String(c.value)) +
              (c.note ? '（' + esc(c.note) + '）' : '');
          }).join('<br>') +
        '</div>'
      : '';
    const runTxt = j.last_run_at ? fmtDateTime(j.last_run_at) : '記録なし';
    const dispHtml = j.disposition
      ? '<span class="manualops-badge">' + esc(j.disposition) + '</span>' : '';

    div.innerHTML =
      '<div class="pcard-row1">' +
        '<span class="pcard-name">' + esc(j.name) + '</span>' +
        '<span class="stale-badge ' + health.cls + '">' + health.txt + '</span>' +
        '<button class="edit-toggle-btn" title="扱い・メモを編集" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(j.id) + '\')">⚙</button>' +
      '</div>' +
      '<div class="pcard-row2">' +
        '<span class="cat-tag">' + esc(j.category || '') + '</span>' +
        '<span class="cat-tag">' + esc(j.schedule_label || '') + '</span>' +
        '<span class="cat-tag">最終実行: ' + esc(runTxt) + '</span>' +
        dispHtml +
      '</div>' +
      checksHtml +
      buildJobExpandPanel(j, health);

    return div;
  }

  function buildJobExpandPanel(j, health) {
    const dispOptions = DISPOSITIONS.map(v =>
      '<option value="' + v + '"' + ((j.disposition || '') === v ? ' selected' : '') + '>' +
      (v === '' ? '（未設定）' : v) + '</option>').join('');

    return '<div class="pcard-expand">' +
      '<div class="exp-field"><label>扱い</label>' +
      '<select id="disp-' + esc(j.id) + '">' + dispOptions + '</select></div>' +
      '<div class="exp-field"><label>メモ</label>' +
      '<textarea id="memo-' + esc(j.id) + '">' + esc(j.memo || '') + '</textarea></div>' +
      '<div class="exp-btns">' +
        '<button class="btn-save" id="save-' + esc(j.id) + '" onclick="event.stopPropagation(); saveJobMeta(\'' + jsArg(j.id) + '\')">保存</button>' +
        '<button class="btn-cancel" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(j.id) + '\')">閉じる</button>' +
      '</div>' +
      '<div class="exp-meta">' + esc(health.detail || '') + '</div>' +
      '<div class="exp-meta">最終メッセージ: ' + esc(j.last_message || '（なし）') + '</div>' +
    '</div>';
  }

  // ============================================================
  // カード構築
  // ============================================================
  function buildCard(p) {
    const div = document.createElement('div');
    const textExpanded = textExpandedIds.has(p.id);
    div.className = 'pcard' +
      (p.id === metaEditId ? ' expanded' : '') +
      (textExpanded ? ' text-expanded' : '');
    div.id = 'pcard-' + p.id;
    div.dataset.id = p.id;
    div.onclick = function (e) {
      if (e.target.closest('.rel-chip, .exp-field, .exp-btns, .drag-handle, .edit-toggle-btn')) return;
      toggleTextExpand(p.id);
    };

    const sd = staleDays(p);
    const staleCls = sd === null ? 'stale-ok' : sd >= 30 ? 'stale-bad' : sd >= 14 ? 'stale-warn' : 'stale-ok';
    const staleTxt = sd === null ? '更新日不明' : sd + '日前';

    const statusCls = 'badge-' + (p.status_label || '');
    const ball = effectiveBall(p);
    const ballBadgeHtml = ball === 'none' ? '' :
      '<span class="ball-badge ball-' + ball + '">' + esc(ball) + '</span>';
    const parseWarn = p.parse_ok === false ? '<span class="badge badge-要確認">⚠要確認</span>' : '';

    // 折り畳み時は短縮版（同期側で1段落・40字に詰めたもの）、展開時は原本の全文を出す。
    // next_action_full が無い（GAS側の列追加前・古いデータ）ときは短縮版のまま
    const naFull = p.next_action_full || '';
    const nextActionText = (textExpanded && naFull) ? naFull : p.next_action_short;
    // ツールチップは長すぎると邪魔になるので短いものだけ（全文はタップ展開で見る）
    const naTitle = (naFull && naFull.length <= 200 && naFull !== p.next_action_short)
      ? ' title="' + esc(naFull) + '"' : '';
    const nextActionHtml = nextActionText ?
      '<div class="pcard-next-action clamp2"' + naTitle + '>👉 ' + esc(nextActionText) + '</div>' : '';

    // summary / next_actions の詳細はカードタップ（全文展開）時のみ表示。主役は次の一手に譲る
    const summaryHtml = (textExpanded && p.summary) ?
      '<div class="pcard-summary">' + esc(p.summary) + '</div>' : '';

    let actionsHtml = '';
    if (textExpanded && p.next_actions && p.next_actions.length) {
      actionsHtml = '<div class="pcard-actions"><ul>' +
        p.next_actions.map(a => '<li>' + esc(a) + '</li>').join('') +
        '</ul></div>';
    }

    let relHtml = '';
    if (p.relations && p.relations.length) {
      relHtml = '<div class="rel-row">' + p.relations.map(r => {
        const target = allProjects.find(x => x.id === r.id);
        const name = target ? target.name : r.id;
        return '<span class="rel-chip" title="' + esc(r.reason || '') +
          '" onclick="jumpTo(\'' + jsArg(r.id) + '\')">🔗 ' + esc(name) + '</span>';
      }).join('') + '</div>';
    }

    div.innerHTML =
      '<span class="drag-handle" title="ドラッグで並び替え（PCのみ）">⋮⋮</span>' +
      '<div class="pcard-row1">' +
        '<span class="pcard-name">' + esc(p.name) + '</span>' +
        '<span class="badge ' + statusCls + '">' + esc(p.status_label || '?') + '</span>' +
        parseWarn +
        '<button class="edit-toggle-btn" title="優先度・工数・メモを編集" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(p.id) + '\')">⚙</button>' +
      '</div>' +
      nextActionHtml +
      '<div class="pcard-row2">' +
        '<span class="cat-tag">' + esc(p.category || '') + '</span>' +
        ballBadgeHtml +
        '<span class="stale-badge ' + staleCls + '">' + staleTxt + '</span>' +
        effortBadgeHtml(p) +
        (p.manual_ops ? '<span class="manualops-badge" title="' + esc(p.manual_ops) + '">🔁 手動運用</span>' : '') +
      '</div>' +
      summaryHtml + actionsHtml + relHtml +
      buildExpandPanel(p);

    if (isDesktop() && currentSort === 'priority') attachDragHandlers(div);

    return div;
  }

  function buildExpandPanel(p) {
    const ballOptions = ['', 'Takashi', 'Claude', '環境待ち'].map(v =>
      '<option value="' + v + '"' + ((p.manual_ball || '') === v ? ' selected' : '') + '>' +
      (v === '' ? '（自動判定のまま）' : v) + '</option>').join('');
    const effortOptions = ['', 'S', 'M', 'L', 'XL'].map(v =>
      '<option value="' + v + '"' + ((p.effort || '') === v ? ' selected' : '') + '>' +
      (v === '' ? '（未設定）' : EFFORT_LABELS[v]) + '</option>').join('');

    return '<div class="pcard-expand">' +
      '<div class="exp-field"><label>優先度（数値・大きいほど上）</label>' +
      '<input type="number" id="pri-' + esc(p.id) + '" value="' + (p.priority != null ? p.priority : '') + '"></div>' +
      '<div class="exp-field"><label>ボール（手動で上書き）</label>' +
      '<select id="ball-' + esc(p.id) + '">' + ballOptions + '</select></div>' +
      '<div class="exp-field"><label>工数感</label>' +
      '<select id="effort-' + esc(p.id) + '">' + effortOptions + '</select></div>' +
      '<div class="exp-field"><label>メモ</label>' +
      '<textarea id="memo-' + esc(p.id) + '">' + esc(p.memo || '') + '</textarea></div>' +
      '<div class="exp-btns">' +
        '<button class="btn-save" id="save-' + esc(p.id) + '" onclick="event.stopPropagation(); saveMeta(\'' + jsArg(p.id) + '\')">保存</button>' +
        '<button class="btn-cancel" onclick="event.stopPropagation(); toggleMetaEdit(\'' + jsArg(p.id) + '\')">閉じる</button>' +
      '</div>' +
      (p.manual_ops ? '<div class="exp-meta">🔁 手動運用: ' + esc(p.manual_ops) + '</div>' : '') +
      '<div class="exp-meta">原本: ' + esc(p.path || '') + '</div>' +
    '</div>';
  }

  function buildCollapseSection(list) {
    const wrap = document.createElement('div');
    wrap.className = 'collapse-section';
    wrap.onclick = function () { wrap.classList.toggle('open'); };
    const bodyDense = list.length <= 8 ? ' dense' : '';
    wrap.innerHTML =
      '<div class="head"><span>✅ 運用中（' + list.length + '件）</span><span class="arrow">▶</span></div>' +
      '<div class="body' + bodyDense + '"></div>';
    const body = wrap.querySelector('.body');
    sortList(list).forEach(p => body.appendChild(buildCard(p)));
    return wrap;
  }

  // ============================================================
  // ドラッグ並び替え（PCのみ・Pointer Eventsによる自前実装）
  // 標準HTML5 Drag&Dropは「ハンドル以外から開始したらキャンセル」という
  // 作りが不安定（掴んでも即座にキャンセルされグー→パーに戻る不具合があった）
  // ため廃止し、pointerdown/pointermove/pointerupで自前に並び替える。
  // ============================================================
  function attachDragHandlers(cardEl) {
    const handle = cardEl.querySelector('.drag-handle');
    if (!handle) return;

    handle.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const container = cardEl.parentElement;
      dragState = { pointerId: e.pointerId, card: cardEl, container: container };
      handle.setPointerCapture(e.pointerId);
      cardEl.classList.add('dragging');
      document.body.classList.add('dnd-active');
    });

    handle.addEventListener('pointermove', function (e) {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      const target = findDropTarget(dragState.container, dragState.card, e.clientX, e.clientY);
      showDropIndicator(dragState.container, target);
    });

    handle.addEventListener('pointerup', function (e) {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      finishDrag();
    });

    handle.addEventListener('pointercancel', function (e) {
      if (!dragState || dragState.pointerId !== e.pointerId) return;
      cancelDrag();
    });
  }

  // 最も近いカードを探し、そのカードの前/後どちらに挿入するかを判定する
  // （CSSグリッドで複数列になっている場合も、同じ行かどうかをY座標で見て
  //   同じ行ならX座標、違う行ならY座標で前後を決める）
  function findDropTarget(container, excludeEl, x, y) {
    const cards = Array.from(container.querySelectorAll(':scope > .pcard')).filter(c => c !== excludeEl);
    if (!cards.length) return null;

    let nearest = null, nearestDist = Infinity;
    cards.forEach(c => {
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < nearestDist) { nearestDist = d; nearest = c; }
    });

    const r = nearest.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const sameRow = Math.abs(y - cy) < r.height / 2;
    const before = sameRow ? (x < cx) : (y < cy);
    return { anchor: nearest, before: before };
  }

  function showDropIndicator(container, target) {
    clearDropIndicator();
    if (!target) return;
    const indicator = document.createElement('div');
    indicator.className = 'drop-indicator';
    if (target.before) {
      container.insertBefore(indicator, target.anchor);
    } else {
      container.insertBefore(indicator, target.anchor.nextSibling);
    }
  }

  function clearDropIndicator() {
    document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
  }

  function finishDrag() {
    const { card, container } = dragState;
    const indicator = container.querySelector('.drop-indicator');
    if (indicator) {
      container.insertBefore(card, indicator);
    }
    clearDropIndicator();
    card.classList.remove('dragging');
    document.body.classList.remove('dnd-active');
    dragState = null;
    persistOrder(container);
  }

  function cancelDrag() {
    if (!dragState) return;
    dragState.card.classList.remove('dragging');
    document.body.classList.remove('dnd-active');
    clearDropIndicator();
    dragState = null;
  }

  function persistOrder(container) {
    const ids = Array.from(container.children)
      .filter(el => el.classList.contains('pcard'))
      .map(el => el.dataset.id);
    if (ids.length < 2) return;

    const n = ids.length;
    const updates = ids.map((id, idx) => ({ id: id, priority: n - idx }));
    updates.forEach(u => {
      const p = allProjects.find(x => x.id === u.id);
      if (p) p.priority = u.priority;
    });
    render(); // ドラッグ結果どおりの順序で即座に確定表示する

    if (USE_MOCK) { showToast('並び替えました（モック）'); return; }

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'reorderPriorities', session_token: session.token, updates: updates })
    })
    .then(r => r.json())
    .then(res => {
      if (!res.success) throw new Error(res.message || res.error || '保存失敗');
      showToast('並び替えを保存しました');
    })
    .catch(err => {
      showToast('並び替えの保存に失敗しました: ' + err.message, true);
    });
  }

  // ============================================================
  // 「読む」（全文表示）と「編集する」（⚙パネル）の切り替え
  // ============================================================
  function toggleTextExpand(id) {
    if (textExpandedIds.has(id)) textExpandedIds.delete(id); else textExpandedIds.add(id);
    render();
  }

  function toggleMetaEdit(id) {
    metaEditId = (metaEditId === id) ? null : id;
    render();
    if (metaEditId) {
      const el = document.getElementById('pcard-' + metaEditId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function jumpTo(id) {
    // 関連先が現在のフィルタで非表示の場合は「すべて」タブに切り替えてから探す
    let el = document.getElementById('pcard-' + id);
    if (!el) {
      currentCat = '';
      document.querySelectorAll('#chip-row .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === ''));
      switchTab('all'); // チップ行の出し分けごと切り替える（render も中で走る）
      el = document.getElementById('pcard-' + id);
    }
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('highlight');
      setTimeout(() => el.classList.remove('highlight'), 1400);
    }
  }

  // ============================================================
  // メタ更新（priority / manual_ball / effort / memo のみ）
  // ============================================================
  function saveMeta(id) {
    const btn = document.getElementById('save-' + id);
    const priorityRaw = document.getElementById('pri-' + id).value;
    const manualBall  = document.getElementById('ball-' + id).value;
    const effortVal    = document.getElementById('effort-' + id).value;
    const memo         = document.getElementById('memo-' + id).value;

    btn.disabled = true;
    btn.textContent = '保存中...';

    if (USE_MOCK) {
      // モック時はローカル state のみ更新（GAS接続なし）
      const p = allProjects.find(x => x.id === id);
      p.priority = priorityRaw === '' ? null : Number(priorityRaw);
      p.manual_ball = manualBall;
      p.effort = effortVal;
      p.memo = memo;
      btn.disabled = false;
      btn.textContent = '保存';
      showToast('保存しました（モック）');
      render();
      return;
    }

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateMeta',
        session_token: session.token,
        id: id,
        priority: priorityRaw === '' ? '' : Number(priorityRaw),
        manual_ball: manualBall,
        effort: effortVal,
        memo: memo
      })
    })
    .then(r => r.json())
    .then(res => {
      if (!res.success) throw new Error(res.message || res.error || '保存失敗');
      const p = allProjects.find(x => x.id === id);
      if (p) { p.priority = priorityRaw === '' ? null : Number(priorityRaw); p.manual_ball = manualBall; p.effort = effortVal; p.memo = memo; }
      showToast('保存しました');
      render();
    })
    .catch(err => {
      showToast('保存に失敗しました: ' + err.message, true);
    });
  }

  // ============================================================
  // 資産のメタ更新（disposition / memo のみ）
  // ============================================================
  function saveAssetMeta(id) {
    const btn = document.getElementById('save-' + id);
    const disposition = document.getElementById('disp-' + id).value;
    const memo        = document.getElementById('memo-' + id).value;

    btn.disabled = true;
    btn.textContent = '保存中...';

    const applyLocal = () => {
      const a = allAssets.find(x => x.id === id);
      if (a) { a.disposition = disposition; a.memo = memo; }
    };

    if (USE_MOCK) {
      applyLocal();
      btn.disabled = false;
      btn.textContent = '保存';
      showToast('保存しました（モック）');
      render();
      return;
    }

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateMeta',
        target: 'asset',        // これが無いと projects シート側を探しに行く
        session_token: session.token,
        id: id,
        disposition: disposition,
        memo: memo
      })
    })
    .then(r => r.json())
    .then(res => {
      if (!res.success) throw new Error(res.message || res.error || '保存失敗');
      applyLocal();
      showToast('保存しました');
      render();
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = '保存';
      showToast('保存に失敗しました: ' + err.message, true);
    });
  }

  // ============================================================
  // 自動ジョブのメタ更新（disposition / memo のみ）
  // ============================================================
  function saveJobMeta(id) {
    const btn = document.getElementById('save-' + id);
    const disposition = document.getElementById('disp-' + id).value;
    const memo        = document.getElementById('memo-' + id).value;

    btn.disabled = true;
    btn.textContent = '保存中...';

    const applyLocal = () => {
      const j = allJobs.find(x => x.id === id);
      if (j) { j.disposition = disposition; j.memo = memo; }
    };

    if (USE_MOCK) {
      applyLocal();
      btn.disabled = false;
      btn.textContent = '保存';
      showToast('保存しました（モック）');
      render();
      return;
    }

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateMeta',
        target: 'job',        // これが無いと projects シート側を探しに行く
        session_token: session.token,
        id: id,
        disposition: disposition,
        memo: memo
      })
    })
    .then(r => r.json())
    .then(res => {
      if (!res.success) throw new Error(res.message || res.error || '保存失敗');
      applyLocal();
      showToast('保存しました');
      render();
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = '保存';
      showToast('保存に失敗しました: ' + err.message, true);
    });
  }

  // ============================================================
  // ユーティリティ
  // ============================================================
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // HTMLのonclick属性内に埋め込む単一引用符JS文字列用。
  // HTML表示用esc()とは用途が異なるため、バックスラッシュと改行も無害化する。
  function jsArg(str) {
    return String(str == null ? '' : str)
      .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
      .replace(/\r/g, '\\r').replace(/\n/g, '\\n')
      .replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const pad = n => String(n).padStart(2, '0');
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }
</script>
