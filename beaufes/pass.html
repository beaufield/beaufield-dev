<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビューフェス2026 入場パス</title>
<style>
  :root {
    --main: #5BC8E8;
    --main-dark: #2fa8cc;
    --text: #333;
    --bg: #f7fafc;
    --border: #e0e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--main), var(--main-dark));
    color: #fff;
    padding: 22px 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 420px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    text-align: center;
  }
  .newBadge {
    background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px;
  }
  .name { font-size: 20px; font-weight: bold; margin: 4px 0; min-height: 24px; }
  .salon { font-size: 14px; color: #666; margin-bottom: 18px; min-height: 20px; }
  .placeholder { color: #bbb; font-weight: normal; font-size: 14px; }
  #qrBox { margin: 12px 0; }
  #qrBox svg { width: 220px; height: 220px; }
  .event-info { font-size: 13px; color: #555; line-height: 1.9; text-align: left; margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 14px; }
  .event-info b { color: var(--main-dark); }
  .checkedIn {
    margin-top: 14px; background: #eff6ff; color: #1d4ed8;
    border: 1px solid #bfdbfe; border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  /* 通信に失敗したがQRは出せている状態の注意書き（パス自体は使える） */
  .warnBox {
    display: none;
    margin-top: 16px; background: #fffbeb; color: #92400e;
    border: 1px solid #fde68a; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.7;
  }
  .reloadBtn {
    display: inline-block; margin-top: 10px; padding: 10px 18px;
    font-size: 14px; font-weight: bold; color: #fff; background: var(--main-dark);
    border: none; border-radius: 8px; cursor: pointer;
  }
  .fallback { font-size: 12px; color: #888; margin-top: 20px; line-height: 1.7; }
  .errorCard { text-align: center; padding: 36px 20px; color: #666; line-height: 1.9; }
  .errorCard a { color: var(--main-dark); }
  .stale { font-size: 12px; color: #999; margin-top: 10px; }

  /* 🆕 L1-e: お申し込み内容の変更UI（トークンURLを知っている本人のみ・§2-2） */
  .editToggleLine { text-align: center; margin-top: 16px; font-size: 13px; }
  .editToggleLine a { color: var(--main-dark); }
  .formCard { text-align: left; }
  .formCard .panelTitle { font-size: 16px; font-weight: bold; margin: 0 0 14px; }
  .formCard label { display: block; font-weight: bold; font-size: 14px; margin: 16px 0 6px; }
  .formCard label .req { color: #dc2626; font-size: 12px; margin-left: 4px; }
  .formCard input[type=text], .formCard input[type=email], .formCard input[type=tel],
  .formCard select, .formCard textarea {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  .formCard textarea { resize: vertical; min-height: 60px; }
  .formCard .radio-group { display: flex; gap: 16px; margin-top: 6px; }
  .formCard .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; margin: 0; }
  #e_newFields { display: none; margin-top: 6px; }
  .formCard .errorMsg {
    display: none;
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.7;
  }
  .formCard .okMsg {
    background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
    border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.7; text-align: center;
  }
  .formCard .btn {
    width: 100%; padding: 13px; margin-top: 14px;
    font-size: 15px; font-weight: bold; border-radius: 9px; cursor: pointer;
    border: none; color: #fff; background: var(--main-dark);
  }
  .formCard .btn:disabled { opacity: .5; }
  .formCard .btnQuiet {
    background: #fff; color: #888; border: 1px solid var(--border); font-weight: normal;
  }
</style>
</head>
<body>

<header><h1>ビューフェス2026 入場パス</h1></header>

<main>
  <!-- QRは通信を待たずに即描画するため、最初から表示しておく（#loadingは廃止） -->
  <div class="card" id="passCard" style="display:none;">
    <div class="newBadge" id="newBadge" style="display:none;">お申し込みが完了しました</div>
    <div class="salon" id="salonName"></div>
    <div class="name" id="staffName"><span class="placeholder">確認中…</span></div>

    <div id="qrBox"></div>

    <div id="checkedInBox"></div>

    <div class="event-info" id="eventInfo"></div>

    <div class="event-info" id="seminarInfo">
      <b>セミナー</b>：内容が決まり次第、この画面からご予約いただけます（現在準備中）
    </div>

    <div class="warnBox" id="warnBox">
      <div id="warnText"></div>
      <button class="reloadBtn" id="reloadBtn">もう一度読み込む</button>
    </div>

    <!-- 🆕 L1-e: 内容を取得できた場合のみ表示（プリフィルする値が無いと編集できないため） -->
    <div class="editToggleLine" id="editToggleLine" style="display:none;">
      <a href="#" id="editToggleLink">お申し込み内容を変更する</a>
    </div>
  </div>

  <!-- 🆕 L1-e: お申し込み内容の変更フォーム（§4 L1-e・updateApplicationのみを呼ぶ） -->
  <div class="card formCard" id="editPanel" style="display:none;">
    <p class="panelTitle">お申し込み内容の変更</p>
    <form id="editForm">
      <label>サロン様名<span class="req">必須</span></label>
      <input type="text" id="e_salon_name" required>

      <label>お名前（フルネーム）<span class="req">必須</span></label>
      <input type="text" id="e_staff_name" required>

      <label>メールアドレス<span class="req">必須</span></label>
      <input type="email" id="e_email" required>

      <label>お電話番号<span class="req">必須</span></label>
      <input type="tel" id="e_phone" required>

      <!-- 🔴 index.htmlと選択肢を1文字も違えないこと（LINEフォーム実物準拠） -->
      <label>業態<span class="req">必須</span></label>
      <select id="e_business_type" required>
        <option value="">選択してください</option>
        <option>美容室</option>
        <option>理容室</option>
        <option>エステサロン</option>
        <option>ネイルサロン</option>
        <option>アイサロン</option>
        <option>その他</option>
      </select>

      <label>ビューフィールドとお取引はありますか？<span class="req">必須</span></label>
      <div class="radio-group">
        <label><input type="radio" name="e_has_transaction" value="yes"> あり</label>
        <label><input type="radio" name="e_has_transaction" value="no"> なし（初めて）</label>
      </div>

      <!-- index.htmlと同じく「なし（初めて）」選択時のみ表示（新規客向け項目） -->
      <div id="e_newFields">
        <label>サロンのご住所</label>
        <input type="text" id="e_address">

        <label>ご紹介サロン名・お名前（あれば）</label>
        <input type="text" id="e_referrer">
      </div>

      <label>備考（あれば）</label>
      <textarea id="e_note"></textarea>

      <div class="errorMsg" id="editError"></div>

      <button type="submit" class="btn" id="editSaveBtn">この内容で保存する</button>
      <button type="button" class="btn btnQuiet" id="editCancelBtn">キャンセル</button>
    </form>

    <div id="editDone" style="display:none;">
      <div class="okMsg">保存しました。</div>
      <button type="button" class="btn btnQuiet" id="editCloseBtn">閉じる</button>
    </div>
  </div>

  <div class="card errorCard" id="errorCard" style="display:none;">
    <div id="errorText"></div>
  </div>

  <div class="fallback">
    ※このページをスマホのホーム画面に追加しておくと当日スムーズです
  </div>
  <p style="font-size:11px;color:#ccc;text-align:center;" id="versionLine"></p>
</main>

<script src="lib/qrcode.min.js"></script>
<script>
const APP_VERSION = '0.6.1';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyD21TC3rHv25Qeor5BCj7lB7qi0t3zTUmVFPWfv5ozGntKwQHMoSiGFpg26LRoepyF/exec';
document.getElementById('versionLine').textContent = 'v' + APP_VERSION;

// 通信の設定（GASの結果配信は逐次でも約7%失敗するため、リトライは必須。
// 失敗時は16〜47秒かかってから返ることがあるので、1回あたりの待ち時間も切る）
const FETCH_TIMEOUT_MS = 10000;
const MAX_ATTEMPTS     = 3;
const RETRY_WAIT_MS    = [800, 2000];

function qs(name) {
  return new URLSearchParams(location.search).get(name);
}
function el(id) {
  return document.getElementById(id);
}
function sleep(ms) {
  return new Promise(function (r) { setTimeout(r, ms); });
}

// ------------------------------------------------------------
// QRの描画 —— サーバーに一切問い合わせずに行う
// QRの中身は「このページ自身のURL（?t=<token>）」なので、tokenさえあれば描ける。
// 当日の入場口で最も重要なのはQRが出ること。ここを通信に依存させない。
//
// サーバーから正式なURL（config由来の公開URL）が取れた場合はそちらで描き直す。
// 内容が同じなら描き直さないので、通常は画面がちらつかない。
// ------------------------------------------------------------
let currentQrData = '';

function renderQr(passUrl) {
  if (!passUrl || currentQrData === passUrl) return;
  currentQrData = passUrl;
  const qr = qrcode(0, 'M');
  qr.addData(passUrl);
  qr.make();
  el('qrBox').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
}

// 通信なしで組み立てる、このページ自身のURL
function localPassUrl(token) {
  return location.origin + location.pathname + '?t=' + encodeURIComponent(token);
}

// ------------------------------------------------------------
// 表示用データの反映
// ------------------------------------------------------------
// 🆕 L1-e: 最後に反映した内容（編集フォームのプリフィルに使う）
let lastDetail = null;

function renderDetail(d) {
  lastDetail = d;

  el('salonName').textContent = d.salon_name || '';
  el('staffName').textContent = (d.staff_name || '') + ' 様';

  // サーバー（またはキャッシュ）が正式なパスURLを持っていればQRを更新する
  if (d.pass_url) renderQr(d.pass_url);

  if (d.event) {
    el('eventInfo').innerHTML =
      '<div><b>日時</b>：' + (d.event.date || '') + ' ' + (d.event.time || '') + '</div>' +
      '<div><b>会場</b>：' + (d.event.venue_name || '') + ' ' + (d.event.venue_addr || '') + '</div>';
  }

  if (d.checked_in_at) {
    el('checkedInBox').innerHTML =
      '<div class="checkedIn">✅ ' + d.checked_in_at + ' に入場済みです</div>';
  }

  // 🆕 内容を取得できてから「変更する」リンクを出す（プリフィルする値が無いと編集できないため）
  el('editToggleLine').style.display = 'block';
}

// ------------------------------------------------------------
// キャッシュ（一度表示できた内容は端末に残し、圏外・通信失敗でも出せるようにする）
// ------------------------------------------------------------
function cacheKey(token) { return 'beaufes_pass_' + token; }

function saveCache(token, d) {
  try { localStorage.setItem(cacheKey(token), JSON.stringify(d)); } catch (e) { /* 保存できなくても致命的ではない */ }
}
function loadCache(token) {
  try {
    const s = localStorage.getItem(cacheKey(token));
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}

// ------------------------------------------------------------
// GASからの取得（1回ぶん）
// GASは結果配信に失敗すると404のHTMLを返す。res.jsonだとSyntaxErrorになって
// 「通信エラー」に見えるため、必ずテキストで受けてから自前でJSON.parseし、
// 「一時的な配信失敗」と「本当にパスが無い」を区別できるようにする。
// ------------------------------------------------------------
async function fetchPassOnce(token) {
  const params = new URLSearchParams({
    action: 'getPass',
    data: JSON.stringify({ ticket_token: token })
  });

  const ctrl  = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS);

  try {
    const res = await fetch(GAS_URL + '?' + params, { redirect: 'follow', signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP_' + res.status);   // GASの配信失敗404はここに来る
    const text = await res.text();
    let json;
    try {
      json = JSON.parse(text);
    } catch (e) {
      throw new Error('NON_JSON');                        // 404のHTMLを掴んだ場合
    }
    return json;
  } finally {
    clearTimeout(timer);
  }
}

// リトライ付き取得。戻り値は { ok:true, data } / { ok:false, notFound:true } / { ok:false, transient:true }
async function fetchPassWithRetry(token) {
  let lastErr = null;

  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    if (attempt > 0) await sleep(RETRY_WAIT_MS[attempt - 1] || 2000);
    try {
      const json = await fetchPassOnce(token);
      if (json && json.success) return { ok: true, data: json.data };

      // サーバーが明確に「このtokenは無い」と答えた場合はリトライしても同じ
      const code = json && json.error ? String(json.error) : '';
      if (code === 'NOT_FOUND' || code === 'INVALID_TOKEN') return { ok: false, notFound: true };

      lastErr = code || 'UNKNOWN';   // INTERNAL_ERROR等は一時障害の可能性があるので再試行する
    } catch (e) {
      lastErr = e && e.message ? e.message : String(e);
    }
  }
  console.warn('getPass失敗（リトライ上限）:', lastErr);
  return { ok: false, transient: true };
}

// ------------------------------------------------------------
// 画面状態
// ------------------------------------------------------------
function showErrorCard(html) {
  el('passCard').style.display = 'none';
  el('errorCard').style.display = 'block';
  el('errorText').innerHTML = html;
}

function showWarn(text) {
  el('warnText').textContent = text;
  el('warnBox').style.display = 'block';
}

function showError(id, msg) {
  const e = el(id);
  e.innerHTML = msg;
  e.style.display = 'block';
}
function hideError(id) { el(id).style.display = 'none'; }

// ------------------------------------------------------------
// メイン
// ------------------------------------------------------------
async function init() {
  const token = qs('t');
  const isNew = qs('new') === '1';

  // tokenが無い＝リンクが壊れている。QRも出せないのでこの場合だけ最初からエラー表示
  if (!token) {
    showErrorCard(
      'このリンクからは入場パスを表示できませんでした。<br>' +
      'お申し込み時のメールに記載のリンクを、もう一度お開きください。<br><br>' +
      '<a href="index.html?resend=1">リンクが見つからない方はこちら（パスの再送）</a>'
    );
    return;
  }

  // 1) まずQRを出す（通信ゼロ・ここは絶対に失敗しない）
  el('passCard').style.display = 'block';
  if (isNew) el('newBadge').style.display = 'block';
  renderQr(localPassUrl(token));

  // 2) 前回表示できた内容があれば先に出しておく（圏外でも名前が出る）
  const cached = loadCache(token);
  if (cached) renderDetail(cached);

  // 3) 裏で最新を取りにいく
  const result = await fetchPassWithRetry(token);

  if (result.ok) {
    renderDetail(result.data);
    saveCache(token, result.data);
    el('warnBox').style.display = 'none';
    return;
  }

  if (result.notFound) {
    // サーバーが明確に否定した場合だけエラー画面にする
    showErrorCard(
      'このリンクからは入場パスを表示できませんでした。<br>' +
      'お申し込み時のメールに記載のリンクを、もう一度お開きください。<br><br>' +
      '<a href="index.html?resend=1">リンクが見つからない方はこちら（パスの再送）</a>'
    );
    return;
  }

  // 一時的な通信失敗。QRは有効なので消さず、再読み込みを促す
  if (cached) {
    showWarn('最新の情報を取得できませんでした。表示中のQRコードはそのままご利用いただけます。');
  } else {
    el('staffName').innerHTML = '<span class="placeholder">お名前を取得できませんでした</span>';
    showWarn('読み込みに失敗しました。お手数ですが「もう一度読み込む」を押してください。QRコードはこのままご利用いただけます。');
  }
}

el('reloadBtn').addEventListener('click', function () {
  location.reload();
});

// ------------------------------------------------------------
// 🆕 L1-e: お申し込み内容の変更（doPost: action=updateApplication）
// GASへのPOSTはindex.htmlと同じくリトライ付き（§2-6）。
// ------------------------------------------------------------
async function postOnce(params) {
  const ctrl  = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: new URLSearchParams(params),
      redirect: 'follow',
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('HTTP_' + res.status);
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('NON_JSON');
    }
  } finally {
    clearTimeout(timer);
  }
}

async function postWithRetry(params) {
  let lastErr = null;
  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    if (attempt > 0) await sleep(RETRY_WAIT_MS[attempt - 1] || 2000);
    try {
      return await postOnce(params);
    } catch (e) {
      lastErr = e && e.message ? e.message : String(e);
    }
  }
  throw new Error(lastErr || 'UNKNOWN');
}

// getPassが返した現在値をフォームに反映する
function populateEditForm(d) {
  el('e_salon_name').value    = d.salon_name || '';
  el('e_staff_name').value    = d.staff_name || '';
  el('e_email').value         = d.email || '';
  el('e_phone').value         = d.phone || '';
  el('e_business_type').value = d.business_type || '';
  el('e_address').value       = d.address || '';
  el('e_referrer').value      = d.referrer || '';
  el('e_note').value          = d.note || '';

  const hasTx = d.has_transaction || 'yes';
  document.querySelectorAll('input[name=e_has_transaction]').forEach(function (r) {
    r.checked = (r.value === hasTx);
  });
  // index.htmlと同じ表示制御。フォームを開いた時点の値を即座に反映する（changeイベント任せにしない）
  el('e_newFields').style.display = (hasTx === 'no') ? 'block' : 'none';
}

document.querySelectorAll('input[name=e_has_transaction]').forEach(function (r) {
  r.addEventListener('change', function () {
    el('e_newFields').style.display =
      document.querySelector('input[name=e_has_transaction]:checked').value === 'no' ? 'block' : 'none';
  });
});

el('editToggleLink').addEventListener('click', function (ev) {
  ev.preventDefault();
  if (!lastDetail) return; // プリフィルする値が無い＝表示できていない状態では開かせない
  populateEditForm(lastDetail);
  hideError('editError');
  el('editForm').style.display = 'block';
  el('editDone').style.display = 'none';
  el('editPanel').style.display = 'block';
  el('editPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

el('editCancelBtn').addEventListener('click', function () {
  el('editPanel').style.display = 'none';
});
el('editCloseBtn').addEventListener('click', function () {
  el('editPanel').style.display = 'none';
});

el('editForm').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  hideError('editError');

  const token = qs('t');
  const payload = {
    ticket_token:    token,
    salon_name:      el('e_salon_name').value.trim(),
    staff_name:      el('e_staff_name').value.trim(),
    email:           el('e_email').value.trim(),
    phone:           el('e_phone').value.trim(),
    business_type:   el('e_business_type').value,
    has_transaction: (document.querySelector('input[name=e_has_transaction]:checked') || {}).value || '',
    address:         el('e_address').value.trim(),
    referrer:        el('e_referrer').value.trim(),
    note:            el('e_note').value.trim()
  };

  el('editSaveBtn').disabled   = true;
  el('editCancelBtn').disabled = true;

  try {
    const json = await postWithRetry({ action: 'updateApplication', data: JSON.stringify(payload) });
    el('editSaveBtn').disabled   = false;
    el('editCancelBtn').disabled = false;

    if (!json.success) {
      showError('editError', json.error === 'NOT_FOUND'
        ? 'このリンクは無効です。お申し込み時のメールに記載のリンクをご確認ください。'
        : (json.error || '保存に失敗しました。時間をおいて再度お試しください。'));
      return;
    }

    // 表示・キャッシュを更新する。ticket_tokenは変わらないのでQRはそのまま。
    const updated = Object.assign({}, lastDetail, payload);
    renderDetail(updated);
    saveCache(token, updated);

    el('editForm').style.display = 'none';
    el('editDone').style.display = 'block';
  } catch (e) {
    el('editSaveBtn').disabled   = false;
    el('editCancelBtn').disabled = false;
    showError('editError', '保存結果を確認できませんでした。お手数ですが、もう一度お試しください。');
  }
});

init();
</script>

</body>
</html>
