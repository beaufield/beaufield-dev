<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信方式の比較（試験）</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; color: #0f172a; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .note { color: #64748b; font-size: 12px; margin-bottom: 12px; }
  #st { font-weight: bold; margin: 10px 0; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 8px; border: none; background: #10617c; color: #fff; }
  #relayHost iframe { position: absolute; width: 1px; height: 1px; opacity: 0; border: 0; left: -10px; top: -10px; }
</style>
</head>
<body>
<h1>通信方式の比較（試験ページ）</h1>
<div class="note">社内アプリの通信方式を比べるための試験です。業務データや個人情報は扱いません。終わるまで画面を開いたままにしてください（約6分）。</div>
<button id="startBtn" type="button">開始</button>
<div id="st">待機中</div>
<pre id="out"></pre>
<div id="relayHost"></div>
<script>
// A: いまの方式（このページから fetch で /exec）
// C: 案0'（透明iframeの GAS ページ経由で google.script.run）
const qs = new URLSearchParams(location.search);
const EXEC = qs.get('gas') || '';
const LABEL = (qs.get('label') || 'unknown').slice(0, 20);
const N = Math.max(1, Math.min(40, Number(qs.get('n') || 20)));
const LOADS = Math.max(1, Math.min(10, Number(qs.get('loads') || 5)));
const GAP = Math.max(2000, Math.min(20000, Number(qs.get('gap') || 4000)));
const LIMIT = 90000;
const st = document.getElementById('st'), out = document.getElementById('out');
const rows = [], loads = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const T0 = Date.now();
const tag = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(EXEC)) {
  st.textContent = 'URLに試験用GASの指定（gas=）がありません';
  document.getElementById('startBtn').disabled = true;
}

// ---- 中継（透明iframe）----
let port = null, seq = 0;
const pending = new Map();
function loadRelay() {
  return new Promise(resolve => {
    const host = document.getElementById('relayHost');
    host.replaceChildren();
    port = null;
    const t = performance.now();
    let done = false;
    const onMsg = ev => {
      if (ev.origin.indexOf('googleusercontent.com') < 0 || !ev.data || ev.data.type !== 'gas-relay-ready' || !ev.ports[0]) return;
      window.removeEventListener('message', onMsg);
      port = ev.ports[0];
      port.onmessage = e => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); p(e.data); } };
      done = true; resolve({ ok: true, ms: Math.round(performance.now() - t) });
    };
    window.addEventListener('message', onMsg);
    setTimeout(() => { if (!done) { window.removeEventListener('message', onMsg); resolve({ ok: false, ms: LIMIT }); } }, 60000);
    const f = document.createElement('iframe');
    f.src = EXEC + '?mode=relay&origin=' + encodeURIComponent(location.origin) + '&_=' + Date.now();
    f.title = 'relay';
    host.appendChild(f);
  });
}
function relayCall(fn, args) {
  return new Promise(resolve => {
    if (!port) { resolve({ ok: false, error: 'NO_RELAY' }); return; }
    const id = ++seq;
    const timer = setTimeout(() => { pending.delete(id); resolve({ ok: false, error: 'TIMEOUT' }); }, LIMIT);
    pending.set(id, r => { clearTimeout(timer); resolve(r); });
    port.postMessage({ type: 'call', id: id, fn: fn, args: args });
  });
}

// ---- 各方式 ----
async function armA() {
  const tg = tag(), t = performance.now(), ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LIMIT);
  try {
    const res = await fetch(EXEC, { method: 'POST', body: new URLSearchParams({ tag: tg }), redirect: 'follow', signal: ctrl.signal });
    const txt = await res.text(); let j = null; try { j = JSON.parse(txt); } catch (e) {}
    const ms = Math.round(performance.now() - t);
    if (!res.ok) return ['A', ms, 'HTTP_' + res.status];
    if (!j) return ['A', ms, 'NON_JSON'];
    return ['A', ms, j.ok && j.echo === tg ? 'OK' : String(j.error || 'MISMATCH')];
  } catch (e) {
    return ['A', Math.round(performance.now() - t), e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK'];
  } finally { clearTimeout(timer); }
}
async function armC() {
  const tg = tag(), t = performance.now();
  const r = await relayCall('rpcPing', [tg]);
  const ms = Math.round(performance.now() - t);
  if (!r.ok) return ['C', ms, String(r.error).slice(0, 40)];
  let j = null; try { j = JSON.parse(r.result); } catch (e) {}
  return ['C', ms, j && j.ok && j.echo === tg ? 'OK' : 'MISMATCH'];
}

function summary() {
  const line = k => {
    const xs = rows.filter(r => r[1] === k), ok = xs.filter(r => r[3] === 'OK').map(r => r[2]).sort((a, b) => a - b);
    const med = ok.length ? ok[Math.floor(ok.length / 2)] : '-', mx = ok.length ? ok[ok.length - 1] : '-';
    return (k === 'A' ? 'A いまの方式   ' : "C 案0'(中継)   ") + xs.length + '回 失敗' + (xs.length - ok.length) + ' 中央値' + med + 'ms 最大' + mx + 'ms';
  };
  const lok = loads.filter(l => l.ok).map(l => l.ms);
  out.textContent = '端末: ' + LABEL + '\n' +
    '中継の読み込み: ' + loads.length + '回 失敗' + (loads.length - lok.length) + ' 時間 ' + lok.join(', ') + 'ms\n' +
    line('A') + '\n' + line('C') + '\n\n' + rows.map(r => r.join(' ')).join('\n');
}

async function main() {
  document.getElementById('startBtn').disabled = true;
  const started = new Date().toISOString();
  for (let i = 0; i < LOADS; i++) {
    st.textContent = '中継の読み込み ' + (i + 1) + '/' + LOADS;
    loads.push(await loadRelay());
    summary();
    await sleep(1500);
  }
  if (!port) { st.textContent = '中継を読み込めませんでした（Cは測れません）'; }
  for (let i = 0; i < N; i++) {
    const order = (i % 2 === 0) ? [armA, armC] : [armC, armA];
    for (const f of order) {
      const off = Math.round((Date.now() - T0) / 1000);
      rows.push([off].concat(await f()));
      st.textContent = '比較 ' + (i + 1) + '/' + N; summary();
      await sleep(GAP);
    }
  }
  st.textContent = '結果を保存しています…';
  const payload = JSON.stringify({ started: started, kind: 'relay', label: LABEL, ua: navigator.userAgent.slice(0, 120), loads: loads, rows: rows });
  let saved = false;
  if (port) { const r = await relayCall('saveRun', [payload]); saved = r.ok; }
  for (let k = 0; !saved && k < 3; k++) {
    try {
      const res = await fetch(EXEC, { method: 'POST', body: new URLSearchParams({ save: payload }) });
      const j = JSON.parse(await res.text()); saved = !!j.ok;
    } catch (e) {}
    if (!saved) await sleep(3000);
  }
  st.textContent = saved ? '完了しました（結果を保存済み）。この画面を閉じて大丈夫です。' : '完了しましたが保存に失敗しました。この画面のスクリーンショットを送ってください。';
}
document.getElementById('startBtn').addEventListener('click', main);
if (qs.get('auto') === '1' && EXEC) main();
</script>
</body>
</html>
