<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ビューフェス ポータルログイン</title><script src="candidate-config.js?b=3debf1542ecb"></script><script src="ui-bootstrap.js?b=40aeb3ead80d"></script></head>
<body style="font:16px/1.8 sans-serif;background:#f4f7f8;color:#173543;padding:24px"><main style="max-width:560px;margin:35px auto;background:white;padding:28px;border-radius:18px"><h1 style="font-size:25px">ビューフェス 社員ログイン</h1><p>いつものアプリポータルでログインしてから、受付・管理画面を開きます。新しい社員アカウントは不要です。</p><p>接続先が未設定の候補では、受付データを保存できません。</p><button id="login" style="padding:12px 24px;font:inherit">ポータルへ移動する</button><p id="message" role="status"></p><p><a href="scan.html">受付候補へ</a> ／ <a href="admin.html">管理候補へ</a></p><small id="version"></small></main>
<script>
// 日本語コメント: ポータルのPINやセッションをこの画面へ入力・コピーさせない。
const APP_VERSION = '0.2.2';document.getElementById('version').textContent='v'+APP_VERSION;
document.getElementById('login').addEventListener('click',async()=>{try{await BFEventCandidate.ready;await BFEventCandidate.signIn();}catch(e){document.getElementById('message').textContent=e.message;}});
</script></body></html>
