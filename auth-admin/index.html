<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>権限管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    background: #1a237e;
    color: #fff;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: bold; }
  header .fetched-at { font-size: 11px; opacity: 0.85; }
  header .version { font-size: 11px; opacity: 0.7; margin-left: auto; }
  header button {
    background: rgba(255,255,255,0.18); border: none; color: #fff;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header button:active { background: rgba(255,255,255,0.32); }

  .legend {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 8px 12px;
    font-size: 11px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    color: #555;
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 4px; }
  .legend .swatch {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 4px; font-size: 10px; font-weight: bold;
  }
  .swatch.none  { background: #eee; color: #999; }
  .swatch.on    { background: #1976d2; color: #fff; }
  .swatch.legacy{ background: #fbc02d; color: #333; }

  .toolbar {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    flex-wrap: wrap;
  }
  .toolbar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }

  .warnings {
    background: #fff8e1;
    border-bottom: 1px solid #ffe082;
    padding: 8px 12px;
    font-size: 11px;
    color: #7a5c00;
    display: none;
  }
  .warnings.visible { display: block; }
  .warnings .w-line { margin: 2px 0; }

  main {
    flex: 1;
    overflow: auto;
    padding-bottom: 72px; /* 保存バーの高さぶん */
  }

  .matrix-wrap { overflow: auto; max-width: 100%; }
  table.matrix { border-collapse: collapse; font-size: 12px; }

  table.matrix th, table.matrix td {
    border: 1px solid #e0e0e0;
    text-align: center;
    white-space: nowrap;
  }

  /* 1列目（アプリ名）: sticky */
  table.matrix th.app-col, table.matrix td.app-col {
    position: sticky;
    left: 0;
    z-index: 2;
    background: #fafafa;
    text-align: left;
    padding: 6px 10px;
    min-width: 150px;
    max-width: 220px;
    white-space: normal;
  }
  table.matrix td.app-col.hidden-app { color: #999; }
  table.matrix td.app-col .app-note { display: block; font-size: 10px; color: #999; }

  /* ヘッダー行: sticky */
  table.matrix thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: #eef1fb;
    padding: 6px 4px;
    font-weight: bold;
    writing-mode: horizontal-tb;
  }
  table.matrix thead th.app-col { z-index: 4; left: 0; }
  table.matrix thead th.retired { color: #999; }

  table.matrix td.cell {
    width: 46px;
    min-width: 46px;
    height: 42px;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
    font-size: 13px;
  }
  table.matrix td.cell.retired-col { background: #f0f0f0; opacity: 0.55; }
  table.matrix td.cell .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 6px;
  }
  .mark.none   { background: transparent; color: #ccc; }
  .mark.on     { background: #1976d2; color: #fff; }
  .mark.legacy { background: #fbc02d; color: #333; font-size: 10px; }
  td.cell.changed { background: #fff9c4; position: relative; }
  td.cell.changed::before {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 0; height: 0;
    border-style: solid;
    border-width: 6px 6px 0 0;
    border-color: #f57f17 transparent transparent transparent;
  }

  .save-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid #ccc;
    padding: 10px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    z-index: 10;
  }
  .save-bar.visible { display: flex; }
  .save-bar .count { font-size: 13px; font-weight: bold; }
  .save-bar .btns { display: flex; gap: 8px; }
  .save-bar button {
    padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-cancel { background: #eee; color: #333; }
  .btn-save   { background: #1976d2; color: #fff; }
  .btn-save:disabled { opacity: 0.5; }

  .footer-note {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #263238;
    color: #cfd8dc;
    font-size: 10px;
    padding: 4px 10px;
    text-align: center;
    z-index: 9;
  }
  .save-bar.visible ~ .footer-note { display: none; }

  .loading, .error-box {
    padding: 40px 20px;
    text-align: center;
    color: #666;
    font-size: 13px;
  }
  .error-box { color: #c62828; white-space: pre-wrap; }

  /* ── 保存確認ダイアログ ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; max-width: 480px; width: 100%;
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal h2 { font-size: 15px; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .modal .modal-body { padding: 10px 16px; overflow: auto; font-size: 12px; }
  .modal .diff-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #eee; }
  .modal .diff-row .who { color: #555; }
  .modal .diff-row .change { font-weight: bold; }
  .modal .modal-footer { padding: 12px 16px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
  .modal .conflict-line { color: #c62828; }
  .modal .result-line { padding: 4px 0; }

  /* 操作対象が権限か並び順かを常に分かるようにする。 */
  button { font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid #e59717; outline-offset: 2px; }
  .toolbar button, .order-controls button { border: 1px solid #c7ceda; border-radius: 6px; padding: 9px 12px; background: #fff; color: #1a237e; }
  .toolbar .mode { font-weight: bold; color: #1a237e; }
  .notice { padding: 10px 14px; background: #edf5ff; border-bottom: 1px solid #bfd5ef; font-size: 12px; color: #254768; }
  .notice:empty { display: none; }
  .order-mode .cell { opacity: .45; }
  .order-controls { display: flex; gap: 5px; margin-top: 7px; }
  .order-controls button { min-width: 44px; min-height: 44px; font-size: 16px; }
  table.matrix td.cell { min-width: 56px; height: 52px; padding: 3px; cursor: default; }
  .role-button { width: 100%; min-width: 46px; min-height: 44px; border: 0; background: transparent; border-radius: 6px; color: inherit; }
  table.matrix td.cell .mark { width: auto; min-width: 38px; padding: 0 4px; font-size: 11px; }
  table.matrix td.app-col .role-note { display: block; font-size: 10px; line-height: 1.5; color: #596879; margin-top: 4px; }
  table.matrix td.app-col { min-width: 190px; }
  .status-line { min-height: 20px; font-size: 12px; color: #a33124; }
  .modal { max-width: 600px; }
  .modal-footer button { padding: 10px 14px; border: none; border-radius: 6px; min-height: 44px; }
  .order-list { margin: 8px 0 8px 22px; line-height: 1.9; }
  .order-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .preview-banner { padding: 10px 14px; background: #e4f3e8; color: #175f32; font-size: 13px; font-weight: bold; }
  @media (max-width: 600px) {
    header h1 { font-size: 18px; }
    header .version { margin-left: 0; }
    table.matrix td.app-col, table.matrix th.app-col { min-width: 155px; max-width: 175px; }
    .toolbar { gap: 8px; }
    .order-compare { grid-template-columns: 1fr; }
    .save-bar { padding: 10px; }
  }

  /* 利用/管理は凡例とセルで同じ色を使う。文字ラベルも残す。 */
  :root { --role-user-color: #1565c0; --role-admin-color: #7b1fa2; }
  .mark.user, .swatch.user { background: var(--role-user-color); color: #fff; }
  .mark.admin, .swatch.admin { background: var(--role-admin-color); color: #fff; }
  .legend .swatch.user, .legend .swatch.admin { width: auto; min-width: 32px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <h1>🔐 権限管理</h1>
  <span class="fetched-at" id="fetchedAt"></span>
  <button id="reloadButton" onclick="reload()">再読込</button>
  <span class="version" id="versionLine"></span>
</header>
<div class="legend" id="legend"></div>
<div class="toolbar">
  <span class="mode" id="modeLabel">権限の編集</span>
  <label><input type="checkbox" id="showRetired" onchange="render()"> 退職者も表示</label>
  <button id="orderModeButton" onclick="startOrderMode()">並び順を変更</button>
  <span id="statusLine" class="status-line" role="status" aria-live="polite"></span>
</div>
<div class="notice" id="notice"></div>
<div class="warnings" id="warnings" role="status"></div>
<main><div id="content" class="loading">読み込み中...</div></main>
<div class="save-bar" id="saveBar">
  <span class="count" id="saveCount"></span>
  <div class="btns">
    <button class="btn-cancel" id="cancelButton" onclick="cancelChanges()">取消</button>
    <button class="btn-save" id="btnSave" onclick="openSaveDialog()">保存</button>
  </div>
</div>
<div class="footer-note">権限が反映されるまでの時間はアプリにより異なります。並び順はポータルで約1分後に再読込して確認してください。</div>
<div class="modal-backdrop" id="saveModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="saveModalTitle">
    <h2 id="saveModalTitle">変更内容</h2>
    <div class="modal-body" id="saveModalBody"></div>
    <div class="modal-footer" id="saveModalFooter"></div>
  </div>
</div>

<script>
  const GAS_URL     = 'https://script.google.com/macros/s/AKfycbwqJC73zLlmofD0uflPEjnYqFjzw8XopAzfRp5SbsdV36ckiQAyziBTmNl5vg2f6x5m/exec';
  const PORTAL_URL = 'https://beaufield.github.io/beaufield-dev/';
  const APP_VERSION = 'v1.2.2';
  const SESSION_KEY = 'bf_session';
  let session = null, matrix = null, dirty = Object.create(null), saving = false;
  let orderMode = false, draftOrder = [], pendingRequest = null, loading = false, reconciling = false;
  const $ = id => document.getElementById(id);
  const baseOrder = () => matrix ? matrix.apps.map(a => a.row_key) : [];
  const orderDirty = () => orderMode && JSON.stringify(draftOrder) !== JSON.stringify(baseOrder());
  const hasChanges = () => Object.keys(dirty).length > 0 || orderDirty();

  window.onload = function () {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (_) {}
    if (!session || !session.token || !session.expires || Date.now() > session.expires) { location.href = PORTAL_URL; return; }
    $('versionLine').textContent = APP_VERSION;
    window.addEventListener('beforeunload', e => { if (hasChanges() || pendingRequest) { e.preventDefault(); e.returnValue = ''; } });
    loadMatrix();
  };

  function message(text) { $('statusLine').textContent = text; }
  function reload() {
    if (saving || loading) return;
    if ((hasChanges() || pendingRequest) && !confirm('未保存の編集を取り消し、最新の状態を読み込みますか？')) return;
    loadMatrix();
  }
  async function loadMatrix() {
    if (loading || saving) return;
    loading = true; syncControls();
    $('content').className = 'loading'; $('content').textContent = '読み込み中...';
    try {
      const res = await gasPost('getMatrix', {});
      if (!res.success) throw new Error(errorText(res));
      if (!Array.isArray(res.apps) || !Array.isArray(res.users) || !res.order_revision) throw new Error('新しいサーバーへの反映を確認してください。');
      matrix = res; dirty = Object.create(null); orderMode = false; draftOrder = baseOrder(); pendingRequest = null; reconciling = false;
      $('saveModal').className = 'modal-backdrop';
      $('fetchedAt').textContent = '取得: ' + new Date(res.fetched_at).toLocaleString('ja-JP');
      loading = false;
      renderLegend(); renderWarnings(); message(''); render();
    } catch (e) {
      $('content').className = 'error-box'; $('content').textContent = '読み込みに失敗しました。\n' + e.message;
      // 照合に失敗しても保存内容を再編集しない。再読込が成功するまで下書きを保持。
      message('再読込してください。下書きは保持されています。');
    } finally { loading = false; syncControls(); }
  }

  function renderLegend() {
    $('legend').innerHTML = '<span class="chip">− なし</span><span class="chip"><span class="swatch user">利用</span> user</span>' +
      '<span class="chip"><span class="swatch admin">管理</span> admin</span><span class="chip">役割の意味は各アプリ名の下に表示</span>';
  }
  function renderWarnings() {
    const lines = [];
    (matrix.configuration_errors || []).forEach(e => lines.push('設定を確認してください: ' + e));
    (matrix.out_of_vocab || []).forEach(r => {
      const app = matrix.apps.find(a => a.app_name === r.app_name);
      lines.push((app ? app.label : r.app_name) + 'に選択肢外の権限「' + r.role + '」があります。現在の割当は保持しています。選択肢の設定を確認してください。');
    });
    if ((matrix.legacy_roles || []).length) lines.push('標準以外の権限があります。自動変換せず、対象の役割を確認してください。');
    (matrix.duplicate_rows || []).forEach(r => lines.push('権限行が重複しています: ' + r.user_id + ' / ' + r.app_name + '。この組の変更は保存できません。'));
    if ((matrix.orphan_apps || []).length) lines.push('未登録のアプリへの割当があります: ' + matrix.orphan_apps.join(', '));
    if ((matrix.orphan_users || []).length) lines.push('存在しない社員への割当があります: ' + matrix.orphan_users.join(', '));
    $('warnings').innerHTML = lines.map(l => '<div class="w-line">⚠ ' + escapeHtml(l) + '</div>').join('');
    $('warnings').className = lines.length ? 'warnings visible' : 'warnings';
  }
  function roleText(role, app) {
    if (!role || role === 'none') return 'なし';
    const base = role === 'user' ? '利用' : role === 'admin' ? '管理' : '設定外: ' + role;
    const label = app && app.role_labels && app.role_labels[role];
    return label ? base + '（' + label + '）' : base;
  }
  function cellKey(userId, appName) { return userId + '/' + appName; }
  function blocked(user, app) {
    return user.duplicate || (app.config_errors || []).length > 0 ||
      (matrix.duplicate_rows || []).some(r => r.user_id === user.user_id && r.app_name === app.app_name);
  }
  function render() {
    if (!matrix) return;
    const users = matrix.users.filter(u => $('showRetired').checked || u.active);
    const apps = orderMode ? draftOrder.map(id => matrix.apps.find(a => a.row_key === id)) : matrix.apps;
    let html = '<div class="matrix-wrap' + (orderMode ? ' order-mode' : '') + '"><table class="matrix"><thead><tr><th class="app-col">アプリ</th>';
    users.forEach(u => { html += '<th class="' + (u.active ? '' : 'retired') + '">' + escapeHtml(u.short_name) + '</th>'; });
    html += '</tr></thead><tbody>';
    apps.forEach((app, ai) => {
      const notes = app.roles.map(r => roleText(r, app)).join(' / ');
      html += '<tr><td class="app-col' + (app.status === 'hidden' ? ' hidden-app' : '') + '">' + escapeHtml(app.icon + ' ' + app.label) +
        (app.status === 'hidden' ? '<span class="app-note">非表示中（ポータル非公開）</span>' : '') + '<span class="role-note">' + escapeHtml(notes) + '</span>';
      if (orderMode) html += '<div class="order-controls"><button data-move="' + ai + '" data-direction="-1" aria-label="' + escapeHtml(app.label + 'を上へ') + '"' + (ai === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button data-move="' + ai + '" data-direction="1" aria-label="' + escapeHtml(app.label + 'を下へ') + '"' + (ai === apps.length - 1 ? ' disabled' : '') + '>↓</button></div>';
      html += '</td>';
      users.forEach((u, ui) => {
        const key = cellKey(u.user_id, app.app_name), saved = (matrix.roles[u.user_id] || {})[app.app_name] || '';
        const role = dirty[key] ? dirty[key].next_role : saved;
        const disabled = orderMode || blocked(u, app) || (u.user_id === session.user_id && app.app_name === 'auth-admin');
        html += '<td class="cell' + (u.active ? '' : ' retired-col') + (dirty[key] ? ' changed' : '') + '"><button class="role-button" data-cell="' + ai + ',' + ui + '"' +
          (disabled ? ' disabled' : '') + ' aria-label="' + escapeHtml(u.name + ' / ' + app.label + ' / ' + roleText(role, app)) + '">' +
          '<span class="mark ' + (!role ? 'none' : ['user', 'admin'].includes(role) ? role : 'legacy') + '">' +
          escapeHtml(!role ? '−' : role === 'user' ? '利用' : role === 'admin' ? '管理' : '設定外') + '</span></button></td>';
      }); html += '</tr>';
    });
    $('content').className = ''; $('content').innerHTML = html + '</tbody></table></div>';
    $('content').querySelectorAll('[data-cell]').forEach(b => { b.onclick = () => {
      const [a, u] = b.dataset.cell.split(',').map(Number); cycleCell(users[u].user_id, apps[a].app_name);
    }; });
    $('content').querySelectorAll('[data-move]').forEach(b => { b.onclick = () => moveApp(Number(b.dataset.move), Number(b.dataset.direction)); });
    syncControls();
  }
  function syncControls() {
    const busy = saving || loading || !!pendingRequest || reconciling;
    $('reloadButton').disabled = saving || loading;
    $('orderModeButton').disabled = busy || orderMode || !matrix || !!(matrix.configuration_errors || []).length;
    $('showRetired').disabled = busy;
    $('cancelButton').disabled = busy;
    $('btnSave').disabled = busy || (!Object.keys(dirty).length && !orderDirty());
    $('btnSave').textContent = orderMode ? '順番を保存' : '権限を保存';
    $('modeLabel').textContent = orderMode ? '並び順の編集' : '権限の編集';
    $('notice').textContent = orderMode ? '↑↓で移動してください。ポータルも全員共通で同じ順番になります。権限の割当は変わりません。' :
      (matrix && (matrix.archived_roles || []).length ? '廃止済みアプリの割当は保持しています。全社管理者の設定はこの画面では変更しません。' : '全社管理者の設定はこの画面では変更しません。');
    $('saveBar').className = (orderMode || Object.keys(dirty).length) ? 'save-bar visible' : 'save-bar';
    $('saveCount').textContent = orderMode ? (orderDirty() ? '並び順を変更しています' : '↑↓でアプリを移動') : '権限の変更 ' + Object.keys(dirty).length + '件';
    $('content').querySelectorAll('button').forEach(b => { if (busy) b.disabled = true; });
  }
  function cycleCell(userId, appName) {
    if (saving || loading || pendingRequest || reconciling || orderMode) return;
    const app = matrix.apps.find(a => a.app_name === appName && a.status === 'active') || matrix.apps.find(a => a.app_name === appName), user = matrix.users.find(u => u.user_id === userId);
    if (!app || !user || blocked(user, app) || (userId === session.user_id && appName === 'auth-admin')) return;
    const key = cellKey(userId, appName), saved = (matrix.roles[userId] || {})[appName] || '';
    const current = dirty[key] ? dirty[key].next_role : saved;
    // 退職者は剥奪のみ可能。未知の保存値は保持し、元に戻せるようにする。
    const cycle = user.active ? ['', ...app.roles] : ['', saved];
    if (saved && !cycle.includes(saved)) cycle.push(saved);
    const next = cycle[(Math.max(0, cycle.indexOf(current)) + 1) % cycle.length];
    if (next === saved) delete dirty[key];
    else dirty[key] = { user_id: userId, app_name: appName, prev_role: saved, next_role: next };
    message(''); render();
  }
  function startOrderMode() {
    if (!matrix || saving || loading || pendingRequest || reconciling) return;
    if (Object.keys(dirty).length) { message('権限の変更を保存するか、取消してから並び順を変更してください。'); return; }
    orderMode = true; draftOrder = baseOrder(); message(''); render();
  }
  function moveApp(index, direction) {
    if (!orderMode || saving || loading || pendingRequest || reconciling) return;
    const next = index + direction;
    if (next < 0 || next >= draftOrder.length) return;
    [draftOrder[index], draftOrder[next]] = [draftOrder[next], draftOrder[index]];
    render();
    // 再描画後も移動ボタンへ戻し、キーボードで続けて操作できるようにする。
    const button = $('content').querySelector('[data-move="' + next + '"][data-direction="' + direction + '"]');
    if (button && !button.disabled) button.focus();
  }
  function cancelChanges() {
    if (saving || loading || pendingRequest || reconciling) return;
    dirty = Object.create(null); draftOrder = baseOrder(); orderMode = false; message('変更を取り消しました。'); render();
  }

  function openSaveDialog() {
    if (!hasChanges() || saving || loading || pendingRequest || reconciling) return;
    let body = '';
    if (orderMode) {
      const list = ids => '<ol class="order-list">' + ids.map(id => '<li>' + escapeHtml(matrix.apps.find(a => a.row_key === id).label) + '</li>').join('') + '</ol>';
      body = '<p>並び順だけを保存します。社員ごとの権限は変わりません。</p><div class="order-compare"><div><b>変更前</b>' + list(baseOrder()) + '</div><div><b>変更後</b>' + list(draftOrder) + '</div></div>';
      pendingRequest = { action: 'saveAppOrder', data: { request_id: genRequestId(), base_revision: matrix.order_revision, order: draftOrder.slice() } };
    } else {
      const changes = Object.values(dirty).map(c => ({ ...c }));
      changes.forEach(c => {
        const u = matrix.users.find(x => x.user_id === c.user_id), app = matrix.apps.find(a => a.app_name === c.app_name && a.status === 'active') || matrix.apps.find(a => a.app_name === c.app_name);
        body += '<div class="diff-row"><span>' + escapeHtml(u.name + ' / ' + app.label) + '</span><b>' + escapeHtml(roleText(c.prev_role, app) + ' → ' + roleText(c.next_role, app)) + '</b></div>';
      });
      pendingRequest = { action: 'saveMatrix', data: { request_id: genRequestId(), changes: changes } };
    }
    $('saveModalTitle').textContent = orderMode ? '並び順の確認' : '権限の変更内容';
    $('saveModalBody').innerHTML = body;
    $('saveModalFooter').innerHTML = '<button class="btn-cancel" onclick="closeSaveDialog()">戻る</button><button class="btn-save" id="btnConfirmSave" onclick="confirmSave()">この内容で保存</button>';
    $('saveModal').className = 'modal-backdrop visible'; syncControls(); $('btnConfirmSave').focus();
  }
  function closeSaveDialog() {
    if (saving || reconciling) return;
    pendingRequest = null; $('saveModal').className = 'modal-backdrop'; render();
  }
  async function confirmSave() {
    if (saving || !pendingRequest) return;
    saving = true; syncControls();
    $('saveModalFooter').innerHTML = '<button disabled>保存中...</button>';
    try {
      const res = await gasPost(pendingRequest.action, pendingRequest.data);
      // 成功/失敗いずれも再取得を挟む。結果不明のまま下書きを再編集しない。
      reconciling = true;
      $('saveModalBody').textContent = res.success ? (orderMode ? '並び順を保存しました。権限の割当は変更していません。' : res.applied + '件の権限を保存しました。') : errorText(res);
      $('saveModalFooter').innerHTML = '<button class="btn-save" onclick="loadMatrix()">最新の状態を確認</button>';
    } catch (_) {
      reconciling = true;
      $('saveModalBody').textContent = '応答を確認できませんでした。保存済みの可能性があります。同じ内容で結果を確認するか、最新の状態を読み込んでください。';
      $('saveModalFooter').innerHTML = '<button class="btn-cancel" onclick="loadMatrix()">最新の状態を確認</button><button class="btn-save" onclick="confirmSave()">同じ内容で結果を確認</button>';
    } finally { saving = false; syncControls(); }
  }
  function errorText(res) {
    const messages = { SESSION_INVALID: 'セッションを確認できません。ポータルからログインし直してください。', FORBIDDEN: 'この操作を行う権限がありません。',
      UNKNOWN_USER: '存在しない社員への保存を停止しました。', DUPLICATE_USER: '社員IDが重複しています。', INACTIVE_USER: '退職者には新しい権限を付与できません。',
      UNKNOWN_APP: 'アプリが見つかりません。', ARCHIVED_APP: '廃止済みアプリへの保存を停止しました。', INVALID_ROLE: 'このアプリで選べない権限です。',
      SELF_LOCKOUT: '自分の権限管理の管理権限は外せません。', DUPLICATE_ROLE: '権限行が重複しているため保存を停止しました。',
      CONFLICT: 'ほかの画面で権限が変更されました。最新の状態を確認してください。', ORDER_CONFLICT: 'アプリ一覧や順番が変更されました。最新の状態で並べ替え直してください。',
      APP_CONFIG_INVALID: 'アプリ一覧の設定に不備があります。設定を確認してください。', SCHEMA_INVALID: '管理データの構成を確認してください。変更は確定していません。',
      BUSY: 'ほかの保存処理が実行中です。少し待って最新の状態を確認してください。', SAVE_UNCERTAIN: '保存結果が確定できません。最新の状態を確認し、監査記録を照合してください。',
      REQUEST_REUSED: '保存の識別情報が一致しません。最新の状態を確認してください。', INVALID_ORDER: '並び順の一覧が一致しません。最新の状態を確認してください。' };
    return messages[res.error] || '処理を確認できませんでした。最新の状態を確認してください。';
  }
  function genRequestId() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
  async function gasPost(action, data) {
    const abort = new AbortController(), timer = setTimeout(() => abort.abort(), 45000);
    try {
      const res = await fetch(GAS_URL, { method: 'POST', signal: abort.signal, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, session_token: session.token, ...data }) });
      if (!res.ok) throw new Error('HTTP_ERROR');
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

</script>
</body>
