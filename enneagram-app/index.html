<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>エニアグラム・タイプ診断</title>
  <style>
    :root { --ink:#111; --muted:#5f5f63; --paper:#efefed; --panel:#fff; --line:#111; --accent:#ff4f19; --accent-soft:#ffe2d7; --warn:#9d2300; --warn-soft:#fff0ea; --focus:#0057ff; }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      font-size:16px; line-height:1.7; background-color:var(--paper);
      background-image:linear-gradient(60deg,rgba(255,255,255,.7) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.7) 75%),linear-gradient(120deg,rgba(255,255,255,.55) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.55) 75%);
      background-size:72px 124px; background-position:0 0,36px 62px;
    }
    button { font:inherit; cursor:pointer; }
    button:focus-visible { outline:4px solid var(--focus); outline-offset:4px; }
    .app { width:100%; max-width:940px; margin:0 auto; padding:0 20px 64px; }
    .brand { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 -20px; padding:22px 28px; color:#fff; background:var(--ink); border-bottom:6px solid var(--accent); }
    .brand-name { display:flex; align-items:center; gap:10px; font-family:Impact,"Arial Black","Yu Gothic",sans-serif; font-size:17px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .brand-name::before { content:""; display:inline-block; width:18px; height:18px; background:var(--accent); transform:rotate(45deg); box-shadow:inset 0 0 0 4px var(--ink),0 0 0 2px var(--accent); }
    .version { margin:0; padding:3px 9px; color:#fff; border:1px solid #fff; font-size:12px; font-weight:900; letter-spacing:.08em; white-space:nowrap; }
    .screen { margin-top:34px; }
    h1,h2,h3 { line-height:1.25; font-weight:900; letter-spacing:.01em; }
    h1 { font-size:clamp(28px,5vw,48px); margin:0 0 16px; }
    h2 { font-size:clamp(22px,3.8vw,34px); margin:0 0 16px; }
    h3 { font-size:18px; margin:0; }
    p { margin:0 0 16px; }
    .lead { max-width:760px; font-size:20px; font-weight:800; }
    .card { position:relative; background:var(--panel); border:2px solid var(--line); border-radius:0; padding:24px; margin:22px 0; box-shadow:8px 8px 0 var(--ink); clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px)); }
    .notice { color:#fff; background:var(--ink); border-left:8px solid var(--accent); padding:16px 18px; margin:24px 0; font-weight:700; }
    .privacy { color:var(--muted); font-size:14px; font-weight:700; }
    .primary,.secondary,.rating-button { min-height:52px; border:2px solid var(--ink); border-radius:0; padding:11px 18px; font-weight:900; }
    .primary { color:#fff; background:var(--ink); width:100%; clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
    .primary:hover { color:var(--ink); background:var(--accent); }
    .secondary { color:var(--ink); background:#fff; }
    .secondary:hover { background:#d8d8d5; }
    .actions { display:flex; gap:14px; justify-content:space-between; margin-top:30px; }
    .actions .primary { width:auto; margin-left:auto; }
    .progress-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; color:var(--ink); font-size:13px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .progress { height:12px; background:#c8c8c5; border:2px solid var(--ink); overflow:hidden; margin:8px 0 28px; transform:skewX(-18deg); }
    .progress > div { height:100%; background:repeating-linear-gradient(135deg,var(--accent) 0,var(--accent) 10px,#111 10px,#111 15px); transition:width .2s ease; }
    .scenario-card { padding-top:30px; }
    .scenario-card h1 { font-size:clamp(24px,4vw,36px); }
    .scenario-card::before,.self-observation-card::before { content:"◆"; position:absolute; top:-20px; left:calc(50% - 22px); display:grid; place-items:center; width:44px; height:44px; color:#fff; background:var(--ink); border:3px solid var(--accent); transform:rotate(45deg); font-size:0; }
    .scenario-number { display:inline-block; color:#fff; background:var(--ink); border-left:7px solid var(--accent); padding:5px 12px; font-size:13px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .scenario-prompt { border-top:2px solid var(--ink); padding-top:16px; font-size:18px; font-weight:900; }
    .answer-summary { padding:10px 14px; color:#fff; background:var(--ink); margin:18px 0; font-size:13px; font-weight:900; letter-spacing:.06em; }
    .option-list { display:grid; gap:20px; }
    .motive-option,.self-question { border:2px solid var(--line); border-radius:0; padding:18px; background:#fff; box-shadow:4px 4px 0 #b9b9b5; }
    .motive-option.answered,.self-question.answered { border-color:var(--accent); box-shadow:5px 5px 0 var(--accent); }
    .option-label { display:inline-block; color:#fff; background:var(--ink); padding:2px 9px; font-size:12px; font-weight:900; letter-spacing:.1em; }
    .option-text { margin:12px 0 18px; font-size:17px; font-weight:700; }
    .rating-actions { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; align-items:stretch; }
    .rating-button { min-width:0; min-height:68px; color:#fff; background:var(--ink); border-color:var(--ink); padding:8px 6px; font-size:13px; line-height:1.35; }
    .rating-button:nth-child(1),.rating-button:nth-child(2) { clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%); }
    .rating-button:nth-child(3) { aspect-ratio:1; max-width:72px; justify-self:center; border-radius:50%; padding:5px; }
    .rating-button:nth-child(4),.rating-button:nth-child(5) { clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%); }
    .rating-button:hover { color:var(--ink); background:#d8d8d5; }
    .rating-button[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); background:var(--accent); box-shadow:inset 0 0 0 3px #fff; }
    .self-observation-card { padding-top:30px; }
    .self-question { margin:18px 0; }
    .scenario-review { border-left:10px solid var(--accent); }
    .scenario-review ul { padding-left:22px; }
    .mode-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; align-items:stretch; }
    .mode-card { display:flex; flex-direction:column; margin:0; }
    .mode-card .primary { margin-top:auto; }
    .candidate-card { border-top:10px solid var(--accent); }
    .facet-list { margin:16px 0; padding-left:22px; font-weight:800; }
    .wing-reference { margin-bottom:0; }
    .answer-review ol { padding-left:24px; }
    .answer-review li { margin-bottom:12px; }
    .error { color:#fff; background:var(--warn); border:3px solid var(--ink); padding:12px 14px; margin:18px 0; font-weight:900; }
    .hidden { display:none !important; }
    .radar-wrap { width:100%; max-width:560px; margin:0 auto; }
    .radar-svg { display:block; width:100%; height:auto; overflow:visible; }
    .radar-grid { fill:none; stroke:#b2b2ae; stroke-width:1; }
    .radar-grid-outer { stroke:#111; stroke-width:2; }
    .radar-axis { stroke:#c5c5c1; stroke-width:1; }
    .radar-area { fill:rgba(255,79,25,.28); stroke:#111; stroke-width:3; }
    .radar-dot { fill:#fff; stroke:#111; stroke-width:3; }
    .radar-dot-top { fill:var(--accent); }
    .radar-label { fill:#111; font-size:15px; font-weight:900; text-anchor:middle; dominant-baseline:middle; cursor:pointer; }
    .radar-label:hover,.radar-label:focus { fill:var(--focus); text-decoration:underline; outline:none; }
    .radar-label-top { fill:#c52f00; font-size:17px; }
    .chart-help { color:var(--muted); font-size:14px; font-weight:700; }
    .score-nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:18px; }
    .score-button { min-height:48px; padding:10px 12px; border:2px solid var(--line); border-radius:0; background:#fff; color:var(--ink); text-align:left; font-weight:900; }
    .score-button:hover { color:#fff; background:var(--ink); }
    .score-button.top { border-color:var(--ink); background:var(--accent); box-shadow:4px 4px 0 var(--ink); }
    .wing-card { border-top:10px solid var(--accent); }
    .type-details { margin:34px 0; }
    .type-detail { border:2px solid var(--line); border-radius:0; background:var(--panel); margin:12px 0; overflow:hidden; scroll-margin-top:16px; }
    .type-detail summary { padding:16px 18px; font-weight:900; cursor:pointer; background:#fff; }
    .type-detail summary::marker { color:var(--accent); }
    .type-detail summary:focus-visible { outline:4px solid var(--focus); outline-offset:-4px; }
    .type-detail[open] summary { color:#fff; background:var(--ink); border-bottom:5px solid var(--accent); }
    .type-detail-body { padding:20px; }
    .type-illustration { margin:8px auto 22px; max-width:420px; text-align:center; }
    .illustration-img { display:block; width:100%; max-height:460px; object-fit:contain; border:2px solid var(--ink); border-radius:0; background:#efefed; box-shadow:7px 7px 0 var(--ink); }
    .illustration-caption { margin-top:12px; color:var(--muted); font-size:14px; font-weight:900; }
    .closing-message { border-top:10px solid var(--accent); }
    .subtitle { color:var(--muted); margin-top:-8px; font-weight:700; }
    .section-card { border-left:7px solid #111; padding:15px 17px; background:#f5f5f2; margin:16px 0; }
    .runaway { border-left-color:var(--warn); background:#fff2ed; }
    .runaway-step { border:2px solid #111; border-radius:0; padding:14px; margin-top:12px; background:#fff; }
    .runaway-step h3 { color:var(--warn); }
    .healing { border-left-color:var(--accent); background:var(--accent-soft); }
    .healing strong { display:block; margin-bottom:10px; }
    .disclaimer { font-size:14px; color:var(--muted); }
    @media (max-width:520px) {
      .app { padding:0 10px 42px; }
      .brand { margin:0 -10px; padding:17px 16px; border-bottom-width:5px; }
      .brand-name { font-size:12px; letter-spacing:.08em; }
      .brand-name::before { width:14px; height:14px; }
      .screen { margin-top:26px; }
      h1 { font-size:28px; }
      .lead { font-size:17px; }
      .card { padding:17px 14px; box-shadow:5px 5px 0 var(--ink); clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); }
      .scenario-card,.self-observation-card { padding-top:26px; }
      .option-text { font-size:15px; line-height:1.6; }
      .motive-option,.self-question { padding:13px 10px; box-shadow:3px 3px 0 #b9b9b5; }
      .rating-actions { grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; }
      .rating-button { min-height:76px; padding:5px 2px; font-size:11px; line-height:1.3; word-break:normal; }
      .rating-button:nth-child(3) { width:54px; max-width:100%; }
      .actions { gap:8px; }
      .primary,.secondary { padding:9px 12px; font-size:14px; }
      .score-nav { grid-template-columns:1fr; }
      .mode-grid { grid-template-columns:1fr; }
      .radar-label { font-size:14px; }
      .radar-label-top { font-size:15px; }
    }
    @media (max-width:360px) {
      .rating-button { min-height:80px; font-size:10px; }
      .rating-button:nth-child(3) { width:48px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
  </style>
</head>

  <script>
    // GASの表示倍率固定に備え、実際の画面幅を基準に縮小補正します。
    (function fixScale() {
      var iw = window.innerWidth;
      var sw = window.screen.width;
      if (sw > 0 && sw < iw) {
        var zoom = iw / sw;
        document.body.style.zoom = zoom;
        document.body.style.width = sw + 'px';
        document.body.style.maxWidth = sw + 'px';
        document.body.style.overflowX = 'hidden';
      }
    })();
  </script>

  <script id="app-data" type="application/json">

  "typeQuestions": [{"id":"ST1-01","version":"standard","typeId":1,"facet":"根元的恐れ","facetGroup":"core","text":"自分の判断ミスで人に迷惑をかけたと分かると、失敗したこと以上に、自分のあり方が間違っていたように感じる。"},{"id":"ST1-02","version":"standard","typeId":1,"facet":"恐れへの反応","facetGroup":"defense","text":"自分の間違いに気づいた後は、頭の中で何度も自分を責めてしまう。"},{"id":"ST1-03","version":"standard","typeId":1,"facet":"根元的欲求","facetGroup":"core","text":"誰も見ていなくても、自分が正しいと思える選択をしたい。"},{"id":"ST1-04","version":"standard","typeId":1,"facet":"満足条件","facetGroup":"acquisition","text":"やるべき手順を抜かさず終えられると安心する。"},{"id":"ST1-05","version":"standard","typeId":1,"facet":"戦略","facetGroup":"acquisition","text":"休みたい気持ちがあっても、先に「やるべきこと」を終えようとする。"},{"id":"ST1-06","version":"standard","typeId":1,"facet":"回避","facetGroup":"defense","text":"腹が立ったとき、「怒っている」と認めるより、相手の間違いを指摘したくなる。"},{"id":"ST1-07","version":"standard","typeId":1,"facet":"注意の向き","facetGroup":"automatic","text":"全体がうまくできていても、一つの不備が先に目に入る。"},{"id":"ST1-08","version":"standard","typeId":1,"facet":"自動反応","facetGroup":"automatic","text":"休もうとしたときに未完了のことを思い出すと、先に終えないと落ち着かない。"},{"id":"ST2-01","version":"standard","typeId":2,"facet":"根元的恐れ","facetGroup":"core","text":"親しい人からの反応が薄いと、自分はもう大切にされていないのではと不安になる。"},{"id":"ST2-02","version":"standard","typeId":2,"facet":"恐れへの反応","facetGroup":"defense","text":"人の関心が自分から離れたと感じると、相手の役に立つことを探し始める。"},{"id":"ST2-03","version":"standard","typeId":2,"facet":"根元的欲求","facetGroup":"core","text":"誰かに頼られると、自分が大切な存在だと感じる。"},{"id":"ST2-04","version":"standard","typeId":2,"facet":"満足条件","facetGroup":"acquisition","text":"自分の気遣いで相手が喜ぶと、その人とのつながりを強く感じる。"},{"id":"ST2-05","version":"standard","typeId":2,"facet":"戦略","facetGroup":"acquisition","text":"自分の希望を伝える前に、相手が何を望んでいるかを考える。"},{"id":"ST2-06","version":"standard","typeId":2,"facet":"回避","facetGroup":"defense","text":"何をしてほしいか聞かれても、相手の負担になりそうだと希望を言いにくい。"},{"id":"ST2-07","version":"standard","typeId":2,"facet":"注意の向き","facetGroup":"automatic","text":"人が集まると、困っていそうな人がいないかに目が向く。"},{"id":"ST2-08","version":"standard","typeId":2,"fac
