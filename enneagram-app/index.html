<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>エニアグラム・タイプ診断</title>
  <style>
    :root { color-scheme:light; --ink:#172d3b; --muted:#5c717c; --paper:#f3f7f8; --panel:#fff; --line:#dce6e9; --accent:#087f78; --accent-soft:#e2f5f0; --warn:#a34b22; --warn-soft:#fff3e9; --focus:#087f78; --shadow:0 16px 48px -28px #20495445; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; font-size:16px; line-height:1.8; background:radial-gradient(ellipse at 0 0,#def3ed 0,transparent 48%),radial-gradient(ellipse at 100% 25%,#e5eef9 0,transparent 48%),var(--paper); background-attachment:fixed; }
    button,select { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .app { width:100%; max-width:1040px; margin:0 auto; padding:env(safe-area-inset-top) max(32px,env(safe-area-inset-right)) 64px max(32px,env(safe-area-inset-left)); }
    .brand { height:88px; display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid #bfd5d67a; }
    .brand-name { display:flex; align-items:center; gap:13px; font-size:12px; font-weight:700; letter-spacing:.17em; }
    .brand-name::before { content:""; width:24px; height:24px; border:1.5px solid var(--accent); border-radius:50%; box-shadow:inset 5px 0 0 #81d4be; transform:rotate(-35deg); }
    .version { margin:0; padding:3px 9px; color:var(--muted); background:#ffffff9c; border:1px solid var(--line); border-radius:20px; font-size:11px; letter-spacing:.05em; }
    .screen { margin-top:42px; }
    h1,h2,h3 { line-height:1.5; letter-spacing:.01em; font-weight:700; }
    h1 { font-size:clamp(28px,4.5vw,44px); margin:0 0 20px; letter-spacing:-.03em; }
    h2 { font-size:clamp(20px,3vw,26px); margin:0 0 16px; }
    h3 { font-size:16px; margin:0 0 8px; }
    p { margin:0 0 16px; }
    .lead { max-width:760px; font-size:18px; color:#465f6a; line-height:1.9; }
    .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:28px; margin:24px 0; box-shadow:var(--shadow); }
    .card > :last-child { margin-bottom:0; }
    .notice { color:#67462e; background:var(--warn-soft); border:1px solid #f0dac5; border-radius:16px; padding:18px 22px; margin:22px 0; font-size:14px; }
    .privacy,.chart-help,.disclaimer { color:var(--muted); font-size:13px; line-height:1.85; }
    .primary,.secondary { min-height:48px; border:1px solid transparent; border-radius:13px; padding:11px 20px; font-weight:600; transition:background .15s,box-shadow .15s; }
    .primary { width:100%; background:var(--ink); color:#fff; box-shadow:0 4px 12px #172d3b12; }
    .primary:hover { background:#245368; }
    .secondary { color:var(--ink); background:#f4f8f9; border-color:var(--line); }
    .secondary:hover { background:#e4efee; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; margin-top:26px; }
    .actions .primary { width:auto; margin-left:auto; }
    .scenario-number { display:inline-flex; align-items:center; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin:0 0 12px; }
    .scenario-number::before { content:""; width:6px; height:6px; background:#3bbfa0; border-radius:50%; margin-right:8px; }
    .scenario-prompt { font-size:15px; color:var(--muted); margin:14px 0 0; }
    .answer-summary { color:#146355; background:var(--accent-soft); border-radius:12px; padding:12px 16px; margin:16px 0; font-size:13px; font-weight:600; }
    .mode-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin:28px 0 20px; }
    .mode-card { display:flex; flex-direction:column; margin:0; padding:30px; }
    .mode-card:first-child { border-color:#a0cfc3; background:linear-gradient(140deg,#fff,#f2faf7); }
    .mode-card .primary { margin-top:auto; }
    .mode-card h2 { font-size:28px; }
    .mode-card p:not(.scenario-number) { color:var(--muted); font-size:14px; }
    .role-off-scenes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:22px 0; counter-reset:scene; }
    .role-off-scenes p { min-height:128px; margin:0; padding:18px; background:#f4f8f8; border:1px solid #e1ebed; border-radius:16px; font-size:15px; }
    .role-off-scenes p::before { counter-increment:scene; content:"0" counter(scene); display:block; color:var(--accent); font-size:12px; margin-bottom:12px; }
    .life-domain { display:inline-flex; align-items:center; width:fit-content; margin:0 0 16px; padding:4px 10px; color:var(--accent); background:var(--accent-soft); border-radius:8px; font-size:12px; font-weight:600; }
    .candidate-card { border-top:3px solid #74baa8; }
    .facet-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; padding:0; list-style:none; margin:22px 0; }
    .facet-list li { padding:10px 12px; border-radius:10px; background:#f3f7f8; font-size:13px; }
    .section-card { padding:18px 20px; background:#f4f8f9; border:1px solid #e3ecee; border-radius:16px; margin:14px 0; }
    .section-card p { margin:0; font-size:14px; }
    .section-card h3 { color:#315565; }
    .healing { background:#edf8f3; border-color:#d3eadf; }
    .runaway { background:#fcf6ef; border-color:#f0e5d7; }
    .wing-reference { margin-bottom:0; }
    .wing-reference .chart-help { margin-top:10px; font-size:12px; }
    .pair-select { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .pair-select label { display:block; font-size:13px; font-weight:600; }
    .pair-select select { width:100%; min-height:48px; margin-top:8px; padding:8px 12px; background:#fff; color:var(--ink); border:1px solid #b6ccd2; border-radius:10px; }
    .pair-question { min-width:0; margin:24px 0; padding:16px; border:1px solid var(--line); border-radius:16px; }
    .pair-question legend { font-size:14px; padding:0 8px; }
    .pair-options { display:grid; gap:10px; margin:10px 0; }
    .pair-options .secondary { text-align:left; font-size:14px; }
    .pair-options [aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); }
    .comparison-output { margin:16px 0 0; font-size:14px; font-weight:600; }
    .error { color:#9a381b; background:#fff0eb; border:1px solid #f1c8ba; border-radius:12px; padding:12px 14px; margin:14px 0; font-size:14px; }
    .hidden { display:none !important; }
    .radar-wrap { width:100%; max-width:540px; margin:20px auto; }
    .radar-svg { display:block; width:100%; height:auto; overflow:visible; }
    .radar-grid { fill:none; stroke:#dae6e9; stroke-width:1; }
    .radar-grid-outer { stroke:#acc5ca; stroke-width:1; }
    .radar-axis { stroke:#dae6e9; stroke-width:1; }
    .radar-area { fill:#159a8020; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; }
    .radar-dot { fill:#fff; stroke:var(--accent); stroke-width:2; }
    .radar-dot-top { fill:var(--accent); }
    .radar-label { fill:var(--muted); font-size:14px; font-weight:600; text-anchor:middle; dominant-baseline:middle; cursor:pointer; }
    .radar-label:hover,.radar-label:focus { fill:var(--accent); text-decoration:underline; }
    .radar-label-top { fill:var(--accent); font-weight:700; }
    .score-nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:20px; }
    .score-button { min-height:48px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); text-align:left; font:inherit; font-size:14px; }
    .score-button:hover { background:#f4f8f8; }
    .score-button.top { border-color:#a0cfc3; background:#ecf8f3; color:#176953; }
    .type-details { margin:36px 0; }
    .type-detail { background:#fff; border:1px solid var(--line); border-radius:16px; margin:12px 0; scroll-margin-top:20px; }
    .type-detail summary { padding:18px 22px; font-size:15px; font-weight:600; cursor:pointer; }
    .type-detail summary::marker { color:var(--accent); }
    .type-detail[open] summary { border-bottom:1px solid var(--line); }
    .type-detail-body { padding:22px; }
    .type-illustration { margin:8px auto 22px; max-width:360px; text-align:center; }
    .illustration-img { display:block; width:100%; max-height:380px; object-fit:contain; border-radius:16px; background:#f2f6f7; }
    .illustration-caption { margin-top:12px; color:var(--muted); font-size:13px; }
    .subtitle { color:var(--muted); font-size:14px; }
    .closing-message { background:linear-gradient(120deg,#e8f5f0,#f7fafb); }
    .answer-review ol { padding-left:22px; }
    .answer-review li { margin-bottom:22px; font-size:14px; }
    .answer-review li button { display:block; margin-top:10px; font-size:12px; }

    /* 質問画面は表示可能な高さを使い、操作欄まで一つのレイアウトに収めます。 */
    body.question-view .app { min-height:100svh; padding-bottom:0; display:flex; flex-direction:column; }
    body.question-view .brand { height:64px; flex:none; }
    .question-screen { margin:0; min-height:calc(100svh - 64px - env(safe-area-inset-top)); display:flex; flex-direction:column; gap:20px; padding:22px 0 max(18px,env(safe-area-inset-bottom)); }
    .question-status { flex:none; }
    .progress-head { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .progress-head strong { font-size:14px; color:var(--ink); font-weight:600; }
    .progress { height:4px; background:#dce7e8; border-radius:4px; overflow:hidden; margin:12px 0 0; }
    .progress > div { height:100%; border-radius:4px; background:linear-gradient(90deg,#087f78,#5ebfa3); transition:width .18s ease; }
    .answer-count { margin:0; }
    .help-button { display:inline-grid; place-items:center; padding:0; width:32px; height:32px; border:1px solid #c0d3d7; color:var(--muted); border-radius:50%; background:#ffffffb0; font-size:14px; }
    .question-screen .scenario-card { flex:1; display:grid; grid-template-columns:1.05fr 1fr; align-content:center; align-items:center; gap:40px; margin:0; padding:38px; min-width:0; }
    .question-copy { min-width:0; }
    .question-screen h1 { font-size:clamp(23px,3vw,30px); line-height:1.7; letter-spacing:.01em; margin:0; overflow-wrap:anywhere; }
    .question-screen h1:focus { outline:none; }
    .motive-option { min-width:0; }
    .rating-actions { display:grid; grid-template-columns:1fr; gap:9px; }
    .rating-button { display:flex; align-items:center; gap:13px; min-width:0; min-height:54px; padding:12px 16px; border:1px solid #d4e1e5; border-radius:13px; background:#f8fafb; color:var(--ink); font-size:14px; font-weight:500; line-height:1.45; text-align:left; transition:background .14s,border-color .14s; }
    .rating-button::before { content:""; width:18px; height:18px; border:1.5px solid #a9bfc7; border-radius:50%; flex:none; background:#fff; }
    .rating-button:hover { background:#eef7f4; border-color:#86b6a9; }
    .rating-button[aria-pressed="true"] { background:#e1f4ed; border-color:var(--accent); color:#145d4d; }
    .rating-button[aria-pressed="true"]::before { background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 4px #fff; }
    .question-screen .actions { flex:none; display:grid; grid-template-columns:1fr 1fr 2fr; gap:10px; margin:0; }
    .question-screen .actions .primary { width:100%; margin:0; background:var(--accent); }
    .question-screen .actions .primary:hover { background:#08685f; }
    .question-screen .actions button { min-height:50px; padding:10px; font-size:14px; }
    .question-screen .actions .back-placeholder { min-height:0; }
    .question-screen .actions .result-update { grid-column:1/-1; }
    .question-screen .error { margin:12px 0 0; font-size:12px; padding:8px 10px; }
    .question-screen .progress-head .error { margin:0; padding:0; border:0; border-radius:0; background:none; font-size:11px; line-height:1.4; }
    .answer-help { width:min(480px,calc(100% - 32px)); max-height:calc(100svh - 48px); padding:26px; color:var(--ink); border:1px solid var(--line); border-radius:22px; box-shadow:0 24px 100px #172d3b30; }
    .answer-help::backdrop { background:#172d3b65; backdrop-filter:blur(5px); }
    .answer-help h2 { font-size:22px; }
    .answer-help p { font-size:14px; }
    @media (min-width:761px) { .start-screen > h1 { margin-top:64px; } .start-screen > .lead { max-width:700px; margin-bottom:36px; } }
    @media (max-width:760px) {
      .app { padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) 40px max(20px,env(safe-area-inset-left)); }
      .brand { height:68px; }
      .brand-name { font-size:10px; letter-spacing:.12em; gap:9px; }
      .brand-name::before { width:20px; height:20px; }
      .screen { margin-top:28px; }
      .card { padding:22px; border-radius:20px; }
      .lead { font-size:16px; }
      .mode-grid { grid-template-columns:1fr; gap:14px; }
      .role-off-scenes { grid-template-columns:1fr; gap:8px; }
      .role-off-scenes p { min-height:0; padding:14px; display:flex; align-items:center; gap:16px; }
      .role-off-scenes p::before { margin:0; }
      .pair-select,.score-nav { grid-template-columns:1fr; }
      .facet-list { grid-template-columns:1fr; gap:6px; }
      .type-detail-body { padding:16px; }
      body.question-view .app { padding-right:max(16px,env(safe-area-inset-right)); padding-left:max(16px,env(safe-area-inset-left)); }
      body.question-view .brand { height:44px; }
      .question-screen { min-height:calc(100svh - 44px - env(safe-area-inset-top)); margin:0; padding:12px 0 max(12px,env(safe-area-inset-bottom)); gap:12px; }
      .question-screen .scenario-card { display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:22px; padding:24px 20px; border-radius:22px; }
      .question-screen h1 { font-size:24px; line-height:1.6; }
      .question-screen .life-domain { margin-bottom:12px; }
      .rating-button { min-height:48px; padding:10px 13px; font-size:14px; }
      .rating-actions { gap:8px; }
      .question-screen .actions { gap:8px; }
      .question-screen .actions button { min-height:48px; font-size:13px; }
    }
    /* 小さいスマホやブラウザーの操作バーが開いた状態では、余白から縮めます。 */
    @media (max-width:760px) and (max-height:700px) {
      .question-screen { gap:9px; padding-top:8px; padding-bottom:max(8px,env(safe-area-inset-bottom)); }
      .question-screen .scenario-card { gap:14px; padding:16px; }
      .question-screen h1 { font-size:21px; line-height:1.5; }
      .question-screen .life-domain { margin-bottom:8px; padding:3px 8px; font-size:11px; }
      .rating-actions { gap:6px; }
      .rating-button { min-height:44px; padding:8px 12px; font-size:13px; }
      .question-screen .actions button { min-height:44px; }
      .progress { margin-top:6px; }
    }
    @media (max-width:760px) and (max-height:600px) {
      body.question-view .app { padding-left:max(12px,env(safe-area-inset-left)); padding-right:max(12px,env(safe-area-inset-right)); }
      body.question-view .brand { height:36px; }
      .question-screen { min-height:calc(100svh - 36px - env(safe-area-inset-top)); gap:8px; padding-top:6px; padding-bottom:max(6px,env(safe-area-inset-bottom)); }
      .question-screen .scenario-card { gap:10px; padding:12px; border-radius:18px; }
      .question-screen h1 { font-size:19px; line-height:1.45; }
      .question-screen .life-domain { margin-bottom:6px; padding:2px 8px; }
      .rating-actions { gap:4px; }
      .help-button { width:28px; height:28px; }
      .question-screen .error { margin-top:8px; }
    }
    @media (max-width:760px) and (max-height:540px) {
      body.question-view .brand { height:28px; }
      .question-screen { min-height:calc(100svh - 28px - env(safe-area-inset-top)); gap:6px; padding-top:4px; padding-bottom:max(4px,env(safe-area-inset-bottom)); }
      .question-screen .scenario-card { padding:4px 12px; gap:6px; }
      .question-screen h1 { font-size:17px; line-height:1.45; }
      .question-screen .life-domain { font-size:10px; margin-bottom:4px; padding:0 6px; }
      .help-button { height:24px; width:24px; }
      .progress { height:3px; margin-top:4px; }
      .question-screen .actions button { line-height:1.4; padding:8px; }
    }
    @media (max-width:360px) { .app { padding-left:max(14px,env(safe-area-inset-left)); padding-right:max(14px,env(safe-area-inset-right)); } .brand-name { font-size:9px; letter-spacing:.08em; } .card { padding:18px; } }
    /* 横向きでは質問と回答を左右に配置。文字拡大時には自然なスクロールを許可します。 */
    @media (max-height:480px) and (min-width:600px) {
      body.question-view .brand { height:30px; }
      .question-screen { min-height:calc(100svh - 30px - env(safe-area-inset-top)); padding:5px 0 max(5px,env(safe-area-inset-bottom)); gap:6px; }
      .question-screen .scenario-card { display:grid; grid-template-columns:1fr 1fr; padding:6px 14px; gap:22px; }
      .question-screen h1 { font-size:20px; }
      .help-button { width:28px; height:24px; }
      .progress-head { line-height:1.4; }
      .progress { margin-top:4px; }
      .rating-actions { gap:4px; }
      .rating-button { min-height:44px; padding:6px 10px; font-size:12px; }
      .question-screen .actions button { min-height:44px; padding:6px 10px; line-height:1.4; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }
  </style>
</head>
